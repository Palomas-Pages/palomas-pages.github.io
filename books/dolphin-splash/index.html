<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dolphin Splash</title>
<script src="../../pp-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, playful, read-aloud for a 4-year-old; every instruction is spoken
   IDEA: a beach-shop rack of foil blind bags, each holding a dolphin figurine on a little wave stand
   PICTURE: sea-glass bags that squish and rip open; code-drawn dolphins; two big tappable hands for counting
   COLOUR+TYPE: tropical sea blue with bubbles, sunny yellow and coral accents; Baloo 2 rounded numerals, Nunito
   LAYOUT: shelf of numbered bags -> unboxing stage: bag, things to count, big number + check, two hands */
:root{color-scheme:light dark;--bg:light-dark(#5cc8ef,#0f2a4a);--bg2:light-dark(#2f9fd6,#0a1f38);--dot:light-dark(#ffffff40,#ffffff18);--ink:light-dark(#0f2a4a,#eaf8ff);--card:light-dark(#fffdf6,#163a60);--line:light-dark(#0f2a4a22,#ffffff26);--soft:light-dark(#24496e,#bfe3f5);--key:light-dark(#fff1b8,#2a4f78);--hot:#ff5c8a;--ok:#12a862;--skin:#ffcfab;--skin2:#e8a77d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(var(--dot) 5px,transparent 6px) 0 0/46px 46px,radial-gradient(var(--dot) 3px,transparent 4px) 23px 23px/46px 46px,linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--ink);font:600 17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid #ffd23f;outline-offset:3px;border-radius:12px}
h1,h2{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.top{max-width:1100px;margin:0 auto;padding:22px max(4vw,16px) 6px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
h1{font-size:clamp(40px,8vw,56px);font-weight:800;color:#fff;text-shadow:0 4px 0 #0f2a4a40}
.lede{margin:4px 0 0;color:#fff;max-width:40ch;text-shadow:0 1px 2px #0f2a4a60}
.prog{display:flex;flex-direction:column;gap:6px;font-weight:800;color:#fff}
.meter{width:200px;height:16px;border-radius:9px;background:#ffffff40;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:#ffd23f;border-radius:9px;transition:width .8s}
.hrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:15px;font-weight:800;padding:8px 16px;border-radius:99px;background:#ffffffd0;color:#0f2a4a;min-height:44px}
#bonus{max-width:1100px;margin:6px auto 0;padding:0 max(4vw,16px);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:#fff;font-weight:800}
#bonus[hidden]{display:none}
.grid{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px) 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:26px 18px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.slot:hover{transform:translateY(-4px) rotate(-1deg)}
.slot:nth-child(3n+1) .mini{transform:rotate(-3deg)}.slot:nth-child(3n+2) .mini{transform:rotate(2deg)}
.nm{font-size:15px;font-weight:800;text-align:center;line-height:1.2;color:#fff;text-shadow:0 1px 2px #0f2a4a80}
.lock .mini{filter:grayscale(.6) brightness(.8) drop-shadow(0 6px 6px #0003)}
.lk{position:absolute;inset:18% 8% auto;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000a}
.lk svg{width:34px;height:34px}
.toybox{display:block;width:100%;aspect-ratio:140/130;border-radius:20px;background:radial-gradient(circle at 50% 50%,var(--g),transparent 68%)}
.toybox svg{width:100%;height:100%;display:block}
.new{animation:pop2 .9s}
@keyframes pop2{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.foot{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px) 36px;font-size:14px;color:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot button{text-decoration:underline;min-height:40px}
.foot .yes{background:var(--hot);color:#fff;text-decoration:none;border-radius:99px;padding:6px 14px}
/* foil bags */
.bag{display:block;position:relative;width:100%;aspect-ratio:3/4}
.mini{font-size:11px;filter:drop-shadow(0 6px 6px #0003)}
.zz,.pt,.pb{display:block;position:absolute;inset:0;background:linear-gradient(150deg,var(--c1),var(--c2) 55%,var(--c1))}
.zz::after,.pt::after,.pb::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,#ffffff8c 46%,transparent 60%) 0 0/260% 100%;animation:sh 3.4s linear infinite;pointer-events:none}
@keyframes sh{from{background-position:130% 0}to{background-position:-140% 0}}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;padding-top:1.4em;color:#fff;text-align:center}
.hole{position:absolute;top:5.5%;left:50%;width:1.2em;height:.55em;margin-left:-.6em;border-radius:99px;background:#0003}
.brand{font:800 1em/.95 'Baloo 2',sans-serif;letter-spacing:.03em;text-shadow:0 2px 0 #0003}
.win{position:relative;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#ffffffee,#ffffff80);display:grid;place-items:center;box-shadow:inset 0 0 0 .2em #ffffffa0;overflow:hidden}
.win>b,.q{font:800 2.6em/1 'Baloo 2',sans-serif;color:var(--c1)}
.tag{font:800 1.3em/1.25 'Baloo 2',sans-serif;background:#fff;color:var(--c1);border-radius:99px;padding:0 .6em;font-style:normal}
/* stage */
#play{position:fixed;inset:0;z-index:5;background:inherit;overflow-y:auto;display:none}
#play.on{display:block}
.stage{max-width:620px;margin:0 auto;padding:12px 14px 32px;display:grid;justify-items:center;gap:10px}
.bar{width:100%;display:flex;justify-content:space-between;gap:10px}
.back{font-weight:800;font-size:16px;min-height:48px;padding:0 16px;border-radius:99px;background:var(--card)}
.left{display:grid;justify-items:center;gap:6px;width:100%}
.bagwrap{position:relative;width:min(60vw,230px);aspect-ratio:3/4;font-size:19px;transition:width .5s,font-size .5s}
.bagwrap::before{content:'';position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(var(--glow),transparent 62%);opacity:0;transition:opacity .8s}
.bagwrap.glow::before{opacity:1;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.feel .bagwrap{animation:tease 2.6s ease-in-out infinite}
@keyframes tease{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(-7deg)}87%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
.big{position:absolute;inset:0;cursor:pointer;filter:drop-shadow(0 12px 14px #0005);--op:0;--bl:10px}
.big .win svg{position:absolute;inset:4%;width:92%;height:92%;filter:brightness(0) blur(var(--bl));opacity:var(--op);transition:opacity .6s,filter .6s}
.big .q{position:absolute;opacity:calc(1 - var(--op) * 1.3);transition:opacity .6s}
.sq{animation:sq .4s}
@keyframes sq{30%{transform:scale(1.13,.84)}60%{transform:scale(.93,1.07)}}
.clue{margin:0;min-height:2.6em;text-align:center;font:800 22px/1.25 'Baloo 2',sans-serif;max-width:28ch;color:#fff;text-shadow:0 2px 3px #0f2a4a80}
.solving .bagwrap{width:min(26vw,104px);font-size:8.5px}
.solving .clue{font-size:18px;min-height:0}
.reveal .big{touch-action:none}
.reveal .pt{transform-origin:100% 22%;transform:rotate(calc(var(--tp,0) * -16deg)) translateY(calc(var(--tp,0) * -5%))}
.tline{position:absolute;left:5%;right:5%;top:21.5%;border-top:3px dashed #fff;opacity:0;pointer-events:none;filter:drop-shadow(0 1px 1px #0006)}
.fing{position:absolute;top:30%;left:50%;width:64px;height:64px;margin-left:-32px;border-radius:50%;border:5px solid #fff;opacity:0;pointer-events:none;box-shadow:0 0 0 4px #ffffff60}
.reveal:not(.ripped) .tline{opacity:1}
.reveal:not(.ripped) .fing{opacity:1;animation:tapme 1.1s ease-in-out infinite}
@keyframes tapme{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.7);opacity:.5}}
.rays{position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(var(--glow) 0 9deg,transparent 9deg 20deg);-webkit-mask:radial-gradient(#000 15%,transparent 66%);mask:radial-gradient(#000 15%,transparent 66%);opacity:0;pointer-events:none}
.ripped .rays{opacity:1;transition:opacity .6s .3s;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.ripped .big{pointer-events:none}
.ripped .pt{animation:fly .7s forwards}
@keyframes fly{to{transform:translate(75%,-95%) rotate(42deg);opacity:0}}
.ripped .pb{animation:drop .9s .2s forwards}
@keyframes drop{to{transform:translateY(85%) scale(.9);opacity:0}}
.toyout{position:absolute;left:50%;top:50%;width:130%;transform:translate(-50%,-30%) scale(.1);opacity:0;pointer-events:none}
.toyout svg{width:100%;display:block}
.ripped .toyout{animation:pop .9s .35s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.view .toyout{animation:none;transform:translate(-50%,-50%);opacity:1}
.view .big,.view .clue{display:none}
/* puzzle card */
.card{display:none;width:100%;background:var(--card);border-radius:28px;padding:14px 12px 16px;box-shadow:0 8px 0 #0000001c;flex-direction:column;align-items:center;gap:10px}
.solving .card{display:flex;animation:up .45s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.things{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;width:100%}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:6px 8px;border-radius:20px;background:light-dark(#e6f7ff,#1d4a78);max-width:100%}
.plus{font:800 54px/1 'Baloo 2',sans-serif;color:var(--hot)}
.obj{position:relative;width:58px;height:50px;display:grid;place-items:center;transition:transform .2s}
.obj svg{width:100%;height:100%}
.obj.lit{transform:scale(1.25);filter:drop-shadow(0 0 8px #ffd23f)}
.obj b{position:absolute;right:-2px;top:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--hot);color:#fff;font:800 15px/24px 'Baloo 2',sans-serif;text-align:center;display:none}
.obj.on b{display:block}
.obj.on svg{opacity:.55}
.sum{font:800 26px/1 'Baloo 2',sans-serif;color:var(--soft)}
.row{display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
.num{min-width:96px;height:84px;border-radius:24px;border:5px dashed var(--hot);display:grid;place-items:center;font:800 64px/1 'Baloo 2',sans-serif;color:var(--hot);transition:transform .2s}
.num.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.num.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
.go{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;box-shadow:0 6px 0 #0b7a45;display:grid;place-items:center}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #0b7a45}
.go svg{width:48px;height:48px}
.rnd{width:52px;height:52px;border-radius:50%;background:var(--key);display:grid;place-items:center}
.rnd svg{width:26px;height:26px}
.hands{display:flex;justify-content:center;gap:22px;width:100%}
.hand{width:min(40vw,200px);height:auto;overflow:visible}
.fg{cursor:pointer}
.fg .f{fill:var(--skin);stroke:#8a5236;stroke-width:3;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.42);transition:transform .22s cubic-bezier(.2,1.4,.4,1)}
.fg .nail{fill:#fff;opacity:.55;transform-box:fill-box;transition:opacity .2s}
.fg.up .f{transform:scaleY(1)}
.fg:not(.up) .nail{opacity:0}
.fg .lab{opacity:0;transition:opacity .2s}
.fg.up .lab{opacity:1}
.fg .lab circle{fill:var(--hot)}
.fg .lab text{font:800 15px 'Baloo 2',sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.palm{fill:var(--skin);stroke:#8a5236;stroke-width:3}
.msg{margin:0;text-align:center;font-weight:800;min-height:1.5em;max-width:34ch;font-size:18px}
.bad{animation:no .4s}
@keyframes no{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.prize{display:none;text-align:center;gap:8px;justify-items:center}
.done .prize{display:grid;animation:up .5s}
.rar{color:#fff;font-weight:800;border-radius:99px;padding:2px 14px;font-size:16px}
.prize h2{font-size:clamp(40px,10vw,56px);font-weight:800;color:#fff;text-shadow:0 3px 0 #0f2a4a40}
.sub{margin:0;font-weight:800;max-width:30ch;color:#fff}
.cta{min-height:56px;padding:0 26px;border-radius:99px;background:var(--hot);color:#fff;font:800 22px 'Baloo 2',sans-serif;box-shadow:0 5px 0 #0003;margin-top:6px}
.dol .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.shiny{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #ffd23f)}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.3) rotate(45deg);opacity:.4}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf i{position:absolute;top:-20px;border-radius:50%;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:900px){
 .stage.solving{max-width:1040px;grid-template-columns:260px minmax(0,1fr);align-items:start}
 .stage.solving .bar{grid-column:1/-1}
 .stage.solving .bagwrap{width:220px;font-size:18px}
 .stage.solving .left{position:sticky;top:12px}
}
@media(prefers-reduced-motion:reduce){.feel .bagwrap,.zz::after,.pt::after,.pb::after,.ripped .rays,.dol .eyes,.tw,.bagwrap.glow::before,.reveal:not(.ripped) .fing{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Dolphin Splash</h1>
    <p class="lede">Count with your fingers to open the bags and find the dolphins!</p>
  </div>
  <div class="prog">
    <span id="count">0 of 13 dolphins</span>
    <span class="meter"><i id="meter"></i></span>
    <span class="hrow"><button class="pill" id="shelfbtn">‹ Bookshelf</button><button class="pill" id="snd1">Sound on</button></span>
  </div>
</header>
<div id="bonus" hidden></div>
<main class="grid" id="grid"></main>
<footer class="foot" id="foot"><button id="reset">Grown-ups: start the collection over</button></footer>
<div id="play"><div class="stage" id="stage"></div></div>
<div id="toast"></div>
<script>
{

 splash:{name:'Splash',r:1,c:'#4aa8f0',b:'#d8f0ff',pat:'none',acc:'none',cw:'ocean blue'},

 {id:'1',t:'c',n:3,o:'fish',toy:'splash'},{id:'2',t:'c',n:2,o:'shell',toy:'bubbles'},{id:'3',t:'c',n:5,o:'star',toy:'coral'},
 {id:'4',t:'a',a:1,b:1,o:'fish',toy:'squeaky'},{id:'5',t:'c',n:4,o:'shell',toy:'pearl'},{id:'6',t:'a',a:2,b:1,o:'star',toy:'twirl'},
 {id:'7',t:'c',n:6,o:'fish',toy:'sunny'},{id:'8',t:'a',a:2,b:2,o:'shell',toy:'finn'},{id:'9',t:'a',a:3,b:1,o:'fish',toy:'ziggy'},
 {id:'10',t:'c',n:7,o:'star',toy:'bluebell'},{id:'11',t:'a',a:3,b:2,o:'star',toy:'moonlight'},{id:'12',t:'a',a:4,b:2,o:'fish',toy:'rainbow'},
 {id:'★',t:'a',a:5,b:5,o:'shell',toy:'golden',secret:1}];

const UNDO='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4V2M4.5 7A8 8 0 1 1 4 13" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

try{const v=window.PP&&PP.load(GAME_ID);if(v&&v.got)S=v}catch(e){}

{const n=12,top=[],bot=[],tear=[];for(let i=0;i<=n;i++)top.push(`${(i*100/n).toFixed(2)}% ${i%2?0:3}%`);for(let i=n;i>=0;i--)bot.push(`${(i*100/n).toFixed(2)}% ${i%2?100:97}%`);

 phase('view');show();prize(1);$('#back').onclick=close;$('#snd2').onclick=toggleSnd;say(`Hi! I’m ${t.name}!`)}
function show(){$('#play').classList.add('on');$('#play').scrollTop=0;document.body.style.overflow='hidden'}
function close(){$('#play').classList.remove('on');document.body.style.overflow='';Voice.stop();const id=cur&&cur.ph==='done'?cur.p.toy:null;cur=null;drag=null;shelf();const el=id&&$('#s-'+id);if(el){el.classList.add('new');el.scrollIntoView({block:'center',behavior:'smooth'})}}
function card(p){
 let things;const grp=(n,s)=>`<span class="grp">${Array.from({length:n},(_,i)=>`<span class="obj" data-o="${s+i}">${thing(p.o)}<b></b></span>`).join('')}</span>`;
 if(p.t==='c')things=grp(p.n,0);
 else things=`${grp(p.a,0)}<span class="plus">+</span>${grp(p.b,p.a)}`;
 return `<div class="things" id="things">${things}</div>${p.t==='a'?`<div class="sum">${p.a} + ${p.b} = ?</div>`:''}
 <div class="row"><button class="rnd" id="spk" aria-label="Say it again">${SPK}</button><div class="num" id="num" aria-live="polite">0</div><button class="go" id="go" aria-label="Check my answer">${CHECK}</button><button class="rnd" id="clr" aria-label="Put all fingers down">${UNDO}</button></div>
 <p class="msg" id="msg">Tap the fingers to hold them up!</p>
 <div class="hands" id="hands">${hand(0)}${hand(1)}</div>`}
function bind(){
 const bb=$('#bb');
 $('#back').onclick=close;$('#snd2').onclick=toggleSnd;
 bb.onclick=()=>{ac();if(cur.ph==='feel')squish();else if(cur.ph==='solve'){SFX.crinkle();bump()}};
 bb.onpointerdown=e=>{if(cur.ph!=='tear')return;ac();drag={x:e.clientX,t:cur.tear,m:0};try{bb.setPointerCapture(e.pointerId)}catch(x){}};
 bb.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.m=Math.max(drag.m,Math.abs(dx));setTear(drag.t+Math.max(0,dx)/bb.clientWidth*1.1)};
 bb.onpointerup=bb.onpointercancel=()=>{if(!drag)return;const m=drag.m;drag=null;if(m<8)setTear(cur.tear+.34)};
 $('#hands').onclick=e=>{const f=e.target.closest('.fg');if(f)finger(+f.dataset.f)};
 $('#things').onclick=e=>{const o=e.target.closest('.obj');if(o)tapThing(o)};
 $('#go').onclick=check;
 $('#clr').onclick=()=>{if(cur.ph!=='solve')return;cur.up=[];drawFingers();SFX.down()};
 $('#spk').onclick=()=>say(probText(cur.p))}
function bump(){const b=$('#bb');b.classList.remove('sq');void b.offsetWidth;b.classList.add('sq')}
function shake(el){if(!el)return;el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad')}
function msg(m){$('#msg').textContent=m}
function squish(){
 if(cur.n>=3)return;cur.n++;SFX.crinkle();bump();
 const bb=$('#bb'),t=cur.t,n=cur.n,lv=[[.28,'8px'],[.55,'4px'],[.85,'1.2px']][n-1];
 bb.style.setProperty('--op',lv[0]);bb.style.setProperty('--bl',lv[1]);
 const c=n===1?R[t.r].line:n===2?`I’m ${t.cw}…`:AC[t.acc];
 if(n===1)$('#bw').classList.add('glow');
 $('#clue').textContent=c;if(n<3)say(c);else say(c,'Let’s solve the puzzle to open me!',probText(cur.p));
 if(n===3)setTimeout(()=>{if(!cur||cur.ph!=='feel')return;phase('solve');$('#clue').textContent='Solve the puzzle to open me!'},1500)}
// fingers
function drawFingers(){
 $$('.fg').forEach(g=>{const id=+g.dataset.f,i=cur.up.indexOf(id);g.classList.toggle('up',i>=0);const tx=g.querySelector('text');if(tx)tx.textContent=i>=0?i+1:''});
 const n=$('#num');n.textContent=cur.up.length;n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump')}
function finger(id){
 if(!cur||cur.ph!=='solve')return;const i=cur.up.indexOf(id);
 if(i>=0){cur.up.splice(i,1);SFX.down()}else{cur.up.push(id);SFX.pop()}
 drawFingers();if(i<0)say(NUM[cur.up.length])}
function tapThing(o){
 if(cur.ph!=='solve')return;const k=+o.dataset.o,i=cur.tapped.indexOf(k);
 if(i>=0)cur.tapped.splice(i,1);else cur.tapped.push(k);
 $$('.obj').forEach(e=>{const j=cur.tapped.indexOf(+e.dataset.o);e.classList.toggle('on',j>=0);e.querySelector('b').textContent=j>=0?j+1:''});
 SFX.click();if(i<0)say(NUM[cur.tapped.length])}
function check(){
 if(!cur||cur.ph!=='solve')return;ac();const v=cur.up.length;
 if(v===cur.ans)return win();
 cur.tries++;SFX.boop();shake($('#num'));
 const hint=v>cur.ans?'Too many fingers! Put some down.':'Not enough fingers yet!';
 if(cur.tries===1&&v>0){msg(hint);say(hint);return}
 countAlong()}
function countAlong(){
 cur.helped=1;cur.ph='help';const objs=$$('.obj'),p=cur.p,n=cur.ans;
 msg('Let’s count together!');
 const lines=['Hmm, not quite. Let’s count them together!'].concat(objs.map((_,i)=>NUM[i+1]),[`That’s ${n}! Now show me ${n} fingers.`]);
 Voice.play(lines,i=>{objs.forEach(e=>e.classList.remove('lit'));if(i>=1&&i<=objs.length){objs[i-1].classList.add('lit');SFX.click()}}).then(()=>{objs.forEach(e=>e.classList.remove('lit'))});
 setTimeout(()=>{if(cur&&cur.ph==='help'){cur.ph='solve';msg(`Show me ${n} fingers!`)}},1200)}
function win(){
 cur.ph='won';cur.sh=!cur.tries&&!cur.helped;const n=$('#num');n.classList.add('ok');SFX.ding();setTimeout(SFX.ding,180);
 $$('.obj').forEach((e,i)=>setTimeout(()=>e.classList.add('lit'),i*90));
 const m=cur.sh?'Yes! First try! This dolphin will sparkle!':'Yes! You got it!';msg(m);say(m,'Now tap the bag to open it!');
 setTimeout(()=>{if(!cur||cur.ph!=='won')return;phase('tear');$('#clue').textContent='Tap the bag to open it!';$('#play').scrollTo({top:0,behavior:'smooth'})},1700)}
function setTear(v){if(cur.ph!=='tear')return;const old=cur.tear;cur.tear=Math.min(1,v);if(Math.floor(cur.tear*3)>Math.floor(old*3))SFX.crinkle();$('#bb').style.setProperty('--tp',cur.tear);if(cur.tear>=.75)rip()}
function rip(){
 if(cur.ph!=='tear')return;drag=null;SFX.rip();
 const t=cur.t,k=cur.p.toy,prev=S.got[k],sp=!!((prev&&prev.sp)||cur.sh);S.got[k]={sp};save();
 $('.toyout').innerHTML=dolphin(t,sp);$('#clue').textContent='';phase('ripped');
 setTimeout(()=>{SFX.fanfare();confetti(R[t.r].c)},450);
 setTimeout(()=>{if(cur&&cur.ph==='ripped'){phase('done');prize(0)}},1300)}
function gotLine(t,sp){return `You got ${t.name}!${t.r>1?' A '+R[t.r].n.toLowerCase()+' dolphin!':''}${sp?' And it sparkles!':''}`}
function prize(isView){
 const t=cur.t;let sub='';
 if(isView)sub=S.got[cur.p.toy].sp?'✦ Sparkly ✦':'';
 else if(cur.p.bonus)sub=cur.sh?'It sparkles now!':'Get the next one right on the first try to make it sparkle!';
 else if(cur.sh)sub='✦ Sparkly! ✦ First try!';
 $('#prize').innerHTML=`<span class="rar" style="background:${R[t.r].c}">${R[t.r].n}</span><h2>${t.name}</h2>${sub?`<p class="sub">${sub}</p>`:''}<button class="cta" id="keep">${isView?'Back to bags':'Put it on my shelf'}</button>`;
 $('#keep').onclick=close;
 if(!isView)say(gotLine(t,cur.sh))}
function confetti(col){const box=document.createElement('div'),cs=['#ffffff','#bfefff','#ffd23f','#ff8fc8','#7fe8d4',col];box.className='conf';
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<70;i++){const e=document.createElement('i'),z=6+Math.random()*12;e.style.cssText=`left:${Math.random()*100}%;background:${cs[i%cs.length]};animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;--x:${(Math.random()-.5)*200}px;--r:${Math.random()*360}deg;width:${z}px;height:${z}px;opacity:.85`;box.appendChild(e)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3800)}

shelf();
Voice.warm(NUM.slice(1));
}
</script>
</body>
</html>
