<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon Hatchery</title>
<script src="../../pp-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a dragon keeper's hatchery, adventurous and encouraging
   IDEA: a straw nest of speckled mystery eggs; each egg is warmed by solving one problem
   PICTURE: eggs that glow to show a shadow inside (candling), crack open; code-drawn baby dragons in their shells
   COLOUR+TYPE: warm straw and amber by lantern light, plum ink, magenta accent; Baloo 2 numerals, Nunito
   LAYOUT: two nests (tabs) of eggs -> hatching stage: egg on top, problem board below (side by side on tablets) */
:root{color-scheme:light dark;--bg:light-dark(#ffe2a3,#211735);--bg2:light-dark(#f4b860,#130d22);--dot:light-dark(#e8a64a55,#ffffff12);--ink:light-dark(#2b1a3a,#fff0d6);--card:light-dark(#fffaf0,#2d2148);--line:light-dark(#2b1a3a22,#ffffff26);--soft:light-dark(#5b4470,#d8c8ee);--key:light-dark(#ffecc0,#3c2e5e);--hot:#e8367a;--ok:#12a862;--blue:#2f7bff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:repeating-linear-gradient(28deg,var(--dot) 0 2px,transparent 2px 22px),repeating-linear-gradient(-34deg,var(--dot) 0 2px,transparent 2px 26px),linear-gradient(var(--bg),var(--bg2)) fixed;color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--hot);outline-offset:3px;border-radius:10px}
h1,h2{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.top{max-width:1100px;margin:0 auto;padding:22px max(4vw,16px) 6px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
h1{font-size:clamp(38px,7vw,52px);font-weight:800}
.lede{margin:6px 0 0;max-width:46ch;color:var(--soft)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.tab{font-weight:800;font-size:15px;border-radius:99px;padding:6px 14px;min-height:40px;background:var(--line)}.tab.on{background:var(--ink);color:var(--bg)}
.prog{display:flex;flex-direction:column;gap:6px;font-weight:800}
.meter{width:200px;height:16px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--hot);border-radius:9px;transition:width .8s}
.hrow{display:flex;gap:8px;flex-wrap:wrap}
.sndb{font-size:14px;font-weight:800;padding:8px 14px;border-radius:99px;background:var(--line);min-height:40px}
#bonus{max-width:1100px;margin:6px auto 0;padding:0 max(4vw,16px);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
#bonus[hidden]{display:none}
.grid{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px) 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:24px 18px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.slot:hover{transform:translateY(-4px) rotate(-1deg)}
.slot:nth-child(3n+1) .mini{transform:rotate(-4deg)}.slot:nth-child(3n+2) .mini{transform:rotate(3deg)}
.nm{font-size:14px;font-weight:800;text-align:center;line-height:1.2}
.lock .mini{filter:grayscale(.6) brightness(.8)}
.lk{position:absolute;inset:24% 10% auto;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000a}
.lk svg{width:34px;height:34px}
.toybox{display:block;width:100%;aspect-ratio:1;border-radius:20px;background:radial-gradient(circle at 50% 55%,var(--g),transparent 68%)}
.toybox svg{width:100%;height:100%;display:block}
.new{animation:pop2 .9s}
@keyframes pop2{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.foot{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px) 36px;font-size:14px;color:var(--soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot button{text-decoration:underline;min-height:40px}
.foot .yes{background:var(--hot);color:#fff;text-decoration:none;border-radius:99px;padding:6px 14px}
/* eggs */
.bag{display:block;position:relative;width:100%;aspect-ratio:3/4}
.mini{font-size:11px;filter:drop-shadow(0 8px 5px #0003)}
.zz,.pt,.pb{display:block;position:absolute;inset:0;background:radial-gradient(circle at 28% 30%,#ffffff70 0 4%,transparent 4.5%),radial-gradient(circle at 70% 22%,var(--c2) 0 5%,transparent 5.5%),radial-gradient(circle at 76% 58%,var(--c2) 0 6%,transparent 6.5%),radial-gradient(circle at 26% 70%,var(--c2) 0 4.5%,transparent 5%),radial-gradient(circle at 52% 86%,var(--c2) 0 4%,transparent 4.5%),radial-gradient(circle at 34% 30%,#ffffffa0,transparent 45%),linear-gradient(160deg,var(--c1),var(--c3,var(--c1)))}
.zz::after,.pt::after,.pb::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,#0000002e,transparent 60%);pointer-events:none}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;padding-top:1.2em;color:#fff;text-align:center}
.win{position:relative;width:62%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden}
.win>b,.q{font:800 2.6em/1 'Baloo 2',sans-serif;color:#ffffffd0;text-shadow:0 2px 0 #0002}
.tag{font:800 1.15em/1.3 'Baloo 2',sans-serif;background:#ffffffe6;color:#2b1a3a;border-radius:99px;padding:0 .6em;font-style:normal}
/* stage */
#play{position:fixed;inset:0;z-index:5;background:inherit;overflow-y:auto;display:none}
#play.on{display:block}
.stage{max-width:600px;margin:0 auto;padding:12px 14px 32px;display:grid;justify-items:center;gap:10px}
.bar{width:100%;display:flex;justify-content:space-between;gap:10px}
.bar{position:relative;z-index:3}.bagwrap::before{pointer-events:none}
.back{font-weight:800;font-size:16px;min-height:44px;padding:0 14px;border-radius:99px;background:var(--card)}
.left{display:grid;justify-items:center;gap:6px;width:100%}
.bagwrap{position:relative;width:min(56vw,210px);aspect-ratio:3/4;font-size:18px;margin-bottom:22px;transition:width .5s,font-size .5s}
.am.pickm{gap:0;border:3px solid var(--ink);border-radius:6px;overflow:hidden;max-width:440px}.am.pickm .cell{border-radius:0;border:1.5px solid var(--ink);background:transparent;min-height:66px}
.bagwrap::before{content:'';position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(var(--glow),transparent 62%);opacity:0;transition:opacity .8s}
.bagwrap.glow::before{opacity:1;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.nest{position:absolute;left:-14%;right:-14%;bottom:-7%;height:22%;border-radius:50%;background:repeating-linear-gradient(20deg,#c98a3a 0 4px,#e8b25a 4px 8px,#a8702c 8px 11px);box-shadow:inset 0 6px 10px #0004;z-index:-1}
.feel .bagwrap{animation:tease 2.4s ease-in-out infinite}
@keyframes tease{0%,74%,100%{transform:rotate(0)}79%{transform:rotate(-8deg)}84%{transform:rotate(7deg)}89%{transform:rotate(-4deg)}94%{transform:rotate(2deg)}}
.big{position:absolute;inset:0;cursor:pointer;filter:drop-shadow(0 12px 12px #0005);--op:0;--bl:10px}
.big .win{background:radial-gradient(#fff6c8 0,#ffd88a calc(var(--op) * 60%),transparent 72%)}
.big .win svg{position:absolute;inset:2%;width:96%;height:96%;filter:brightness(0) blur(var(--bl));opacity:var(--op);transition:opacity .6s,filter .6s}
.big .q{position:absolute;opacity:calc(1 - var(--op) * 1.3);transition:opacity .6s}
.sq{animation:sq .4s}
@keyframes sq{30%{transform:scale(1.1,.88) rotate(-4deg)}60%{transform:scale(.95,1.05) rotate(3deg)}}
.clue{margin:0;min-height:2.6em;text-align:center;font:800 20px/1.3 'Baloo 2',sans-serif;max-width:30ch}
.solving .bagwrap{width:min(26vw,104px);font-size:9px}
.solving .clue{font-size:17px;min-height:0}
.reveal .big{touch-action:none}
.reveal .pt{transform-origin:50% 44%;transform:rotate(calc(var(--tp,0) * -10deg)) translateY(calc(var(--tp,0) * -4%))}
.tline{position:absolute;left:10%;right:10%;top:42%;height:6px;opacity:0;pointer-events:none;background:repeating-linear-gradient(60deg,#2b1a3a 0 3px,transparent 3px 9px);clip-path:inset(0 calc((1 - var(--tp,0)) * 100%) 0 0)}
.fing{position:absolute;top:28%;left:50%;width:60px;height:60px;margin-left:-30px;border-radius:50%;border:5px solid #fff;opacity:0;pointer-events:none;box-shadow:0 0 0 4px #ffffff60}
.reveal:not(.ripped) .tline{opacity:.8}
.reveal:not(.ripped) .fing{opacity:1;animation:tapme 1.1s ease-in-out infinite}
@keyframes tapme{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.7);opacity:.5}}
.rays{position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(var(--glow) 0 9deg,transparent 9deg 20deg);-webkit-mask:radial-gradient(#000 15%,transparent 66%);mask:radial-gradient(#000 15%,transparent 66%);opacity:0;pointer-events:none}
.ripped .rays{opacity:1;transition:opacity .6s .3s;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.ripped .big{pointer-events:none}
.ripped .pt{animation:fly .7s forwards}
@keyframes fly{to{transform:translate(60%,-110%) rotate(55deg);opacity:0}}
.ripped .pb{animation:drop .9s .25s forwards}
@keyframes drop{to{transform:translateY(40%) scale(.85);opacity:0}}
.toyout{position:absolute;left:50%;top:50%;width:140%;transform:translate(-50%,-30%) scale(.1);opacity:0;pointer-events:none}
.toyout svg{width:100%;display:block}
.ripped .toyout{animation:pop .9s .35s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.view .toyout{animation:none;transform:translate(-50%,-50%);opacity:1}
.view .big,.view .clue,.ripped .nest{display:none}
/* problem board */
.card{display:none;width:100%;background:var(--card);border-radius:24px;padding:16px 14px;box-shadow:0 8px 0 #0000001c;flex-direction:column;align-items:center;gap:12px}
.solving .card{display:flex;animation:up .45s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.ask{margin:0;text-align:center;font:800 21px/1.25 'Baloo 2',sans-serif;max-width:32ch}
.story{margin:0;text-align:center;color:var(--soft);max-width:40ch}
.digits{display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.dg{min-width:38px;height:56px;border-radius:12px;background:var(--key);font:800 36px/56px 'Baloo 2',sans-serif;text-align:center;position:relative}
.dg.cm{min-width:12px;background:none}
.dg.tgt{box-shadow:inset 0 -5px 0 var(--hot);color:var(--hot)}
.dg.pick{outline:3px solid var(--blue);outline-offset:2px}
.dg.nb{background:#ffe066;color:#2b1a3a}
.dg.z{color:var(--soft)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:440px}
.opt{min-height:56px;border-radius:16px;background:var(--key);font:800 22px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #0002;padding:4px 10px}
.opt:disabled{opacity:.35}
.opt.right{background:var(--ok);color:#fff}
.nl{width:100%;max-width:460px;display:none}
.nl.on{display:block;animation:up .4s}
.nl svg{width:100%;height:auto;overflow:visible}
.am{display:grid;gap:6px;width:100%;max-width:520px;align-items:stretch}
.lab{display:grid;place-items:center;font:800 22px 'Baloo 2',sans-serif;color:var(--soft);min-height:40px}
.cell{border-radius:12px;background:light-dark(#fff1d0,#3a2c5c);border:3px solid light-dark(#e7c27c,#5a4a86);display:grid;place-items:center;align-content:center;gap:2px;min-height:72px;padding:6px;text-align:center}
.cell small{font-size:14px;color:var(--soft);font-weight:800}
.cell.done{background:light-dark(#d9f7e6,#1d4a3a);border-color:var(--ok)}
.blank{min-width:64px;min-height:44px;padding:0 8px;border-radius:12px;border:3px dashed var(--hot);color:var(--hot);font:800 26px/38px 'Baloo 2',sans-serif;background:var(--card)}
.blank.act{border-style:solid;box-shadow:0 0 0 4px #e8367a33}
.blank.ok{border:3px solid var(--ok);color:var(--ok);border-style:solid}
.blank.give{border-color:var(--blue);color:var(--blue);border-style:solid}
.sumrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:center;font:800 22px 'Baloo 2',sans-serif}
.sumrow .pp{color:var(--soft)}
.eqn{font:800 24px 'Baloo 2',sans-serif;text-align:center}
.msg{margin:0;text-align:center;font-weight:800;min-height:1.5em;max-width:40ch}
.help{display:none;width:100%;border-radius:18px;background:light-dark(#e9f3ff,#22305a);padding:12px 14px}
.help.on{display:block;animation:up .35s}
.hq{margin:0 0 10px;font-weight:800;font-size:18px}
.hbtns{display:flex;gap:10px;flex-wrap:wrap}
.hb{min-width:110px;min-height:52px;border-radius:14px;background:#fff;color:#2b1a3a;font:800 20px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #0002;padding:0 14px}
.hb:disabled{opacity:.35}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:100%;max-width:330px}
.pad button{height:54px;border-radius:16px;background:var(--key);font:800 28px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #0002}
.pad button:active{transform:translateY(3px);box-shadow:none}
.pad .go{background:var(--ok);color:#fff;font-size:22px}
.rowb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.spk{width:44px;height:44px;border-radius:50%;background:var(--key);display:grid;place-items:center}
.crack{min-height:46px;padding:0 18px;border-radius:99px;border:3px solid var(--blue);color:var(--blue);font-weight:800;background:var(--card)}
.crack[hidden]{display:none}
.bad{animation:no .4s}
@keyframes no{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.prize{display:none;text-align:center;gap:8px;justify-items:center}
.done .prize{display:grid;animation:up .5s}
.rar{color:#fff;font-weight:800;border-radius:99px;padding:2px 14px;font-size:15px}
.prize h2{font-size:clamp(38px,9vw,52px);font-weight:800}
.sub{margin:0;font-weight:800;max-width:30ch}
.cta{min-height:52px;padding:0 24px;border-radius:99px;background:var(--hot);color:#fff;font:800 20px 'Baloo 2',sans-serif;box-shadow:0 5px 0 #0003;margin-top:6px}
.drg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.drg .wing{transform-box:fill-box;animation:flap 2.6s ease-in-out infinite}
.drg .wl{transform-origin:100% 80%}.drg .wr{transform-origin:0% 80%}
@keyframes flap{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-10deg)}}
.drg .wr{animation-name:flapr}@keyframes flapr{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(10deg)}}
.shiny{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #ffd23f)}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.3) rotate(45deg);opacity:.4}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:900px){
 .stage.solving{max-width:1060px;grid-template-columns:260px minmax(0,1fr);align-items:start}
 .stage.solving .bar{grid-column:1/-1}
 .stage.solving .bagwrap{width:200px;font-size:17px}
 .stage.solving .left{position:sticky;top:12px}
}
@media(max-width:420px){.dg{min-width:30px;font-size:30px}.cell{min-height:64px}.blank{font-size:22px;min-width:56px}}
@media(prefers-reduced-motion:reduce){.feel .bagwrap,.ripped .rays,.drg .eyes,.drg .wing,.tw,.bagwrap.glow::before,.reveal:not(.ripped) .fing{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div>
    <span class="tabs" id="tabs"></span>
    <h1>Dragon Hatchery</h1>
    <p class="lede">Every egg needs a problem solved to hatch. Warm it, solve it, then crack it open to meet your dragon.</p>
  </div>
  <div class="prog">
    <span id="count">0 of 13 dragons</span>
    <span class="meter"><i id="meter"></i></span>
    <span class="hrow"><button class="sndb" id="shelfbtn">‹ Bookshelf</button><button class="sndb" id="snd1">Sound on</button></span>
  </div>
</header>
<div id="bonus" hidden></div>
<main class="grid" id="grid"></main>
<footer class="foot" id="foot"><button id="reset">Grown-ups: start the collection over</button></footer>
<div id="play"><div class="stage" id="stage"></div></div>
<div id="toast"></div>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const GAME_ID='dragon-hatchery';
const R={1:{n:'Common',c:'#9a7fb8',g:'#ffffffc0',line:'It feels warm and wiggly. A common dragon!'},2:{n:'Rare',c:'#2f7bff',g:'#5aa9ffd0',line:'It’s glowing blue… a RARE dragon!'},3:{n:'Ultra Rare',c:'#e8367a',g:'#ff6fd8d0',line:'WHOA! A pink glow… ULTRA RARE!'},4:{n:'Legendary',c:'#e8a800',g:'#ffd23fe6',line:'It’s blazing gold… LEGENDARY!'}};
// dragons: c body, b belly, w wings, h horns, hs horn style, pat, acc
const T={
 ember:{name:'Ember',r:1,c:'#ff7a45',b:'#ffd9a8',w:'#ffb35a',h:'#fff1c9',hs:'curl',pat:'none',acc:'none',cw:'fiery orange'},
 mossy:{name:'Mossy',r:1,c:'#6cc070',b:'#e3f6c8',w:'#3f9a5a',h:'#f2e6b0',hs:'straight',pat:'spots',acc:'flower',ac:'#ff8fb3',cw:'mossy green with spots'},
 puddle:{name:'Puddle',r:1,c:'#5aa9e6',b:'#dff1ff',w:'#2f7bd0',h:'#ffffff',hs:'curl',pat:'none',acc:'scarf',ac:'#ffd23f',cw:'rain-puddle blue'},
 pebble:{name:'Pebble',r:1,c:'#9aa3b5',b:'#eef0f5',w:'#6b7489',h:'#fff4d6',hs:'straight',pat:'spots',acc:'glasses',cw:'pebbly gray'},
 sunny:{name:'Sunny',r:1,c:'#ffd23f',b:'#fff6c8',w:'#ff9f1c',h:'#ffffff',hs:'curl',pat:'none',acc:'bow',ac:'#e8367a',cw:'sunshine yellow'},
 plum:{name:'Plum',r:1,c:'#a678de',b:'#efe4ff',w:'#7a4fc4',h:'#ffe8a3',hs:'straight',pat:'stripes',acc:'none',cw:'plum purple and stripy'},
 cocoa:{name:'Cocoa',r:1,c:'#9b6a46',b:'#f2d9bd',w:'#6e4529',h:'#ffe8c2',hs:'curl',pat:'spots',acc:'leaf',cw:'cocoa brown'},
 frost:{name:'Frostbite',r:2,c:'#bfe6ff',b:'#ffffff',w:'#7cc4f2',h:'#e9f7ff',hs:'uni',pat:'stars',acc:'gem',ac:'#5aa9ff',cw:'icy blue with snowflake sparkles'},
 blossom:{name:'Blossom',r:2,c:'#ff9cc4',b:'#ffe6f0',w:'#ff6fa5',h:'#fff',hs:'curl',pat:'none',acc:'flower',ac:'#ffffff',cw:'cherry-blossom pink'},
 thunder:{name:'Thunder',r:2,c:'#2f3a6b',b:'#c9d4ff',w:'#ffd23f',h:'#ffd23f',hs:'straight',pat:'stripes',acc:'none',cw:'storm-cloud blue with lightning wings',dark:1},
 aurora:{name:'Aurora',r:3,c:'aurora',b:'#ffffff',w:'#b490ca',h:'#ffffff',hs:'uni',pat:'none',acc:'wizard',ac:'#5b3fc4',cw:'every color of the northern lights'},
 starfall:{name:'Starfall',r:3,c:'galaxy',b:'#c9b8ff',w:'#ff6fd8',h:'#ffe066',hs:'curl',pat:'stars',acc:'star',ac:'#ffe066',cw:'full of stars',dark:1},
 sunfire:{name:'Sunfire',r:4,c:'gold',b:'#fff8d6',w:'#ff9f1c',h:'#ffffff',hs:'curl',pat:'none',acc:'crown',cw:'solid GOLD'},
 tidal:{name:'Tidal',r:1,c:'#2fc0b0',b:'#d9fff8',w:'#178a8f',h:'#ffffff',hs:'curl',pat:'none',acc:'none',cw:'ocean teal'},

 if(cur.ph!=='solve'||!cur.B)return;SFX.click();const B=cur.B,q=B.Q[B.i],el=$(`.blank[data-k="${q[0]}"]`);
 if(k==='go')return checkBlank();
 let v=cur.typed;if(k==='del')v=v.slice(0,-1);else if(v.length<5)v=(v==='0'?'':v)+k;cur.typed=v;el.textContent=v?fmt(+v):''}
function hintFor(q){
 const k=q[0];
 if(/^[ts][01]$/.test(k)){const n=k[0]==='t'?p().b:p().a,[x,y]=split(n);return `${n} = ${x} + ${y}. The tens part is ${x} and the ones part is ${y}.`}
 if(k[0]==='c'){const x=q[2],y=q[3],zx=x>=10?1:0,zy=y>=10?1:0,bx=zx?x/10:x,by=zy?y/10:y,z=zx+zy;
  return z?`Do ${bx} × ${by} = ${bx*by}, then add ${z===1?'one zero':'two zeros'}: ${fmt(x*y)}.`:`${x} × ${y} = ${x*y}.`}
 const v=B2();return `Add two at a time: ${fmt(v[0])} + ${fmt(v[1])} = ${fmt(v[0]+v[1])}, then keep going.`}
const B2=()=>cur.B.Q.filter(q=>q[0][0]==='c').map(q=>q[1]);
function checkBlank(){
 const B=cur.B,q=B.Q[B.i],el=$(`.blank[data-k="${q[0]}"]`);if(cur.typed==='')return;
 if(+cur.typed===q[1]){SFX.ding();el.classList.remove('act');el.classList.add('ok');el.textContent=fmt(q[1]);return blankDone(q)}
 cur.tries++;B.miss++;SFX.boop();shake(el);cur.typed='';el.textContent='';
 const h=hintFor(q);
 if(B.miss>=2){cur.helped=1;el.classList.remove('act');el.classList.add('give');el.textContent=fmt(q[1]);msg('Here it is: '+h);say(h);return setTimeout(()=>blankDone(q),1400)}
 msg('Not quite. '+h);say('Not quite. '+h)}
function blankDone(q){
 if(!cur||cur.ph!=='solve')return;const B=cur.B,k=q[0];
 if(/^[ts][01]$/.test(k)){const pr=cur.p,[a1,a0]=split(pr.a),[b1,b0]=split(pr.b);const map={c11:[a1,b1],c10:[a1,b0],c01:[a0,b1],c00:[a0,b0]};
  if(B.Q.filter(x=>/^[ts][01]$/.test(x[0])).every(x=>$(`.blank[data-k="${x[0]}"]`).matches('.ok,.give')))Object.entries(map).forEach(([c,[x,y]])=>{const s=$(`#c-${c} small`);if(s)s.textContent=`${x} × ${y}`})}
 if(k[0]==='c'){$(`#c-${k}`).classList.add('done');$(`.pp[data-s="${k}"]`).textContent=fmt(q[1])}
 if(k==='tot'){$('#eqn').textContent=`${cur.p.a} × ${cur.p.b} = ${fmt(cur.ans)}${cur.p.story?' square feet':''}`;return win()}
 const nx=B.Q.find(x=>!$(`.blank[data-k="${x[0]}"]`).matches('.ok,.give'));if(nx)focusBlank(nx[0])}
function win(){
 cur.ph='won';cur.sh=!cur.tries&&!cur.helped;SFX.ding();setTimeout(SFX.ding,180);
 if(cur.p.k==='round'){numLine(1);$$('.opt').forEach(o=>{if(+o.dataset.v===cur.ans)o.classList.add('right')})}
 const m=cur.sh?'YES! First try, so this dragon will be SHINY!':'You got it!';msg(m);say(m,'Now tap the egg to crack it open!');
 setTimeout(()=>{if(!cur||cur.ph!=='won')return;phase('tear');$('#clue').textContent='Tap the egg to crack it open!';$('#play').scrollTo({top:0,behavior:'smooth'})},2200)}
function setTear(v){if(cur.ph!=='tear')return;const old=cur.tear;cur.tear=Math.min(1,v);if(Math.floor(cur.tear*3)>Math.floor(old*3))SFX.crack();$('#bb').style.setProperty('--tp',cur.tear);$('#bw').style.setProperty('--tp',cur.tear);bump();if(cur.tear>=.75)rip()}
function rip(){
 if(cur.ph!=='tear')return;drag=null;SFX.rip();
 const t=cur.t,k=cur.p.toy,prev=S.got[k],sh=!!((prev&&prev.sh)||cur.sh);S.got[k]={sh};save();
 $('.toyout').innerHTML=dragon(t,sh);$('#clue').textContent='';phase('ripped');
 setTimeout(()=>{SFX.fanfare();confetti(R[t.r].c)},450);
 setTimeout(()=>{if(cur&&cur.ph==='ripped'){phase('done');prize(0)}},1300)}
function gotLine(t,sh){return `It’s ${t.name}!${t.r>1?' A '+R[t.r].n+' dragon!':''}${sh?' And it’s shiny!':''}`}
function prize(isView){
 const t=cur.t;let sub='';
 if(isView)sub=S.got[cur.p.toy].sh?'✦ Shiny ✦':'';
 else if(cur.p.bonus)sub=cur.sh?'It’s SHINY now!':'Solve one on the first try to make it shiny. Try another shiny egg!';
 else if(cur.sh)sub='✦ SHINY ✦ You solved it all by yourself!';
 $('#prize').innerHTML=`<span class="rar" style="background:${R[t.r].c}">${R[t.r].n}</span><h2>${t.name}</h2>${sub?`<p class="sub">${sub}</p>`:''}<button class="cta" id="keep">${isView?'Back to the nest':'Put it in my nest'}</button>`;
 $('#keep').onclick=close;
 if(!isView)say(gotLine(t,cur.sh))}
function confetti(col){const box=document.createElement('div'),cs=['#e8367a','#ffd23f','#2f7bff','#12a862','#ff7a1a','#a78bfa',col];box.className='conf';
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<80;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;background:${cs[i%cs.length]};animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;--x:${(Math.random()-.5)*200}px;--r:${Math.random()*720}deg;width:${6+Math.random()*6}px;height:${8+Math.random()*8}px`;box.appendChild(e)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3800)}

document.addEventListener('pointerdown',function un(){ac();document.removeEventListener('pointerdown',un,true)},true);
shelf();
}
</script>
