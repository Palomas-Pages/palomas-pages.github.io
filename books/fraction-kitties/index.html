<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraction Kitties Blind Bags</title>
<script src="../../pp-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
/* VOICE: toy-aisle excitement with a kind, patient coach
   IDEA: a peg-wall of foil blind bags; every bag is sealed shut by one fraction code
   PICTURE: foil pouches that squish, glow, show a silhouette, then tear open; code-drawn kitty figurines
   COLOUR+TYPE: sunshine-yellow pegboard (her worksheet folder), navy ink, jewel foil; Baloo 2 + Nunito, Gochi Hand sticky note
   LAYOUT: shelf grid -> full-screen unboxing stage: bag on top, code + keypad below (side by side on tablets) */
:root{color-scheme:light dark;--bg:light-dark(#ffd84a,#1d1a35);--dot:light-dark(#efc532,#28244a);--ink:light-dark(#1b1640,#fff3cf);--card:light-dark(#fffdf5,#2a2650);--line:light-dark(#1b164024,#ffffff24);--soft:light-dark(#4d4770,#cfc8ee);--key:light-dark(#fff1b8,#3a3566);--hot:#ff3d7f;--ok:#12a862;--shade:#ff9e3d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 3px,transparent 3.6px) 0 0/28px 28px;color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--hot);outline-offset:3px;border-radius:10px}
h1,h2{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.top{max-width:1100px;margin:0 auto;padding:24px max(4vw,16px) 6px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.chip{display:inline-block;background:var(--ink);color:var(--bg);border-radius:99px;padding:1px 12px;font-size:14px;font-weight:800;margin-bottom:6px}
h1{font-size:clamp(38px,7vw,52px);font-weight:800}
.lede{margin:6px 0 0;max-width:46ch;color:var(--soft)}
.prog{display:flex;flex-direction:column;gap:6px;font-weight:800}
.meter{width:200px;height:16px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--hot);border-radius:9px;transition:width .8s}
.hrow{display:flex;gap:8px;flex-wrap:wrap}.sndb{align-self:flex-start;font-size:14px;font-weight:800;padding:8px 14px;border-radius:99px;background:var(--line);min-height:40px}
#bonus{max-width:1100px;margin:6px auto 0;padding:0 max(4vw,16px);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
#bonus[hidden]{display:none}
.grid{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px) 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:26px 18px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.slot:hover{transform:translateY(-4px) rotate(-1deg)}
.slot:nth-child(3n+1) .mini{transform:rotate(-3deg)}.slot:nth-child(3n+2) .mini{transform:rotate(2deg)}
.nm{font-size:14px;font-weight:800;text-align:center;line-height:1.2}
.lock .mini{filter:grayscale(.6) brightness(.8) drop-shadow(0 6px 6px #0003)}
.lk{position:absolute;inset:18% 10% auto;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000a}
.lk svg{width:34px;height:34px}
.toybox{display:block;width:100%;aspect-ratio:120/140;border-radius:20px;background:radial-gradient(circle at 50% 50%,var(--g),transparent 68%)}
.toybox svg{width:100%;height:100%;display:block}
.new{animation:pop2 .9s}
@keyframes pop2{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.foot{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px) 36px;font-size:14px;color:var(--soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot button{text-decoration:underline;min-height:40px}
.foot .yes{background:var(--hot);color:#fff;text-decoration:none;border-radius:99px;padding:6px 14px}
/* bags */
.bag{display:block;position:relative;width:100%;aspect-ratio:3/4}
.mini{font-size:11px;filter:drop-shadow(0 6px 6px #0003)}
.zz,.pt,.pb{display:block;position:absolute;inset:0;background:linear-gradient(150deg,var(--c1),var(--c2) 55%,var(--c1))}
.zz::after,.pt::after,.pb::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,#ffffff8c 46%,transparent 60%) 0 0/260% 100%;animation:sh 3.4s linear infinite;pointer-events:none}
@keyframes sh{from{background-position:130% 0}to{background-position:-140% 0}}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45em;padding-top:1.4em;color:#fff;text-align:center}
.hole{position:absolute;top:5.5%;left:50%;width:1.2em;height:.55em;margin-left:-.6em;border-radius:99px;background:#0003}
.brand{font:800 1em/.95 'Baloo 2',sans-serif;letter-spacing:.03em;text-shadow:0 2px 0 #0003}
.win{position:relative;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#ffffffee,#ffffff80);display:grid;place-items:center;box-shadow:inset 0 0 0 .2em #ffffffa0;overflow:hidden}
.win>b,.q{font:800 2.6em/1 'Baloo 2',sans-serif;color:var(--c1)}
.tag{font:800 1em/1.3 'Baloo 2',sans-serif;background:#fff;color:var(--c1);border-radius:99px;padding:0 .7em}
/* play stage */
#play{position:fixed;inset:0;z-index:5;background:inherit;overflow-y:auto;display:none}
#play.on{display:block}
.stage{max-width:560px;margin:0 auto;padding:12px 16px 32px;display:grid;justify-items:center;gap:10px}
.bar{width:100%;display:flex;justify-content:space-between;gap:10px}
.back{font-weight:800;font-size:16px;min-height:44px;padding:0 14px;border-radius:99px;background:var(--card)}
.left{display:grid;justify-items:center;gap:6px;width:100%}
.bagwrap{position:relative;width:min(60vw,230px);aspect-ratio:3/4;font-size:19px;transition:width .5s,font-size .5s}
.bagwrap::before{content:'';position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(var(--glow),transparent 62%);opacity:0;transition:opacity .8s}
.bagwrap.glow::before{opacity:1;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.feel .bagwrap{animation:tease 2.6s ease-in-out infinite}
@keyframes tease{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(-7deg)}87%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
.big{position:absolute;inset:0;cursor:pointer;filter:drop-shadow(0 12px 14px #0005);--op:0;--bl:10px}
.big .win svg{position:absolute;inset:6%;width:88%;height:88%;filter:brightness(0) blur(var(--bl));opacity:var(--op);transition:opacity .6s,filter .6s}
.big .q{position:absolute;opacity:calc(1 - var(--op) * 1.3);transition:opacity .6s}
.sq{animation:sq .4s}
@keyframes sq{30%{transform:scale(1.13,.84)}60%{transform:scale(.93,1.07)}}
.clue{margin:0;min-height:2.8em;text-align:center;font:800 20px/1.3 'Baloo 2',sans-serif;max-width:30ch}
.solving .bagwrap{width:min(32vw,128px);font-size:10.5px}
.solving .clue{font-size:17px;min-height:0}
.reveal .big{touch-action:none}
.reveal .pt{transform-origin:100% 22%;transform:rotate(calc(var(--tp,0) * -16deg)) translateY(calc(var(--tp,0) * -5%))}
.tline{position:absolute;left:5%;right:5%;top:21.5%;border-top:3px dashed #fff;opacity:0;pointer-events:none;filter:drop-shadow(0 1px 1px #0006)}
.fing{position:absolute;top:calc(21.5% - 21px);left:4%;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--hot);display:grid;place-items:center;box-shadow:0 4px 10px #0005;opacity:0;pointer-events:none}
.reveal:not(.ripped) .tline,.reveal:not(.ripped) .fing{opacity:1}
.reveal:not(.ripped) .fing{animation:swipe 1.5s ease-in-out infinite}
@keyframes swipe{0%{left:4%}70%,100%{left:78%}}
.rays{position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(var(--glow) 0 9deg,transparent 9deg 20deg);-webkit-mask:radial-gradient(#000 15%,transparent 66%);mask:radial-gradient(#000 15%,transparent 66%);opacity:0;pointer-events:none}
.ripped .rays{opacity:1;transition:opacity .6s .3s;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.ripped .big{pointer-events:none}
.ripped .pt{animation:fly .7s forwards}
@keyframes fly{to{transform:translate(75%,-95%) rotate(42deg);opacity:0}}
.ripped .pb{animation:drop .9s .2s forwards}
@keyframes drop{to{transform:translateY(85%) scale(.9);opacity:0}}
.toyout{position:absolute;left:50%;top:50%;width:112%;transform:translate(-50%,-30%) scale(.1);opacity:0;pointer-events:none}
.toyout svg{width:100%;display:block}
.ripped .toyout{animation:pop .9s .35s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.view .toyout{animation:none;transform:translate(-50%,-50%);opacity:1}
.view .big,.view .clue{display:none}
.card{display:none;width:100%;background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 0 #0000001c;flex-direction:column;align-items:center;gap:12px}
.solving .card{display:flex;animation:up .45s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.pics{display:flex;align-items:center;gap:18px}
.eqs{font:800 34px 'Baloo 2',sans-serif}
.shape{width:min(27vw,108px);height:auto;display:block}
.shape path{fill:var(--card);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;transition:fill .25s}
.shape path.on{fill:var(--shade)}
.shape.tap path{cursor:pointer}
.tip{margin:-6px 0 0;font-size:14px;color:var(--soft)}
.eq{display:flex;align-items:stretch;gap:16px;font:800 44px/1 'Baloo 2',sans-serif}
.fr{display:flex;flex-direction:column;align-items:center}
.fr>span{height:60px;min-width:64px;display:grid;place-items:center}
.fr hr{align-self:stretch;border:0;border-top:5px solid currentColor;border-radius:3px;margin:6px 0}
.ans{border:4px dashed var(--hot);border-radius:14px;color:var(--hot);min-width:70px}
.ans.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.mid{display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.pill{font:800 18px/1.4 'Baloo 2',sans-serif;background:var(--hot);color:#fff;border-radius:99px;padding:1px 10px;visibility:hidden;min-height:26px}
.pill.show{visibility:visible;animation:pop2 .5s}
.spk{align-self:center;width:44px;height:44px;border-radius:50%;background:var(--key);display:grid;place-items:center}
.msg{margin:0;text-align:center;font-weight:800;min-height:1.5em;max-width:36ch}
.help{display:none;width:100%;border-radius:18px;background:light-dark(#e9f3ff,#1f2c52);padding:12px 14px}
.help.on{display:block;animation:up .35s}
.log{margin:0 0 6px;padding-left:20px;color:var(--soft);font-size:15px}
.hq{margin:0 0 10px;font-weight:800;font-size:18px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-width:72px;min-height:52px;border-radius:14px;background:#fff;color:#1b1640;font:800 24px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #0002}
.opt:disabled{opacity:.35}
.hslot{display:inline-grid;place-items:center;min-width:70px;height:56px;border:4px dashed #2f7bff;border-radius:14px;font:800 32px 'Baloo 2',sans-serif;color:#2f7bff}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:100%;max-width:330px}
.pad button{height:56px;border-radius:16px;background:var(--key);font:800 28px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #0002}
.pad button:active{transform:translateY(3px);box-shadow:none}
.pad .go{background:var(--ok);color:#fff;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center}
.sticky{margin:4px 0;font:21px/1.15 'Gochi Hand',cursive;background:#fff59d;color:#2a2a2a;padding:10px 14px;transform:rotate(-2deg);box-shadow:0 6px 12px #0003;max-width:250px}
.crack{min-height:48px;padding:0 18px;border-radius:99px;border:3px solid #2f7bff;color:#2f7bff;font-weight:800;background:var(--card)}
.crack[hidden]{display:none}
.bad{animation:no .4s}
@keyframes no{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.prize{display:none;text-align:center;gap:8px;justify-items:center}
.done .prize{display:grid;animation:up .5s}
.rar{color:#fff;font-weight:800;border-radius:99px;padding:2px 14px;font-size:15px}
.prize h2{font-size:clamp(38px,9vw,52px);font-weight:800}
.sub{margin:0;font-weight:800;max-width:30ch}
.cta{min-height:52px;padding:0 24px;border-radius:99px;background:var(--hot);color:#fff;font:800 20px 'Baloo 2',sans-serif;box-shadow:0 5px 0 #0003;margin-top:6px}
.kit .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.shiny{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #ffd23f)}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.3) rotate(45deg);opacity:.4}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:860px){
 .stage.solving{max-width:1000px;grid-template-columns:300px minmax(0,1fr);align-items:start}
 .stage.solving .bar{grid-column:1/-1}
 .stage.solving .bagwrap{width:230px;font-size:19px}
 .stage.solving .left{position:sticky;top:12px}
}
@media(prefers-reduced-motion:reduce){.feel .bagwrap,.zz::after,.pt::after,.pb::after,.ripped .rays,.kit .eyes,.tw,.bagwrap.glow::before{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div>
    <span class="chip">Blind Bag Series 1</span>
    <h1>Fraction Kitties</h1>
    <p class="lede" id="lede">Every bag is locked with a fraction code. Squish it, crack the code, then tear it open to see who's inside.</p>
  </div>
  <div class="prog">
    <span id="count">0 of 16 kitties</span>
    <span class="meter"><i id="meter"></i></span>
    <span class="hrow"><button class="sndb" id="shelfbtn">‹ Bookshelf</button><button class="sndb" id="snd1">Sound on</button></span>
  </div>
</header>
<div id="bonus" hidden></div>
<main class="grid" id="grid"></main>
<footer class="foot" id="foot"><button id="reset">Grown-ups: start the collection over</button></footer>
<div id="play"><div class="stage" id="stage"></div></div>
<div id="toast"></div>
<script>
{

const GAME_ID='fraction-kitties';
const R={1:{n:'Common',c:'#8f9ab2',g:'#ffffffc0',line:'Feels like a sweet COMMON kitty!'},2:{n:'Rare',c:'#3d8bff',g:'#5aa9ffd0',line:'Ooh, it’s glowing blue… that means RARE!'},3:{n:'Ultra Rare',c:'#ff3fc8',g:'#ff6fd8d0',line:'WHOA! A pink glow… ULTRA RARE!'},4:{n:'Legendary',c:'#e8a800',g:'#ffd23fe6',line:'It’s warm and golden… LEGENDARY!'}};
const T={
 biscuit:{name:'Biscuit',r:1,fur:'#e9b878',f2:'#c4843f',eye:'#3f8f4f',pat:'tabby',acc:'bow',c:'#ff4f8b',fw:'toasty tan'},

 cocoa:{name:'Cocoa Bean',r:1,fur:'#7b4f34',f2:'#55341f',eye:'#f0b94c',pat:'tux',acc:'bow',c:'#6fd36f',fw:'chocolate brown',dark:1},
 dandelion:{name:'Dandelion',r:1,fur:'#ffe08a',f2:'#efb532',eye:'#7a5cff',pat:'tabby',acc:'flower',c:'#ffffff',fw:'sunny yellow'},
 mint:{name:'Mintwhisker',r:1,fur:'#bdeedf',f2:'#79cfb5',eye:'#ff5c9a',pat:'socks',acc:'scarf',c:'#ff6fa5',fw:'minty green'},
 starfrost:{name:'Starfrost',r:2,fur:'#acd6ff',f2:'#5d9ce3',eye:'#1f3f8f',pat:'tabby',acc:'wand',c:'#ffd23f',fw:'icy blue'},

// Paloma's worksheet, problems a–o, plus a secret golden bag
const P=[
 {id:'a',a:3,b:4,d:8,toy:'biscuit',pic:'sq'},{id:'b',a:4,b:6,d:3,toy:'snowdrop',pic:'tri'},{id:'c',a:1,b:2,d:10,toy:'pepper',pic:'cir'},
 {id:'d',a:6,b:12,d:6,toy:'starfrost'},{id:'e',a:1,b:3,d:6,toy:'marmalade'},{id:'f',a:1,b:6,d:12,toy:'smudge'},

 {id:'j',a:1,b:4,d:12,toy:'dandelion'},{id:'k',a:6,b:9,d:3,toy:'whiskerton'},{id:'l',a:2,b:5,d:10,toy:'moonbeam'},
 {id:'m',a:6,b:8,d:12,toy:'galaxy'},{id:'n',a:5,b:7,d:14,toy:'mint'},{id:'o',a:14,b:16,d:8,toy:'rainbow'},
 {id:'★',a:9,b:12,d:8,toy:'golden',secret:1}];
const BC=[['#ff4f8b','#ff9cc2'],['#2f7bff','#8fc3ff'],['#0fb39a','#86ead4'],['#7c4dff','#c3aaff'],['#ff7a1a','#ffc287'],['#e8364f','#ff98a6']],GOLD=['#c9940a','#ffe27a'];

 else{const g=gcd(a,b),p=a/g,q=b/g;S2.push({c:1,q:`Tricky one! ${b} can’t jump straight to ${d}. Shrink ${a}/${b} first. What number goes into BOTH ${a} and ${b}?`,o:opts('÷',g),ans:'÷'+g,log:`Shrink both by ÷ ${g}`},{q:`${a} ÷ ${g} = ?`,ans:p,log:`Top: ${a} ÷ ${g} = ${p}`},{q:`${b} ÷ ${g} = ?`,ans:q,log:`Bottom: ${b} ÷ ${g} = ${q}, so ${a}/${b} is the same as ${p}/${q}`});mul(p,q,d,`Now ${p}/${q} = ?/${d}. `,1)}
 return S2}
function why(v,a,b,d){if(v===a)return'You kept the top the same, but the bottom changed! The top has to change the same way.';if(v===b||v===d)return'That’s a bottom number. The top needs its own number!';if(v===a+(d-b))return'Looks like you added. Fractions stay equal when you multiply or divide, not add!';return'Not quite! Ask yourself: what did the bottom get multiplied or divided by?'}

// shelf
function shelf(){
 const done=P.filter(p=>!p.secret&&S.got[p.toy]).length,all=Object.keys(S.got).length;
 $('#count').textContent=`${all} of 16 kitties collected`;$('#meter').style.width=(all/16*100)+'%';
 $('#grid').innerHTML=P.map((p,i)=>{const t=T[p.toy],g=S.got[p.toy];
  if(g)return `<button class="slot" data-v="${p.toy}" id="s-${p.toy}"><span class="toybox" style="--g:${R[t.r].g}">${kitty(t,g.shiny)}</span><span class="nm">${t.name}${g.shiny?' ✦':''}</span></button>`;
  const col=p.secret?GOLD:BC[i%BC.length],lock=p.secret&&done<15;
  return `<button class="slot${lock?' lock':''}" data-p="${i}" aria-label="Mystery bag ${p.id}"><span class="bag mini" style="--c1:${col[0]};--c2:${col[1]}"><span class="zz">${face(p,t,0)}</span></span>${lock?`<span class="lk">${LOCK}<b>Open all 15</b></span>`:''}<span class="nm">${p.secret?'Secret bag':'Bag '+p.id}</span></button>`}).join('');
 const b=$('#bonus');
 if(all>=16){const left=Object.values(S.got).filter(g=>!g.shiny).length;b.hidden=false;b.innerHTML=left?`<button class="cta" id="hunt">Open a shiny-hunt bag</button><span>${left} kitt${left===1?'y isn’t':'ies aren’t'} shiny yet. Solve on the first try to make one shiny!</span>`:'<b>Every kitty is shiny. Master collector!</b>'}else b.hidden=true}
$('#grid').onclick=e=>{const s=e.target.closest('.slot');if(!s)return;ac();if(s.dataset.v)return view(s.dataset.v);const i=+s.dataset.p,p=P[i];if(s.classList.contains('lock')){SFX.boop();return toast('Open all 15 bags to unlock the golden secret bag!')}open(p,p.secret?GOLD:BC[i%BC.length])};
$('#bonus').onclick=e=>{if(e.target.id!=='hunt')return;ac();const pool=Object.keys(S.got).filter(k=>!S.got[k].shiny),toy=pool[Math.floor(Math.random()*pool.length)],b=[2,3,4,5,6][Math.floor(Math.random()*5)],k=[2,3,4][Math.floor(Math.random()*3)],a=1+Math.floor(Math.random()*(b-1));const q=Math.random()<.5?{a,b,d:b*k}:{a:a*k,b:b*k,d:b};open({id:'Bonus',...q,toy,bonus:1},BC[Math.floor(Math.random()*6)])};
$('#snd1').onclick=toggleSnd;
$('#foot').onclick=e=>{const id=e.target.id;if(id==='reset')$('#foot').innerHTML='<span>Start over? Every kitty goes back in its bag.</span><button class="yes" id="yes">Yes, start over</button><button id="no">Keep my kitties</button>';if(id==='yes'){S={got:{},mute:S.mute};save();shelf()}if(id==='yes'||id==='no')$('#foot').innerHTML='<button id="reset">Grown-ups: start the collection over</button>'};

// unboxing stage
function phase(x){cur.ph=x;$('#stage').className='stage '+{feel:'feel',solve:'solving',tear:'reveal',ripped:'reveal ripped',done:'reveal ripped done',view:'reveal ripped done view'}[x]}
function bar(){return `<div class="bar"><button class="back" id="back">‹ Back to shelf</button><button class="sndb" id="snd2">${sndLabel()}</button></div>`}
function open(p,col){
 const t=T[p.toy];cur={p,t,n:0,tries:0,helped:0,typed:'',H:null,tear:0,ans:p.a*p.d/p.b,sh:0};
 $('#stage').innerHTML=`${bar()}<div class="left"><div class="bagwrap" id="bw" style="--glow:${R[t.r].g}"><div class="rays"></div><div class="big" id="bb" style="--c1:${col[0]};--c2:${col[1]}" role="button" aria-label="Mystery bag"><span class="pt">${face(p,t,1)}</span><span class="pb">${face(p,t,1)}</span></div><div class="tline"></div><div class="fing">${ARROW}</div><div class="toyout"></div></div><p class="clue" id="clue">Squish the bag to feel what’s inside!</p></div><div class="card" id="card">${card(p)}</div><div class="prize" id="prize"></div>`;
 phase('feel');show();bind();say('Squish the bag to feel what’s inside!');
 Voice.warm([R[t.r].line,`My fur is ${t.fw}…`,AC[t.acc],'Crack the code to open it!',probText(),'YES! First try, so this kitty will be SHINY!','You cracked the code!','Now tear it open!',gotLine(t,1),gotLine(t,0),'Let’s crack it together, one step at a time.'].concat(plan(p.a,p.b,p.d).map(s=>s.q)))}
function view(id){
 const t=T[id];cur={p:{toy:id},t,ph:'view'};
 $('#stage').innerHTML=`${bar()}<div class="left"><div class="bagwrap" style="--glow:${R[t.r].g}"><div class="rays"></div><div class="toyout">${kitty(t,S.got[id].shiny)}</div></div></div><div class="prize" id="prize"></div>`;
 phase('view');show();prize(1);$('#back').onclick=close;$('#snd2').onclick=toggleSnd}
function show(){$('#play').classList.add('on');$('#play').scrollTop=0;document.body.style.overflow='hidden'}
function close(){$('#play').classList.remove('on');document.body.style.overflow='';Voice.stop();const id=cur&&cur.ph==='done'?cur.p.toy:null;cur=null;drag=null;shelf();const el=id&&$('#s-'+id);if(el){el.classList.add('new');el.scrollIntoView({block:'center',behavior:'smooth'})}}
function card(p){
 const pic=p.pic?`<div class="pics">${shp(p.pic,p.b,p.a,0)}<b class="eqs">=</b>${shp(p.pic,p.d,0,1)}</div><p class="tip">Tap the slices to shade the same amount.</p>`:'';
 return `${pic}<div class="eq"><span class="fr"><span>${p.a}</span><hr><span>${p.b}</span></span><span class="mid"><span class="pill" id="pt"></span><span>=</span><span class="pill" id="pb2"></span></span><span class="fr"><span class="ans" id="ans"></span><hr><span>${p.d}</span></span><button class="spk" id="spk" aria-label="Read it to me">${SPK}</button></div>
 <p class="msg" id="msg">Solve it by yourself on the first try for a ✦ shiny ✦ kitty!</p><div class="help" id="help"></div>
 <div class="pad" id="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="del" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="go" class="go">Check</button></div>
 <div class="row"><p class="sticky">Ask yourself: “What do I need to multiply or divide by?”</p><button class="crack" id="crack">Crack it with me</button></div>`}
function bind(){
 const bb=$('#bb');
 $('#back').onclick=close;$('#snd2').onclick=toggleSnd;
 bb.onclick=()=>{ac();if(cur.ph==='feel')squish();else if(cur.ph==='solve'){SFX.crinkle();bump()}};
 bb.onpointerdown=e=>{if(cur.ph!=='tear')return;ac();drag={x:e.clientX,t:cur.tear,m:0};try{bb.setPointerCapture(e.pointerId)}catch(x){}};
 bb.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.m=Math.max(drag.m,Math.abs(dx));setTear(drag.t+Math.max(0,dx)/bb.clientWidth*1.1)};
 bb.onpointerup=bb.onpointercancel=()=>{if(!drag)return;const m=drag.m;drag=null;if(m<8)setTear(cur.tear+.34)};
 $('#pad').onclick=e=>{const k=e.target.closest('button');if(k)key(k.dataset.k)};
 $('#crack').onclick=startHelp;
 $('#spk').onclick=()=>say(probText());
 $('#help').onclick=e=>{const o=e.target.closest('.opt');if(o)choose(o)};
 $('#card').addEventListener('click',e=>{const sl=e.target.closest('.tap path');if(!sl||cur.ph!=='solve'||cur.H)return;sl.classList.toggle('on');cur.typed=String($$('.tap path.on').length);showAns();SFX.click()})}
function bump(){const b=$('#bb');b.classList.remove('sq');void b.offsetWidth;b.classList.add('sq')}
function shake(el){if(!el)return;el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad')}
function msg(m){$('#msg').textContent=m}
function squish(){
 if(cur.n>=3)return;cur.n++;SFX.crinkle();bump();
 const bb=$('#bb'),t=cur.t,n=cur.n,lv=[[.28,'8px'],[.55,'4px'],[.85,'1.2px']][n-1];
 bb.style.setProperty('--op',lv[0]);bb.style.setProperty('--bl',lv[1]);
 const c=n===1?R[t.r].line:n===2?`My fur is ${t.fw}…`:AC[t.acc];
 if(n===1)$('#bw').classList.add('glow');
 $('#clue').textContent=c;if(n<3)say(c);else say(c,'Crack the code to open it!',probText());
 if(n===3)setTimeout(()=>{if(!cur||cur.ph!=='feel')return;phase('solve');$('#clue').textContent='Crack the code to open it!'},1500)}
function showAns(){$('#ans').textContent=cur.typed}
function key(k){
 if(cur.ph!=='solve')return;SFX.click();const H=cur.H;
 if(k==='go')return H?hCheck():check();
 if(H&&(!H.s[H.i]||H.s[H.i].c))return toast('Tap one of the answer buttons above!');
 let v=H?H.t:cur.typed;
 if(k==='del')v=v.slice(0,-1);else if(v.length<2)v=(v==='0'?'':v)+k;
 if(H){H.t=v;$('#hslot').textContent=v||'?'}else{cur.typed=v;showAns()}}
function check(){
 if(cur.typed==='')return;const v=+cur.typed,p=cur.p;
 if(v===cur.ans)return win();
 cur.tries++;SFX.boop();shake($('#ans'));bump();
 const m=why(v,p.a,p.b,p.d),auto=cur.tries>=2&&!cur.H;msg(m);if(!auto)say(m);cur.typed='';setTimeout(()=>{if(cur&&cur.ph==='solve')showAns()},600);
 if(auto)setTimeout(()=>startHelp(m),1200)}
function startHelp(pre){
 if(!cur||cur.H||cur.ph!=='solve')return;pre=typeof pre==='string'?pre:'';cur.helped=1;cur.H={s:plan(cur.p.a,cur.p.b,cur.p.d),i:0,t:''};cur.typed='';showAns();
 $('#help').classList.add('on');$('#crack').hidden=true;msg('Let’s crack it together, one step at a time.');rHelp();say(pre,'Let’s crack it together, one step at a time.',cur.H.s[0].q)}
function rHelp(){const H=cur.H,st=H.s[H.i];$('#help').innerHTML=`${H.i?`<ol class="log">${H.s.slice(0,H.i).map(x=>`<li>${x.log} ✓</li>`).join('')}</ol>`:''}${st?`<p class="hq">${st.q}</p>${st.c?`<div class="opts">${st.o.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>`:`<span class="hslot" id="hslot">${H.t||'?'}</span>`}`:''}`}
function choose(o){const H=cur.H,st=H.s[H.i];if(!st||!st.c)return;if(o.dataset.o===st.ans){SFX.ding();next()}else{SFX.boop();o.disabled=true;shake(o)}}
function hCheck(){const H=cur.H,st=H.s[H.i];if(!st||st.c||H.t==='')return;if(+H.t===st.ans){SFX.ding();next()}else{SFX.boop();H.t='';shake($('#hslot'));setTimeout(()=>{if(cur&&cur.H)$('#hslot').textContent='?'},400)}}
function next(){const H=cur.H,st=H.s[H.i];if(st.pill){const el=$(st.pill[0]==='t'?'#pt':'#pb2');el.textContent=st.pill[1];el.classList.add('show')}H.i++;H.t='';rHelp();const nx=H.s[H.i];if(nx)say(nx.q);else{cur.typed=String(cur.ans);showAns();win()}}
function win(){
 cur.ph='won';cur.sh=!cur.tries&&!cur.helped;const a=$('#ans');a.textContent=cur.ans;a.classList.add('ok');SFX.ding();setTimeout(SFX.ding,180);
 if(cur.p.pic)$$('.tap path').forEach((e,i)=>e.classList.toggle('on',i<cur.ans));
 const m=cur.sh?'YES! First try, so this kitty will be SHINY!':'You cracked the code!';msg(m);say(m,'Now tear it open!');
 setTimeout(()=>{if(!cur||cur.ph!=='won')return;phase('tear');$('#clue').textContent='Tear it open! Swipe across the top of the bag.';$('#play').scrollTo({top:0,behavior:'smooth'})},1600)}
function setTear(v){if(cur.ph!=='tear')return;const old=cur.tear;cur.tear=Math.min(1,v);if(Math.floor(cur.tear*5)>Math.floor(old*5))SFX.crinkle();$('#bb').style.setProperty('--tp',cur.tear);if(cur.tear>=.75)rip()}
function rip(){
 if(cur.ph!=='tear')return;drag=null;SFX.rip();
 const t=cur.t,k=cur.p.toy,prev=S.got[k],shiny=!!((prev&&prev.shiny)||cur.sh);S.got[k]={shiny};save();
 $('.toyout').innerHTML=kitty(t,shiny);$('#clue').textContent='';phase('ripped');
 setTimeout(()=>{SFX.fanfare();confetti(R[t.r].c)},450);
 setTimeout(()=>{if(cur&&cur.ph==='ripped'){phase('done');prize(0)}},1300)}
function prize(isView){
 const t=cur.t;let sub='';
 if(isView)sub=S.got[cur.p.toy].shiny?'✦ Shiny ✦':'';
 else if(cur.p.bonus)sub=cur.sh?'It’s SHINY now!':'Solve one on the first try to make it shiny. Try another bonus bag!';
 else if(cur.sh)sub='✦ SHINY ✦ You solved it all by yourself!';
 $('#prize').innerHTML=`<span class="rar" style="background:${R[t.r].c}">${R[t.r].n}</span><h2>${t.name}</h2>${sub?`<p class="sub">${sub}</p>`:''}<button class="cta" id="keep">${isView?'Back to shelf':'Put it on my shelf'}</button>`;
 $('#keep').onclick=close;
 if(!isView)say(gotLine(t,cur.sh))}
function gotLine(t,sh){return `You got ${t.name}!${t.r>1?' A '+R[t.r].n+' kitty!':''}${sh?' And it’s shiny!':''}`}
function confetti(col){const box=document.createElement('div'),cs=['#ff3d7f','#ffd23f','#2f7bff','#12a862','#ff7a1a','#a78bfa',col];box.className='conf';
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<80;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;background:${cs[i%cs.length]};animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;--x:${(Math.random()-.5)*200}px;--r:${Math.random()*720}deg;width:${6+Math.random()*6}px;height:${8+Math.random()*8}px`;box.appendChild(e)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3800)}

$('#snd1').textContent=sndLabel();$('#shelfbtn').onclick=()=>{Voice.stop();save();window.PP&&PP.exit()};
shelf();
}
</script>
</body>
