<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraction Wizards Blind Bags</title>
<script src="../../pp-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
/* VOICE: wizard-school wonder with a kind, patient tutor
   IDEA: a night-sky shelf of foil blind bags; each is sealed by one fraction spell (8 skills, 3 rounds, harder each round)
   PICTURE: foil pouches that squish, glow, show a silhouette, then tear open; code-drawn big-head vinyl wizards with powers
   COLOUR+TYPE: midnight indigo with starlight, parchment spell card, jewel foil; Baloo 2 + Nunito, Gochi Hand sticky note
   LAYOUT: shelf grid -> full-screen unboxing stage: bag on top, spell + keypad below (side by side on tablets) */
:root{color-scheme:dark;--bg:#251a57;--dot:#ffffff26;--ink:#fff3d6;--card:#fffaf0;--line:#ffffff24;--soft:#d6ccff;--key:#efe7ff;--hot:#ff4fa3;--ok:#12a862;--shade:#a78bfa}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(#ffe9a3aa 1.4px,transparent 2px) 13px 21px/61px 53px,radial-gradient(var(--dot) 1.6px,transparent 2.2px) 0 0/34px 34px,linear-gradient(#1b1247,#2e2170 60%,#3a2a83) fixed;color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--hot);outline-offset:3px;border-radius:10px}
h1,h2{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
.top{max-width:1100px;margin:0 auto;padding:24px max(4vw,16px) 6px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.tab{font-weight:800;font-size:15px;border-radius:99px;padding:6px 14px;min-height:40px;background:var(--line)}.tab.on{background:var(--ink);color:var(--bg)}.tab i{font-style:normal;background:var(--hot);color:#fff;border-radius:99px;padding:0 7px;margin-left:6px;font-size:12px}.chip{display:inline-block;background:var(--ink);color:var(--bg);border-radius:99px;padding:1px 12px;font-size:14px;font-weight:800;margin-bottom:6px}
h1{font-size:clamp(38px,7vw,52px);font-weight:800}
.lede{margin:6px 0 0;max-width:46ch;color:var(--soft)}
.prog{display:flex;flex-direction:column;gap:6px;font-weight:800}
.meter{width:200px;height:16px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--hot);border-radius:9px;transition:width .8s}
.hrow{display:flex;gap:8px;flex-wrap:wrap}.sndb{align-self:flex-start;font-size:14px;font-weight:800;padding:8px 14px;border-radius:99px;background:var(--line);min-height:40px}
#bonus{max-width:1100px;margin:6px auto 0;padding:0 max(4vw,16px);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
#bonus[hidden]{display:none}
.grid{max-width:1100px;margin:0 auto;padding:18px max(4vw,16px) 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:26px 18px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.slot:hover{transform:translateY(-4px) rotate(-1deg)}
.slot:nth-child(3n+1) .mini{transform:rotate(-3deg)}.slot:nth-child(3n+2) .mini{transform:rotate(2deg)}
.nm{font-size:14px;font-weight:800;text-align:center;line-height:1.2}
.lock .mini{filter:grayscale(.6) brightness(.8) drop-shadow(0 6px 6px #0003)}
.lk{position:absolute;inset:18% 10% auto;display:flex;flex-direction:column;align-items:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000a}
.lk svg{width:34px;height:34px}
.toybox{display:block;width:100%;aspect-ratio:120/140;border-radius:20px;background:radial-gradient(circle at 50% 50%,var(--g),transparent 68%)}
.toybox svg{width:100%;height:100%;display:block}
.new{animation:pop2 .9s}
@keyframes pop2{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.foot{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px) 36px;font-size:14px;color:var(--soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot button{text-decoration:underline;min-height:40px}
.foot .yes{background:var(--hot);color:#fff;text-decoration:none;border-radius:99px;padding:6px 14px}
/* bags */
.bag{display:block;position:relative;width:100%;aspect-ratio:3/4}
.mini{font-size:11px;filter:drop-shadow(0 6px 6px #0003)}
.zz,.pt,.pb{display:block;position:absolute;inset:0;background:linear-gradient(150deg,var(--c1),var(--c2) 55%,var(--c1))}
.zz::after,.pt::after,.pb::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,#ffffff8c 46%,transparent 60%) 0 0/260% 100%;animation:sh 3.4s linear infinite;pointer-events:none}
@keyframes sh{from{background-position:130% 0}to{background-position:-140% 0}}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45em;padding-top:1.4em;color:#fff;text-align:center}
.hole{position:absolute;top:5.5%;left:50%;width:1.2em;height:.55em;margin-left:-.6em;border-radius:99px;background:#0003}
.brand{font:800 1em/.95 'Baloo 2',sans-serif;letter-spacing:.03em;text-shadow:0 2px 0 #0003}
.win{position:relative;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#ffffffee,#ffffff80);display:grid;place-items:center;box-shadow:inset 0 0 0 .2em #ffffffa0;overflow:hidden}
.win>b,.q{font:800 2.6em/1 'Baloo 2',sans-serif;color:var(--c1)}
.tag{font:800 1em/1.3 'Baloo 2',sans-serif;background:#fff;color:var(--c1);border-radius:99px;padding:0 .7em}
/* play stage */
#play{position:fixed;inset:0;z-index:5;background:inherit;overflow-y:auto;display:none}
#play.on{display:block}
.stage{max-width:560px;margin:0 auto;padding:12px 16px 32px;display:grid;justify-items:center;gap:10px}
.bar{width:100%;display:flex;justify-content:space-between;gap:10px}
.back{font-weight:800;font-size:16px;min-height:44px;padding:0 14px;border-radius:99px;background:var(--card)}
.left{display:grid;justify-items:center;gap:6px;width:100%}
.bagwrap{position:relative;width:min(60vw,230px);aspect-ratio:3/4;font-size:19px;transition:width .5s,font-size .5s}
.bagwrap::before{content:'';position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(var(--glow),transparent 62%);opacity:0;transition:opacity .8s}
.bagwrap.glow::before{opacity:1;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.feel .bagwrap{animation:tease 2.6s ease-in-out infinite}
@keyframes tease{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(-7deg)}87%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
.big{position:absolute;inset:0;cursor:pointer;filter:drop-shadow(0 12px 14px #0005);--op:0;--bl:10px}
.big .win svg{position:absolute;inset:6%;width:88%;height:88%;filter:brightness(0) blur(var(--bl));opacity:var(--op);transition:opacity .6s,filter .6s}
.big .q{position:absolute;opacity:calc(1 - var(--op) * 1.3);transition:opacity .6s}
.sq{animation:sq .4s}
@keyframes sq{30%{transform:scale(1.13,.84)}60%{transform:scale(.93,1.07)}}
.clue{margin:0;min-height:2.8em;text-align:center;font:800 20px/1.3 'Baloo 2',sans-serif;max-width:30ch}
.solving .bagwrap{width:min(32vw,128px);font-size:10.5px}
.solving .clue{font-size:17px;min-height:0}
.reveal .big{touch-action:none}
.reveal .pt{transform-origin:100% 22%;transform:rotate(calc(var(--tp,0) * -16deg)) translateY(calc(var(--tp,0) * -5%))}
.tline{position:absolute;left:5%;right:5%;top:21.5%;border-top:3px dashed #fff;opacity:0;pointer-events:none;filter:drop-shadow(0 1px 1px #0006)}
.fing{position:absolute;top:calc(21.5% - 21px);left:4%;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--hot);display:grid;place-items:center;box-shadow:0 4px 10px #0005;opacity:0;pointer-events:none}
.reveal:not(.ripped) .tline,.reveal:not(.ripped) .fing{opacity:1}
.reveal:not(.ripped) .fing{animation:swipe 1.5s ease-in-out infinite}
@keyframes swipe{0%{left:4%}70%,100%{left:78%}}
.rays{position:absolute;inset:-45%;border-radius:50%;background:repeating-conic-gradient(var(--glow) 0 9deg,transparent 9deg 20deg);-webkit-mask:radial-gradient(#000 15%,transparent 66%);mask:radial-gradient(#000 15%,transparent 66%);opacity:0;pointer-events:none}
.ripped .rays{opacity:1;transition:opacity .6s .3s;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.ripped .big{pointer-events:none}
.ripped .pt{animation:fly .7s forwards}
@keyframes fly{to{transform:translate(75%,-95%) rotate(42deg);opacity:0}}
.ripped .pb{animation:drop .9s .2s forwards}
@keyframes drop{to{transform:translateY(85%) scale(.9);opacity:0}}
.toyout{position:absolute;left:50%;top:50%;width:112%;transform:translate(-50%,-30%) scale(.1);opacity:0;pointer-events:none}
.toyout svg{width:100%;display:block}
.ripped .toyout{animation:pop .9s .35s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.view .toyout{animation:none;transform:translate(-50%,-50%);opacity:1}
.view .big,.view .clue{display:none}
.card{display:none;width:100%;background:var(--card);border-radius:24px;padding:16px;box-shadow:0 8px 0 #0000001c;flex-direction:column;align-items:center;gap:12px}
.solving .card{display:flex;animation:up .45s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.pics{display:flex;align-items:center;gap:18px}
.eqs{font:800 34px 'Baloo 2',sans-serif}
.shape{width:min(27vw,108px);height:auto;display:block}
.shape path{fill:var(--card);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;transition:fill .25s}
.shape path.on{fill:var(--shade)}
.shape.tap path{cursor:pointer}
.tip{margin:-6px 0 0;font-size:14px;color:var(--soft)}
.eq{display:flex;align-items:stretch;gap:16px;font:800 44px/1 'Baloo 2',sans-serif}
.fr{display:flex;flex-direction:column;align-items:center}
.fr>span{height:60px;min-width:64px;display:grid;place-items:center}
.fr hr{align-self:stretch;border:0;border-top:5px solid currentColor;border-radius:3px;margin:6px 0}
.ans{border:4px dashed var(--hot);border-radius:14px;color:var(--hot);min-width:70px}
.ans.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.mid{display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.pill{font:800 18px/1.4 'Baloo 2',sans-serif;background:var(--hot);color:#fff;border-radius:99px;padding:1px 10px;visibility:hidden;min-height:26px}
.pill.show{visibility:visible;animation:pop2 .5s}
.spk{align-self:center;width:44px;height:44px;border-radius:50%;background:var(--key);display:grid;place-items:center}
.msg{margin:0;text-align:center;font-weight:800;min-height:1.5em;max-width:36ch}
.help{display:none;width:100%;border-radius:18px;background:light-dark(#e9f3ff,#1f2c52);padding:12px 14px}
.help.on{display:block;animation:up .35s}
.log{margin:0 0 6px;padding-left:20px;color:var(--soft);font-size:15px}
.hq{margin:0 0 10px;font-weight:800;font-size:18px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{min-width:72px;min-height:52px;border-radius:14px;background:#fff;color:#1b1640;font:800 24px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #0002}
.opt:disabled{opacity:.35}
.hslot{display:inline-grid;place-items:center;min-width:70px;height:56px;border:4px dashed #2f7bff;border-radius:14px;font:800 32px 'Baloo 2',sans-serif;color:#2f7bff}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:100%;max-width:330px}
.pad button{height:56px;border-radius:16px;background:var(--key);font:800 28px 'Baloo 2',sans-serif;box-shadow:0 4px 0 #0002}
.pad button:active{transform:translateY(3px);box-shadow:none}
.pad .go{background:var(--ok);color:#fff;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center}
.sticky{margin:4px 0;font:21px/1.15 'Gochi Hand',cursive;background:#fff59d;color:#2a2a2a;padding:10px 14px;transform:rotate(-2deg);box-shadow:0 6px 12px #0003;max-width:250px}
.crack{min-height:48px;padding:0 18px;border-radius:99px;border:3px solid #2f7bff;color:#2f7bff;font-weight:800;background:var(--card)}
.crack[hidden]{display:none}
.bad{animation:no .4s}
@keyframes no{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.prize{display:none;text-align:center;gap:8px;justify-items:center}
.done .prize{display:grid;animation:up .5s}
.rar{color:#fff;font-weight:800;border-radius:99px;padding:2px 14px;font-size:15px}
.prize h2{font-size:clamp(38px,9vw,52px);font-weight:800}
.sub{margin:0;font-weight:800;max-width:30ch}
.cta{min-height:52px;padding:0 24px;border-radius:99px;background:var(--hot);color:#fff;font:800 20px 'Baloo 2',sans-serif;box-shadow:0 5px 0 #0003;margin-top:6px}
.kit .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.shiny{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #ffd23f)}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.3) rotate(45deg);opacity:.4}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:860px){
 .stage.solving{max-width:1000px;grid-template-columns:300px minmax(0,1fr);align-items:start}
 .stage.solving .bar{grid-column:1/-1}
 .stage.solving .bagwrap{width:230px;font-size:19px}
 .stage.solving .left{position:sticky;top:12px}
}

.back{color:#231b4d}
.bar{position:relative;z-index:3}.bagwrap::before,.rays{pointer-events:none}
.card{color:#231b4d;--ink:#231b4d;--soft:#5b5385;--line:#231b4d22}
.skill{font:800 13px/1 'Baloo 2',sans-serif;letter-spacing:.06em;text-transform:uppercase;background:#ede7ff;color:#5b21b6;border-radius:99px;padding:7px 12px 5px}
.story{margin:0;font-size:19px;line-height:1.7;text-align:center;max-width:34ch}
.ifr{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.05;font-weight:800;text-align:center;margin:0 3px;font-size:.92em}.ifr b{display:block;padding:0 3px}.ifr b:first-child{border-bottom:2px solid currentColor}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;font:800 40px/1 'Baloo 2',sans-serif}
.grp{display:flex;align-items:center;gap:12px}
.mx{display:flex;align-items:center;gap:6px}.wh{font-size:54px}
.fr>span{height:52px;min-width:52px}.fr>.ans{height:52px;min-width:54px}
.ans.wb{height:68px;min-width:58px;font-size:50px;display:grid;place-items:center}
.tip{margin:-4px 0 0;font-size:15px;color:var(--soft);font-weight:800}
.bars{display:grid;gap:6px;justify-items:center;width:100%}.bars[hidden]{display:none}
.brow{display:flex;align-items:center;gap:8px;width:min(100%,320px)}.blab{font-size:20px;min-width:30px}.fbar{flex:1;height:auto;display:block}
.cps{display:flex;align-items:center;gap:14px}
.cpb{background:#f3edff;border-radius:20px;padding:12px 20px;font:800 44px/1 'Baloo 2',sans-serif;box-shadow:0 5px 0 #0002;color:#231b4d;min-width:96px}
.cpb:active{transform:translateY(3px);box-shadow:none}.cpb:disabled{opacity:.35}.cpb.ok{background:#bbf7d0;outline:4px solid var(--ok)}
.cpe{min-height:46px;padding:0 20px;border-radius:99px;background:#f3edff;font-weight:800;box-shadow:0 4px 0 #0002}.cpe:disabled{opacity:.35}.cpe.ok{background:#bbf7d0}
.or{font-size:18px;color:var(--soft)}
.ask{font:800 26px 'Baloo 2',sans-serif}
.pad .go{grid-column:1/-1;font-size:22px}.pad .nx{font-size:17px}
.opt{padding:0 12px}.opt .ifr{font-size:.8em}.hq .ifr{font-size:1em}
.pow{display:inline-block;background:#ffffff26;border-radius:99px;padding:3px 14px;font-weight:800}
.wiz .bob{transform-box:view-box;transform-origin:60px 96px;animation:bobble 3.2s ease-in-out infinite}
@keyframes bobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.wiz .wave{transform-box:view-box;transform-origin:78px 100px;animation:wand 2.4s ease-in-out infinite}
@keyframes wand{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.wiz .pw{transform-box:fill-box;transform-origin:center;animation:pw 1.6s ease-in-out infinite}
@keyframes pw{50%{transform:scale(1.15)}}
.wiz .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.shiny{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #ffd23f)}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.3) rotate(45deg);opacity:.4}}
.ans.fb{cursor:pointer;background:none;font:inherit;line-height:1}.ans.fb.act{border-style:solid;box-shadow:0 0 0 5px #ff4fa330}
.ans.give{border:4px solid #2f7bff;color:#2f7bff}
.bst{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);pointer-events:none;animation:bst 1s ease-out forwards;z-index:3}
@keyframes bst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(180deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.feel .bagwrap,.zz::after,.pt::after,.pb::after,.ripped .rays,.tw,.bagwrap.glow::before,.wiz .bob,.wiz .wave,.wiz .pw,.wiz .eyes,.bst{animation:none}}

</style>
</head>
<body>
<header class="top">
  <div>
    <span class="chip">Grade 4 · Fractions</span>
    <h1>Fraction Wizards</h1>
    <p class="lede">Every bag is sealed with a fraction spell. Squish it, cast the spell, then tear it open to meet the wizard inside.</p>
  </div>
  <div class="prog">
    <span id="count">0 of 25 wizards</span>
    <span class="meter"><i id="meter"></i></span>
    <span class="hrow"><button class="sndb" id="shelfbtn">‹ Bookshelf</button><button class="sndb" id="snd1">Sound on</button><button class="sndb" id="mus1">Music on</button></span>
  </div>
</header>
<div id="bonus" hidden></div>
<main class="grid" id="grid"></main>
<footer class="foot" id="foot"><button id="reset">Grown-ups: start the collection over</button></footer>
<div id="play"><div class="stage" id="stage"></div></div>
<div id="toast"></div>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const GAME_ID='fraction-wizards';
// ---------- wizard figurines: big-head vinyl style, drawn in code ----------
const SKN=['#ffdcc2','#f3c29b','#d9a06f','#a86b45','#6e4329'];
const R={1:{n:'Apprentice',c:'#7f8bb0',g:'#ffffffb0',line:'This one feels like a friendly APPRENTICE…'},2:{n:'Adept',c:'#2f7bff',g:'#6fb3ffd0',line:'Ooh, it’s buzzing with blue magic… an ADEPT!'},3:{n:'Archmage',c:'#d22fd8',g:'#ff7ae8d0',line:'WHOA! It’s crackling pink… an ARCHMAGE!'},4:{n:'Legendary',c:'#d99a00',g:'#ffd23fe6',line:'It’s glowing pure GOLD… LEGENDARY!'}};
// [id, name, rarity, skin, hair, hairStyle, hat, robe, trim, scarf(a,b or ''), power, powerName, extra, robeWords]
const WZ=[
 ['pippa','Pippa Sparkwell',1,0,'#f6c453','pony','point','#6d28d9','#fcd34d','','star','Star Sparks','cat','purple'],
 ['milo','Milo Mossgrove',1,2,'#4a2c1a','curly','','#15803d','#bbf7d0','#f97316,#fde68a','leaf','Plant Growing','frog','leafy green'],

const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a/gcd(a,b)*b;

function tgt(p){
 if(p.k==='im')return{N:p.n,D:p.d,form:'m'};
 if(p.k==='mi')return{N:p.w*p.d+p.n,D:p.d,form:'f'};

 if(p.k==='cp'){const[[a,b],[c,e]]=p.f,x=a*e,y=c*b;return{form:'c',c:x>y?0:x<y?1:2}}
 const A=p.L[0]*p.d+p.L[1],N=p.op==='-'?A-p.r:A+p.r;return{A,N,D:p.d,form:N>p.d?'m':'f'}}
const keysOf=T=>T.form==='m'?['w','n','d']:T.form==='f'?['n','d']:T.form==='x'?['x']:[];

 case 'eq':return p.c?`${fw(p.a,p.b)} equals ${p.c} over what?`:`${fw(p.a,p.b)} equals how many ${pl(p.d)}?`;
 case 'cp':return `Which fraction is greater: ${fw(...p.f[0])}, or ${fw(...p.f[1])}?`;

 case 'mi':return `Change ${mw(p.w,p.n,p.d)} into an improper fraction.`;

function bars(p,T){
 const W=240,H=26,C={a:'#a78bfa',b:'#fbbf24',x:'#fecdd3'};
 const one=(fills,d,lab)=>`<div class="brow">${lab?`<span class="blab">${lab}</span>`:''}<svg class="fbar" viewBox="-2 -2 ${W+4} ${H+4}" aria-hidden="true">${fills.map((f,i)=>{const x=(i*W/d).toFixed(2),w=(W/d).toFixed(2);return `<rect x="${x}" y="0" width="${w}" height="${H}" fill="${C[f]||'#fff'}" stroke="#231b4d" stroke-width="1.6"/>${f==='x'?`<path d="M${(+x+4).toFixed(1)} 4 L${(+x+ +w-4).toFixed(1)} ${H-4}" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round"/>`:''}`}).join('')}</svg></div>`;
 const run=(seq,d)=>{const out=[];for(let i=0;i<Math.max(1,Math.ceil(seq.length/d));i++){const f=seq.slice(i*d,i*d+d);while(f.length<d)f.push('');out.push(one(f,d,''))}return out.join('')};

function card(p){
 const T=cur.T,head=`<span class="skill">${p.bonus?'Bonus · ':''}${SK[p.k]}</span>`,spk=`<button class="spk" id="spk" aria-label="Read it to me">${SPK}</button>`;

// ---------- checking answers ----------
function judge(p,T,v){
 if(T.form==='x'){const x=v.x;if(x===T.x)return true;
  if(p.c)return x===p.b+(p.c-p.a)?'Looks like you added. Equal fractions multiply, they don’t add!':`What did the top get multiplied by? Do the same to the bottom.`;
  return x===p.a+(p.d-p.b)?'Looks like you added. Equal fractions multiply, they don’t add!':`What did the bottom get multiplied by? Do the same to the top.`}
 const w=T.form==='m'?v.w:0,n=v.n,d=v.d;

 if((w*d+n)*T.D===T.N*d)return true;
 if(p.k==='im')return w!==Math.floor(p.n/p.d)?`How many groups of ${p.d} fit inside ${p.n}?`:'Right number of wholes! Now, how many are left over?';
 if(p.k==='mi'){if(n===p.w+p.n)return `Each whole has ${p.d} pieces, not 1! Multiply ${p.w} × ${p.d} first.`;if(n===p.w*p.d)return `Almost! Now add the ${p.n} extra pieces.`;if(d!==p.d)return `The pieces are still ${pl(p.d)}, so the bottom stays ${p.d}.`;return `Wholes × bottom, then add the top: ${p.w} × ${p.d} + ${p.n}.`}
 if(p.op==='+'&&d===2*p.d)return `Don’t add the bottoms! The pieces stay the same size, so the bottom stays ${p.d}.`;
 if(p.op==='-'&&d===0)return `Don’t take away the bottoms! The bottom stays ${p.d}.`;
 if(p.k==='wp'){const A=T.A,o=p.op==='-'?A+p.r:A-p.r;if(o>0&&(w*d+n)*p.d===o*d)return 'Read it again. Do we put the parts together, or take some away?'}
 if(d!==p.d)return `The pieces are ${pl(p.d)}, so the bottom stays ${p.d}.`;
 if(T.form==='m'&&w*d+n!==T.N&&n===T.N%T.D)return `Check your wholes. How many groups of ${p.d} fit in ${T.N}?`;
 if(p.L[0])return `First change ${mixT(p.L[0],p.L[1],p.d)} into ${pl(p.d)}, then do the tops.`;

function cpWhy(p,c){const[[,b],[,e]]=p.f;if(b===e)return 'Same size pieces! Which one has more pieces?';if(c===2)return 'Look closely. They aren’t exactly the same!';return 'Tricky! A bigger bottom means smaller pieces. Make the bottoms match, then compare the tops.'}

// ---------- step-by-step help ----------
function opts(ans,c){const o=[String(ans)];for(const x of c){const s=String(x);if(o.length<3&&!o.includes(s)&&!(typeof x==='number'&&x<0))o.push(s)}return o.sort(()=>Math.random()-.5)}
function plan(p,T){const S=[];
 switch(p.k){
 case 'eq':if(p.c){const k=p.c/p.a;S.push({q:`The top went from ${p.a} to ${p.c}. ${p.a} × what = ${p.c}?`,o:opts('×'+k,['×'+(k+1),'×'+(k-1||k+2),'+'+(p.c-p.a)]),ans:'×'+k,log:`${p.a} × ${k} = ${p.c}`},{q:`Do the same to the bottom: ${p.b} × ${k} = ?`,o:opts(p.b*k,[p.b*k+p.b,p.b+k,p.b*k-1]),ans:String(p.b*k),log:`${p.b} × ${k} = ${p.b*k}`})}
  else{const k=p.d/p.b;S.push({q:`The bottom went from ${p.b} to ${p.d}. ${p.b} × what = ${p.d}?`,o:opts('×'+k,['×'+(k+1),'×'+(k-1||k+2),'+'+(p.d-p.b)]),ans:'×'+k,log:`${p.b} × ${k} = ${p.d}`},{q:`Do the same to the top: ${p.a} × ${k} = ?`,o:opts(p.a*k,[p.a*k+p.a,p.a+k,p.a*k+1]),ans:String(p.a*k),log:`${p.a} × ${k} = ${p.a*k}`})}break;
 case 'cp':{const[[a,b],[c,e]]=p.f,nm=i=>i===2?'They’re equal':`${p.f[i][0]}/${p.f[i][1]}`,ch=p.eqOpt?[0,1,2]:[0,1];

 $('#spk').onclick=()=>say(probSay(cur.p,cur.T));
 $('#help').onclick=e=>{const o=e.target.closest('.opt');if(o)choose(o)};
 $('#card').addEventListener('click',e=>{if(!cur||cur.ph!=='solve')return;const fb=e.target.closest('.fb');if(fb&&!cur.H){SFX.click();focusB(fb.dataset.k);return}const c=e.target.closest('.cpb,.cpe');if(c&&!cur.H)pick(+c.dataset.c,c)})}
function bump(){const b=$('#bb');b.classList.remove('sq');void b.offsetWidth;b.classList.add('sq')}
function shake(el){if(!el)return;el.classList.remove('bad');void el.offsetWidth;el.classList.add('bad')}
function msg(m){$('#msg').innerHTML=txtH(m)}
function squish(){
 if(cur.n>=3)return;cur.n++;SFX.crinkle();bump();
 const bb=$('#bb'),t=cur.t,n=cur.n,lv=[[.28,'8px'],[.55,'4px'],[.85,'1.2px']][n-1];
 bb.style.setProperty('--op',lv[0]);bb.style.setProperty('--bl',lv[1]);
 const c=n===1?R[t.r].line:n===2?clue2(t):PWL[t.pw];
 if(n===1)$('#bw').classList.add('glow');
 $('#clue').textContent=c;if(n<3)say(c);else say(c,'Cast the spell to open it!',probSay(cur.p,cur.T));
 if(n===3)setTimeout(()=>{if(!cur||cur.ph!=='feel')return;phase('solve');$('#clue').textContent='Cast the spell to open it!'},1500)}
// answer boxes
function focusB(k){cur.fk=k;$$('.fb').forEach(e=>e.classList.toggle('act',e.dataset.k===k))}
function showB(k){const el=$(`.fb[data-k="${k}"]`);if(el)el.textContent=cur.v[k]}
function key(k){
 if(!cur||cur.ph!=='solve')return;SFX.click();
 if(cur.H)return toast('Tap one of the answer buttons above!');
 if(k==='go')return check();
 const K=cur.K,f=cur.fk;if(!f)return;
 if(k==='nx'){const i=K.indexOf(f);return focusB(K[(i+1)%K.length])}
 let v=cur.v[f];if(k==='del')v=v.slice(0,-1);else if(v.length<2)v=(v==='0'?'':v)+k;cur.v[f]=v;showB(f)}
function check(){
 const K=cur.K,miss=K.find(k=>cur.v[k]==='');
 if(miss){focusB(miss);msg('Fill in every box first!');shake($(`.fb[data-k="${miss}"]`));return}
 const vals={};K.forEach(k=>vals[k]=+cur.v[k]);const r=judge(cur.p,cur.T,vals);
 if(r===true)return win();
 cur.tries++;SFX.boop();bump();K.forEach(k=>shake($(`.fb[data-k="${k}"]`)));
 const auto=cur.tries>=2&&!cur.H;msg(r);if(!auto)say(txtSay(r));
 setTimeout(()=>{if(!cur||cur.ph!=='solve'||cur.H)return;K.forEach(k=>{cur.v[k]='';showB(k)});focusB(K[0])},700);
 if(auto)setTimeout(()=>startHelp(r),1200)}
function pick(c,el){
 if(c===cur.T.c){el.classList.add('ok');return win()}
 cur.tries++;SFX.boop();bump();el.disabled=true;shake(el);const m=cpWhy(cur.p,c),auto=cur.tries>=2&&!cur.H;msg(m);if(!auto)say(m);
 if(auto)setTimeout(()=>startHelp(m),1200)}
// help
function startHelp(pre){
 if(!cur||cur.H||cur.ph!=='solve')return;pre=typeof pre==='string'?pre:'';cur.helped=1;cur.H={s:plan(cur.p,cur.T),i:0};
 const bs=$('#bars');if(bs)bs.hidden=false;
 $('#help').classList.add('on');$('#crack').hidden=true;msg('Let’s cast it together, one step at a time.');rHelp();say(txtSay(pre),'Let’s cast it together, one step at a time.',txtSay(cur.H.s[0].q));
 $('#help').scrollIntoView({block:'nearest',behavior:'smooth'})}
function rHelp(){const H=cur.H,st=H.s[H.i];$('#help').innerHTML=`${H.i?`<ol class="log">${H.s.slice(0,H.i).map(x=>`<li>${txtH(x.log)} ✓</li>`).join('')}</ol>`:''}${st?`<p class="hq">${txtH(st.q)}</p><div class="opts">${st.o.map(o=>`<button class="opt" data-o="${o}">${txtH(o)}</button>`).join('')}</div>`:''}`}
function choose(o){const H=cur.H,st=H.s[H.i];if(!st)return;if(o.dataset.o===st.ans){SFX.ding();H.i++;rHelp();const nx=H.s[H.i];if(nx)say(txtSay(nx.q));else finishHelp()}else{SFX.boop();o.disabled=true;shake(o)}}
function finishHelp(){
 if(cur.T.form==='c'){const b=$(`[data-c="${cur.T.c}"]`);if(b)b.classList.add('ok');return win()}
 const c=canon(cur.T);cur.K.forEach(k=>{cur.v[k]=String(c[k]);showB(k);const el=$(`.fb[data-k="${k}"]`);if(el)el.classList.add('give')});win()}
function win(){
 cur.ph='won';cur.sh=!cur.tries&&!cur.helped;$$('.fb').forEach(e=>{e.classList.remove('act');e.classList.add('ok')});SFX.ding();setTimeout(SFX.ding,180);
 const m=cur.sh?'YES! First try, so this wizard will be SHINY!':'Spell cast!';msg(m);say(m,'Now tear it open!');
 setTimeout(()=>{if(!cur||cur.ph!=='won')return;phase('tear');$('#clue').textContent='Tear it open! Swipe across the top of the bag.';$('#play').scrollTo({top:0,behavior:'smooth'})},1600)}
function setTear(v){if(cur.ph!=='tear')return;const old=cur.tear;cur.tear=Math.min(1,v);if(Math.floor(cur.tear*5)>Math.floor(old*5))SFX.crinkle();$('#bb').style.setProperty('--tp',cur.tear);if(cur.tear>=.75)rip()}
function rip(){
 if(cur.ph!=='tear')return;drag=null;SFX.rip();
 const t=cur.t,k=cur.p.toy,prev=S.got[k],shiny=!!((prev&&prev.shiny)||cur.sh);S.got[k]={shiny};save();
 $('.toyout').innerHTML=wizard(t,shiny);$('#clue').textContent='';phase('ripped');
 setTimeout(()=>{SFX.fanfare();confetti(R[t.r].c);burst()},450);
 setTimeout(()=>{if(cur&&cur.ph==='ripped'){phase('done');prize(0)}},1300)}
function prize(isView){
 const t=cur.t;let sub='';
 if(isView)sub=S.got[cur.p.toy].shiny?'✦ Shiny ✦':'';
 else if(cur.p.bonus)sub=cur.sh?'It’s SHINY now!':'Cast one right on the first try to make it shiny. Try another bonus bag!';
 else if(cur.sh)sub='✦ SHINY ✦ You cast it all by yourself!';
 $('#prize').innerHTML=`<span class="rar" style="background:${R[t.r].c}">${R[t.r].n}</span><h2>${t.name}</h2><span class="pow">Power: ${t.pwn}</span>${sub?`<p class="sub">${sub}</p>`:''}<button class="cta" id="keep">${isView?'Back to shelf':'Put them on my shelf'}</button>`;
 $('#keep').onclick=close;
 if(!isView)say(gotLine(t,cur.sh))}
function gotLine(t,sh){return `You got ${t.name}!${t.r===4?' A Legendary wizard!':t.r>1?' An '+R[t.r].n+'!':''} Power: ${t.pwn}!${sh?' And they’re shiny!':''}`}
function burst(){const bw=$('#bw');if(!bw)return;for(let i=0;i<18;i++){const e=document.createElement('i'),a=i/18*Math.PI*2,r=110+Math.random()*60;e.className='bst';e.style.cssText=`--dx:${(Math.cos(a)*r).toFixed(0)}px;--dy:${(Math.sin(a)*r).toFixed(0)}px;animation-delay:${(Math.random()*.15).toFixed(2)}s;background:${['#fff','#ffd23f','#c4b5fd','#9be8ff'][i%4]}`;bw.appendChild(e);setTimeout(()=>e.remove(),1400)}}
function confetti(col){const box=document.createElement('div'),cs=['#a78bfa','#ffd23f','#2f7bff','#12a862','#ff4fa3','#5eead4',col];box.className='conf';
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)for(let i=0;i<80;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;background:${cs[i%cs.length]};animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;--x:${(Math.random()-.5)*200}px;--r:${Math.random()*720}deg;width:${6+Math.random()*6}px;height:${8+Math.random()*8}px`;box.appendChild(e)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3800)}

$('#snd1').textContent=sndLabel();$('#mus1').textContent=musLabel();document.addEventListener('visibilitychange',()=>Music.apply());$('#shelfbtn').onclick=()=>{Voice.stop();save();window.PP&&PP.exit()};
document.addEventListener('pointerdown',function un(){ac();Music.start();document.removeEventListener('pointerdown',un,true)},true);
shelf();

}
</script>
</body>
</html>
