<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hedwig's Christmas · Paloma's Pages</title>
<script src="../../pp-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2140; --night:#15123a; --cream:#fff7ea; --gold:#ffd25e; --red:#e0393e; --green:#2f9e5a; --sky:#7cc7ff;
  --display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:var(--body);user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(10,8,34,.85);border-bottom:1px solid rgba(255,255,255,.08);z-index:5}
.top h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0 auto 0 6px;color:var(--gold);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.icon{padding:6px 11px;font-size:18px}
#stage{flex:1;position:relative;min-height:0;background:#0d0b26;overflow:hidden}
#scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#scene svg.sc{width:100%;height:100%;display:block}
#scene.fade{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(#fff9ef,#fdeed6);color:var(--ink);border-top:4px solid var(--ink);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}
.lines{flex:1;min-width:0;max-height:30vh;overflow:auto;font-size:clamp(18px,2.6vw,25px);font-weight:800;line-height:1.35}
.ln{margin:2px 0;opacity:.45;transition:opacity .25s}
.ln.on{opacity:1}
.ln .who{display:inline-block;font-family:var(--display);font-weight:400;font-size:.8em;padding:1px 10px;border-radius:999px;margin-right:6px;color:#fff;vertical-align:2px}
.ln.hedwig .who{background:#3d86d6}.ln.santa .who{background:var(--red)}
.ln.hedwig .t,.ln.santa .t{font-style:italic}
.ctl{display:flex;gap:10px;align-items:center}
.round{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);font-size:24px;display:grid;place-items:center;transition:transform .08s}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.round.go{width:78px;height:78px;background:var(--gold);font-size:34px}
.round.go.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(255,210,94,.7)}50%{box-shadow:0 4px 0 var(--ink),0 0 0 14px rgba(255,210,94,0)}}
.round[disabled]{opacity:.3;pointer-events:none}
.hide{display:none!important}
/* choices */
.choices{position:absolute;left:0;right:0;bottom:0;padding:14px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,rgba(8,6,28,.75) 35%);z-index:3}
.card{width:min(40vw,270px);background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .4s cubic-bezier(.3,1.6,.5,1) backwards;transition:transform .1s}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.card svg{width:100%;height:auto;aspect-ratio:4/3;border-radius:14px;display:block}
.card b{font-family:var(--display);font-weight:400;font-size:clamp(17px,2.4vw,23px);text-align:center;line-height:1.1}
.choices.four .card{width:min(22vw,180px)}
@media (max-width:640px){.choices.four .card{width:44vw}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* title + maker */
.overlay{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.title-word{font-family:var(--display);font-size:clamp(44px,9vw,92px);color:var(--gold);line-height:.95;text-shadow:0 5px 0 #8a4e10,0 10px 30px rgba(0,0,0,.6);margin:0}
.title-sub{font-weight:900;font-size:clamp(17px,2.6vw,24px);text-shadow:0 2px 8px rgba(0,0,0,.8)}
.big{font-family:var(--display);font-size:clamp(22px,3.4vw,32px);border:4px solid var(--ink);border-radius:20px;padding:12px 28px;background:var(--gold);color:var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big.white{background:#fff}.big.green{background:#7fe0a0}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#maker{position:absolute;inset:0;z-index:4;display:grid;grid-template-columns:1fr 1fr;background:radial-gradient(90% 90% at 30% 40%,#3a2d78,#15123a 70%)}
#maker .preview{display:flex;align-items:center;justify-content:center;min-height:0}
#maker .preview svg{width:100%;height:100%;max-height:100%}
#maker .tools{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:16px;min-height:0;overflow:auto}
.tabs{display:flex;gap:10px;justify-content:center}
.tab{width:74px;height:74px;border-radius:20px;border:3px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);display:grid;place-items:center;padding:6px}
.tab svg{width:100%;height:100%}
.tab.on{border-color:var(--gold);background:rgba(255,210,94,.18);box-shadow:0 0 0 4px rgba(255,210,94,.25)}
.sw{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{width:86px;height:86px;border-radius:22px;border:4px solid var(--ink);background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.45);display:grid;place-items:center;padding:6px;transition:transform .1s}
.opt svg{width:100%;height:100%}
.opt.on{outline:5px solid var(--gold);outline-offset:3px;transform:scale(1.06)}
.opt:active{transform:scale(.94)}
.mk-q{font-family:var(--display);font-size:clamp(22px,3vw,30px);color:var(--gold);text-align:center;margin:0}
@media (max-width:700px){#maker{grid-template-columns:1fr;grid-template-rows:42% 58%}.opt{width:72px;height:72px}.tab{width:62px;height:62px}}
/* svg animation helpers */
svg .bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-4px) scale(1.01,.99)}}
svg .blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
svg .flapL{animation:flapL .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 0}
svg .flapR{animation:flapL .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 0}
@keyframes flapL{from{transform:rotate(18deg)}to{transform:rotate(-38deg)}}
svg .wave{animation:wave .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 0}
@keyframes wave{from{transform:rotate(10deg)}to{transform:rotate(-30deg)}}
svg .hop{animation:hop .7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
svg .float{animation:float 2.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
svg .wiggle{animation:wiggle 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
svg .tw{animation:tw 1.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
svg .flick{animation:flick .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.94,1.08)}}
svg .snow circle{animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-80px)}to{transform:translate(30px,720px)}}
svg .tear{animation:tear 2.2s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(46px);opacity:0}}
svg .drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
svg .zoomup{animation:zoomup 1.6s ease-in forwards}
@keyframes zoomup{0%{transform:translateY(0)}20%{transform:translateY(8px)}100%{transform:translateY(-560px)}}
svg .flyin{animation:flyin 1.2s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes flyin{from{transform:translate(-300px,200px)}}
svg .slide{animation:slide 2.4s ease-in infinite}
@keyframes slide{0%{transform:translate(-260px,-146px)}70%,100%{transform:translate(0,0)}}
svg .tip{animation:tip 2.4s ease-in-out infinite}
@keyframes tip{0%{transform:translate(-120px,-67px)}100%{transform:translate(0,0)}}
svg.sc *{pointer-events:none}
svg.sc .gift,svg.sc .gift *{pointer-events:auto}
svg .gift{cursor:pointer}
svg .gift.counted{animation:giftpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes giftpop{50%{transform:translateY(-22px)}}
svg .sparkle{animation:sparkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sparkle{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
svg .zz{animation:zz 2.6s ease-out infinite}
@keyframes zz{from{transform:translate(0,0);opacity:0}30%{opacity:1}to{transform:translate(30px,-60px);opacity:0}}
@media (prefers-reduced-motion:reduce){svg *{animation-duration:0s!important;animation-iteration-count:1!important}}
.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:900;z-index:9}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a5a"/><stop offset=".2" stop-color="#ff5a5a"/><stop offset=".2" stop-color="#ffa53a"/><stop offset=".4" stop-color="#ffa53a"/><stop offset=".4" stop-color="#ffe14d"/><stop offset=".6" stop-color="#ffe14d"/><stop offset=".6" stop-color="#4cd07a"/><stop offset=".8" stop-color="#4cd07a"/><stop offset=".8" stop-color="#4c9cf0"/><stop offset="1" stop-color="#4c9cf0"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#05031a" stop-opacity=".7"/></radialGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#cfe3ff" stop-opacity=".45"/><stop offset="1" stop-color="#cfe3ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f0c3a"/><stop offset=".6" stop-color="#2c2a7a"/><stop offset="1" stop-color="#5b4fa8"/></linearGradient>
    <linearGradient id="daysky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc8ff"/><stop offset="1" stop-color="#e7f6ff"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a1f"/><stop offset=".6" stop-color="#ffb22e"/><stop offset="1" stop-color="#fff3a0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
</svg>

<div id="app">
  <div class="top">
    <button class="pill" id="shelfBtn">◀ Shelf</button>
    <h1>Hedwig's Christmas</h1>
    <button class="pill" id="makeBtn" title="Change how Hedwig looks">🎨 Hedwig</button>
    <button class="pill icon" id="muteBtn" title="Narration on or off">🔊</button>
  </div>
  <div id="stage">
    <div id="scene"></div>
    <div id="choices" class="choices hide"></div>
    <div id="titleScr" class="overlay hide"></div>
    <div id="maker" class="hide"></div>
  </div>
  <div class="panel" id="panel">
    <button class="round" id="backBtn" title="Go back">◀</button>
    <div class="lines" id="lines"></div>
    <div class="ctl">
      <button class="round" id="againBtn" title="Read it to me again">🔊</button>
      <button class="round go" id="nextBtn" title="Next page">▶</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   Hedwig's Christmas — a narrated choose-your-way picture book (age 4).
   Runs inside the Paloma's Pages hub; saves with PP.save('hedwig', data).
   All art is drawn in code so Hedwig can be restyled by the reader.
   Narration: Fish Audio clips through the hub's pp-tts function, cached in
   Supabase storage; the device voice reads a line if a clip can't load.
   ===================================================================== */
const GAME_ID = 'hedwig';
const INK = '#2b2140';
const TTS = {
  base: 'https://sijefxwfidntfehskcgb.supabase.co/storage/v1/object/public/narration/glimmerfall/',
  live: 'https://sijefxwfidntfehskcgb.supabase.co/functions/v1/pp-tts',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpamVmeHdmaWRudGZlaHNrY2diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMDcwMTksImV4cCI6MjEwOTU4MzAxOX0.5myHP6IDmm4PmScJvbmpQqHB4T4XiGfdSQfJ47LTxBA',
};
// Who speaks with which recorded voice (same voices as The Glimmerfall):
// narrator = female storyteller, Hedwig = young boy, Santa = elderly man.
const VOICE = { n: 'narr', h: 'pebble', s: 'moss' };

/* ---------------- Save data ---------------- */
const DEFAULT = { look: { feather: 'brown', eye: 'yellow', hat: 'santa', scarf: 'red' }, made: false, endings: {}, gifts: {}, mute: false, done: 0 };
let S = load();
function load() { try { const v = window.PP && PP.load(GAME_ID); if (v && v.look) return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), v, { look: Object.assign({}, DEFAULT.look, v.look) }); } catch (e) { } return JSON.parse(JSON.stringify(DEFAULT)); }
function save() { try { if (window.PP) PP.save(GAME_ID, S); } catch (e) { } }

/* ---------------- Hedwig's looks ---------------- */
const FEATHERS = {
  brown: { n: 'Brown feathers!', body: '#8a5a3c', wing: '#6b4229', belly: '#ecd5b0', face: '#dcb789' },
  white: { n: 'Snowy white feathers!', body: '#eef1f8', wing: '#c9d1e3', belly: '#ffffff', face: '#ffffff', specks: '#8f98b0' },
  gray: { n: 'Gray feathers!', body: '#8d93a6', wing: '#6a7086', belly: '#e3e6ee', face: '#c6cad8' },
  pink: { n: 'Pink feathers!', body: '#f094bb', wing: '#d06f9a', belly: '#ffe3ef', face: '#ffc6dc' },
  blue: { n: 'Blue feathers!', body: '#5f9fe6', wing: '#3f7cc4', belly: '#dbeeff', face: '#b5d5fa' },
  gold: { n: 'Golden feathers!', body: '#e3ab3c', wing: '#bd8424', belly: '#fff1c6', face: '#f5d688' },
  purple: { n: 'Purple feathers!', body: '#9a72d8', wing: '#7652b6', belly: '#ece2ff', face: '#cdb8f4' },
};
const EYES = {
  yellow: { n: 'Yellow eyes!', c: '#ffc928' }, orange: { n: 'Orange eyes!', c: '#ff8a2a' }, green: { n: 'Green eyes!', c: '#3fc067' },
  blue: { n: 'Blue eyes!', c: '#3d9cf0' }, purple: { n: 'Purple eyes!', c: '#9b6cf0' }, brown: { n: 'Brown eyes!', c: '#8a5a2c' },
};
const HATS = { none: { n: 'No hat!' }, santa: { n: 'A Santa hat!' }, earmuffs: { n: 'Fuzzy earmuffs!' }, bow: { n: 'A pretty bow!' }, crown: { n: 'A golden crown!' }, beanie: { n: 'A cozy winter hat!' } };
const SCARVES = { none: { n: 'No scarf!' }, red: { n: 'A red scarf!', c: '#e0393e' }, green: { n: 'A green scarf!', c: '#2f9e5a' }, pink: { n: 'A pink scarf!', c: '#ff7fb5' }, rainbow: { n: 'A rainbow scarf!', c: 'url(#rainbow)' } };

/* ---------------- Drawing: Hedwig ----------------
   owl(look, {mood:'happy'|'sad'|'wow'|'sleep', flap, look:-1|0|1, noBob})
   Drawn around (0,0); about 200 units tall. */
function hat(kind) {
  const st = `stroke="${INK}" stroke-width="4" stroke-linejoin="round"`;
  if (kind === 'santa') return `<g transform="translate(4,-88) rotate(10)"><path d="M-50,8 C-40,-40 0,-86 52,-58 C40,-48 34,-30 44,6Z" fill="#d8323c" ${st}/><rect x="-56" y="-4" width="106" height="24" rx="12" fill="#fff" ${st}/><circle cx="54" cy="-58" r="14" fill="#fff" ${st}/></g>`;
  if (kind === 'earmuffs') return `<g><path d="M-76,-38 Q0,-150 76,-38" fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round"/><path d="M-76,-38 Q0,-150 76,-38" fill="none" stroke="#7c5cd6" stroke-width="6" stroke-linecap="round"/>${[-1, 1].map(s => `<circle cx="${s * 80}" cy="-34" r="23" fill="#ff8fc0" ${st}/><circle cx="${s * 80 - s * 6}" cy="-42" r="7" fill="#fff" opacity=".6"/>`).join('')}</g>`;
  if (kind === 'bow') return `<g transform="translate(46,-92) rotate(14)"><path d="M0,0 L-34,-22 L-36,20Z" fill="#ff5c9a" ${st}/><path d="M0,0 L34,-22 L36,20Z" fill="#ff5c9a" ${st}/><circle r="10" fill="#ff8fc0" ${st}/></g>`;
  if (kind === 'crown') return `<g transform="translate(0,-92)"><path d="M-40,8 L-44,-34 L-20,-12 L0,-44 L20,-12 L44,-34 L40,8Z" fill="#ffd23f" ${st}/><circle cx="0" cy="-8" r="7" fill="#e0393e" stroke="${INK}" stroke-width="2.5"/><circle cx="-24" cy="-2" r="5" fill="#3d9cf0" stroke="${INK}" stroke-width="2.5"/><circle cx="24" cy="-2" r="5" fill="#3fc067" stroke="${INK}" stroke-width="2.5"/></g>`;
  if (kind === 'beanie') return `<g transform="translate(0,-84)"><path d="M-62,10 C-62,-58 62,-58 62,10Z" fill="#3d9cf0" ${st}/><path d="M-40,-30 L-40,8 M-14,-42 L-14,8 M14,-42 L14,8 M40,-30 L40,8" stroke="#2c74c0" stroke-width="5"/><rect x="-66" y="0" width="132" height="22" rx="11" fill="#fff" ${st}/><circle cx="0" cy="-48" r="16" fill="#fff" ${st}/></g>`;
  return '';
}
function scarf(kind) {
  const sc = SCARVES[kind]; if (!sc || !sc.c) return '';
  const st = `stroke="${INK}" stroke-width="4" stroke-linejoin="round"`;
  return `<g><path d="M30,24 L52,84 L30,92 L14,30Z" fill="${sc.c}" ${st}/><path d="M34,90 l-3,12 M42,87 l-1,12 M50,84 l2,11" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M-80,-2 Q0,32 80,-2 L78,20 Q0,56 -78,20Z" fill="${sc.c}" ${st}/></g>`;
}
function owl(L, o = {}) {
  const F = FEATHERS[L.feather] || FEATHERS.brown, E = (EYES[L.eye] || EYES.yellow).c, mood = o.mood || 'happy';
  const st = `stroke="${INK}" stroke-width="4" stroke-linejoin="round"`;
  const lk = (o.look || 0) * 6;
  const eye = x => {
    if (mood === 'sleep') return `<path d="M${x - 17},-30 Q${x},-18 ${x + 17},-30" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
    const wow = mood === 'wow', sad = mood === 'sad', R = wow ? 28 : 24, ir = wow ? 13 : 16, pr = wow ? 5 : 8.5, dy = sad ? 6 : 0;
    return `<g class="blink"><circle cx="${x}" cy="-32" r="${R}" fill="#fff" ${st}/><circle cx="${x + lk}" cy="${-32 + dy}" r="${ir}" fill="${E}"/><circle cx="${x + lk}" cy="${-32 + dy}" r="${pr}" fill="${INK}"/><circle cx="${x + lk + 5}" cy="${-38 + dy}" r="4.5" fill="#fff"/></g>`;
  };
  const marks = [[20, [-24, 0, 24]], [44, [-36, -12, 12, 36]], [68, [-24, 0, 24]]].map(([y, xs]) => xs.map(x => `<path d="M${x - 7},${y} q7,8 14,0" fill="none" stroke="${F.wing}" stroke-width="3" stroke-linecap="round" opacity=".6"/>`).join('')).join('');
  const specks = F.specks ? [[-50, -70], [40, -78], [-66, 20], [62, 30], [-40, 80], [50, 74], [0, -84]].map(([x, y]) => `<path d="M${x - 5},${y} q5,5 10,0" fill="none" stroke="${F.specks}" stroke-width="3" stroke-linecap="round"/>`).join('') : '';
  const wing = `<path d="M-70,-26 C-114,6 -110,66 -64,92 C-58,60 -56,10 -70,-26Z" fill="${F.wing}" ${st}/><path d="M-84,30 q10,4 16,-2 M-86,52 q10,4 18,-2" fill="none" stroke="${INK}" stroke-width="2.5" opacity=".35"/>`;

    eye: { q: "Pick Hedwig's eyes.", opts: EYES },
    hat: { q: 'Does Hedwig want a hat?', opts: HATS },
    scarf: { q: 'How about a scarf?', opts: SCARVES },
  },
  done: [['n', 'Hooray! Hedwig looks wonderful!']],
};

/* =================== Sound effects =================== */
let AC = null;
function ac() {
  if (!AC) { try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { } try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
const Sfx = (() => {
  function tone(f, d = .15, type = 'sine', g = .12, when = 0, slide) {
    const a = ac(); if (!a) return; const t = a.currentTime + when;
    const o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + .01); v.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(v).connect(a.destination); o.start(t); o.stop(t + d + .05);
  }
  function noise(d = .4, g = .12, f1 = 400, f2 = 3000) {
    const a = ac(); if (!a) return; const b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / ch.length);
    const s = a.createBufferSource(); s.buffer = b; const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f1, a.currentTime); f.frequency.exponentialRampToValueAtTime(f2, a.currentTime + d);
    const v = a.createGain(); v.gain.value = g; s.connect(f).connect(v).connect(a.destination); s.start();
  }
  return {
    tap: () => tone(700, .07, 'triangle', .06),
    page: () => noise(.25, .05, 1500, 3000),
    jingle: () => { for (let i = 0; i < 8; i++) { tone(2093 + (i % 2) * 300, .25, 'sine', .05, i * .09); tone(3136, .12, 'triangle', .02, i * .09 + .02); } },
    whoosh: () => noise(.9, .25, 200, 4000),
    whee: () => tone(500, .7, 'triangle', .08, 0, 1400),
    flap: () => { for (let i = 0; i < 4; i++) setTimeout(() => noise(.12, .12, 300, 900), i * 140); },
    sparkle: () => { [1318, 1568, 2093, 2637].forEach((f, i) => tone(f, .4, 'sine', .06, i * .07)); },
    count: n => { tone(523 * Math.pow(1.26, n), .25, 'triangle', .1); },
    yay: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, .3, 'triangle', .09, i * .09)); },
  };
})();

/* =================== Narration =================== */
const Voice = (() => {
  const syn = window.speechSynthesis; let best = null, deep = null;
  function pick() {
    if (!syn) return; const vs = syn.getVoices().filter(v => /^en/i.test(v.lang));
    best = [/Samantha/i, /Ava/i, /Allison/i, /Natural/i, /Google US English/i, /Karen|Moira|Tessa/i].map(re => vs.find(v => re.test(v.name))).find(Boolean) || vs[0] || null;
    deep = vs.find(v => /Daniel|Fred|Alex|Guy|David|Arthur|Male/i.test(v.name)) || best;
  }
  if (syn) { pick(); syn.onvoiceschanged = pick; }
  const clean = t => t.replace(/…/g, '... ').replace(/—/g, ', ').replace(/\s+/g, ' ').trim();
  function fnv(str) { let x = 0x811c9dc5; for (const b of new TextEncoder().encode(str)) { x ^= b; x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16).padStart(8, '0'); }
  const raw = new Map(); let liveDown = 0;
  // Get the clip's bytes: stored copy first, otherwise ask pp-tts to record it once.
  function bytes(who, text) {
    const v = VOICE[who] || 'narr', t = clean(text), k = v + '|' + t;
    if (!raw.has(k)) {
      const p = fetch(TTS.base + fnv(k) + '.mp3').then(r => { if (r.ok) return r.arrayBuffer(); throw new Error('none'); })
        .catch(() => {
          if (Date.now() < liveDown) throw new Error('live down');
          const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 20000);
          return fetch(TTS.live, { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json', apikey: TTS.key, Authorization: 'Bearer ' + TTS.key }, body: JSON.stringify({ voice: v, text: t }) })
            .then(r => r.ok ? r.json() : Promise.reject(new Error('live ' + r.status))).then(j => fetch(j.url)).then(r => { if (!r.ok) throw new Error('clip'); return r.arrayBuffer(); })
            .finally(() => clearTimeout(to)).catch(e => { liveDown = Date.now() + 45000; throw e; });
        })
        .catch(e => { raw.delete(k); throw e; });
      raw.set(k, p);
    }
    return raw.get(k);
  }
  let src = null, gen = 0;
  function stop() { gen++; if (src) { try { src.onended = null; src.stop(); } catch (e) { } src = null; } if (syn) syn.cancel(); }
  function robot(who, t, fin) {
    if (!syn) return setTimeout(fin, 600 + t.length * 55);
    try {
      const u = new SpeechSynthesisUtterance(t); u.voice = who === 's' ? deep : best;
      u.pitch = who === 'h' ? 1.6 : who === 's' ? .75 : 1.05; u.rate = who === 's' ? .85 : .9;
      let done = false; const f = () => { if (!done) { done = true; fin(); } };
      u.onend = f; u.onerror = f; syn.speak(u); setTimeout(f, 1500 + t.length * 110);
    } catch (e) { fin(); }
  }
  function one(who, text, my) {
    return new Promise(res => {
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      if (S.mute) return setTimeout(fin, 350);
      const t = clean(text);
      bytes(who, t).then(ab => new Promise((ok, no) => { const a = ac(); if (!a) return no(); a.decodeAudioData(ab.slice(0), ok, no); }))
        .then(buf => {
          if (my !== gen) return fin();
          const a = ac(), s = a.createBufferSource(); s.buffer = buf; s.connect(a.destination);
          s.onended = () => { if (src === s) src = null; fin(); }; src = s; s.start();
          setTimeout(fin, buf.duration * 1000 + 1500);
        })
        .catch(() => { if (my === gen) robot(who, t, fin); else fin(); });
    });
  }
  // play([[who,text],...], onLine(i)) — resolves true when all lines finished, false if interrupted
  async function play(lines, onLine) {
    stop(); const my = gen;
    for (let i = 0; i < lines.length; i++) {
      if (my !== gen) return false;
      onLine && onLine(i);
      await one(lines[i][0], lines[i][1], my);
      if (my !== gen) return false;
      await new Promise(r => setTimeout(r, 260));
    }
    return my === gen;
  }
  const warm = lines => lines.forEach(([w, t]) => bytes(w, t).catch(() => { }));
  return { play, stop, warm, clean, fnv };
})();

/* =================== App =================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let cur = null, hist = [];
const linesOf = p => typeof p.lines === 'function' ? p.lines() : p.lines;
const WHO = { h: ['hedwig', 'Hedwig'], s: ['santa', 'Santa'] };

function showLines(lines) {
  $('#lines').innerHTML = lines.map(([w, t], i) => `<div class="ln ${(WHO[w] || [''])[0]}" data-i="${i}">${WHO[w] ? `<span class="who">${WHO[w][1]}</span>` : ''}<span class="t">${esc(t)}</span></div>`).join('');
}
function hilite(i) { document.querySelectorAll('.ln').forEach(e => e.classList.toggle('on', +e.dataset.i === i)); const e = document.querySelector(`.ln[data-i="${i}"]`); if (e) e.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
function allOn() { document.querySelectorAll('.ln').forEach(e => e.classList.add('on')); }
// Landscape: fill the screen. Tall screens (iPad held upright, phones): show the whole picture.
function fit() { const st = $('#stage'), r = st.clientWidth / Math.max(1, st.clientHeight); document.querySelectorAll('#scene svg.sc').forEach(v => v.setAttribute('preserveAspectRatio', r < 1.45 ? 'xMidYMid meet' : 'xMidYMid slice')); }
window.addEventListener('resize', fit);
function draw(p) { const sc = $('#scene'); sc.classList.remove('fade'); void sc.offsetWidth; sc.innerHTML = p.scene(); fit(); sc.classList.add('fade'); }

function go(id, push = true) {
  const p = PAGES[id]; if (!p) return;
  if (push && cur) hist.push(cur);
  cur = id; S.page = id; save();
  $('#titleScr').classList.add('hide'); $('#maker').classList.add('hide'); $('#panel').classList.remove('hide');
  $('#choices').classList.add('hide'); $('#choices').innerHTML = '';
  if (id === 'santa') { COUNT.done = {}; COUNT.n = 0; }
  if (p.enter) p.enter();
  draw(p);
  Sfx.page(); if (p.sfx) setTimeout(() => Sfx[p.sfx](), 250);
  $('#backBtn').disabled = !hist.length;
  const next = $('#nextBtn'); next.classList.remove('pulse');
  const lines = linesOf(p).slice();
  if (p.choices) lines.push(...p.choices.ask);
  showLines(lines);
  next.classList.toggle('hide', !!p.choices || !!p.end);
  next.disabled = !!p.count;
  CH.shown = false; clearTimeout(CH.t);
  if (p.choices) CH.t = setTimeout(() => showChoicesOnce(), S.mute ? 300 : 25000);
  if (p.end) showEnd();
  if (p.count) bindCount();
  // warm the next pages' clips while this one plays
  const ahead = [];
  if (p.next) ahead.push(p.next); if (p.choices) p.choices.opts.forEach(o => ahead.push(o[2]));
  ahead.forEach(n => { const q = PAGES[n]; if (q && typeof q.lines !== 'function') Voice.warm(q.lines.concat(q.choices ? q.choices.ask : [])); });
  if (p.count) Voice.warm(NUMS.map(t => ['n', t]).concat(COUNT_DONE));
  read();
}
async function read() {
  const p = PAGES[cur]; if (!p) return;
  const lines = linesOf(p).slice(); if (p.choices) lines.push(...p.choices.ask);
  if (cur === 'santa' && COUNT.n >= 4) lines.push(...COUNT_DONE);
  const base = linesOf(p).length;
  const fin = await Voice.play(lines, i => { hilite(i); if (p.choices && i >= base) showChoicesOnce(); });
  if (p.choices) showChoicesOnce();
  if (fin) { allOn(); if (!p.choices && !p.end && !$('#nextBtn').disabled) $('#nextBtn').classList.add('pulse'); }
}
const CH = { shown: false, t: 0 };
function showChoicesOnce() { const p = PAGES[cur]; if (!p || !p.choices || CH.shown) return; CH.shown = true; clearTimeout(CH.t); showChoices(p.choices); }
function showChoices(c) {
  const box = $('#choices'); box.className = 'choices' + (c.four ? ' four' : '');
  box.innerHTML = c.opts.map(([icon, label], i) => `<button class="card" data-i="${i}" style="animation-delay:${.15 + i * .12}s">${CARDS[icon]()}<b>${esc(label)}</b></button>`).join('');
  box.querySelectorAll('.card').forEach(b => b.onclick = () => {
    const o = c.opts[+b.dataset.i]; Sfx.yay();
    if (o[3]) { S.gift = o[3]; S.gifts[o[3]] = 1; save(); }
    go(o[2]);
  });
}
function bindCount() {
  const svg = $('#scene svg');
  svg.addEventListener('click', e => {
    const g = e.target.closest('.gift'); if (!g) return;
    const i = +g.dataset.i; if (COUNT.done[i]) return;
    COUNT.n++; COUNT.done[i] = COUNT.n; Sfx.count(COUNT.n);
    // redraw with the number badge, keep the tap feel
    const sc = $('#scene'); sc.innerHTML = PAGES.santa.scene(); fit(); bindCount();
    const ng = sc.querySelector(`.gift[data-i="${i}"] .gb`); if (ng) ng.classList.add('counted');
    if (COUNT.n >= 4) {
      Sfx.yay(); showLines(linesOf(PAGES.santa).concat([['n', NUMS[3]]], COUNT_DONE));
      $('#nextBtn').disabled = false;
      Voice.play([['n', NUMS[3]]].concat(COUNT_DONE), j => hilite(linesOf(PAGES.santa).length + j)).then(f => { if (f) { allOn(); $('#nextBtn').classList.add('pulse'); } });
    } else Voice.play([['n', NUMS[COUNT.n - 1]]]);
  });
}
function showEnd() {
  const box = $('#choices'); box.className = 'choices';
  box.innerHTML = `<div class="row" style="align-items:center"><button class="big" id="againRead">↻ Read again</button><button class="big white" id="endMake">🎨 Change Hedwig</button><button class="big green" id="endShelf">📚 Back to shelf</button></div>`;
  $('#againRead').onclick = () => { Sfx.tap(); hist = []; cur = null; go('home', false); };
  $('#endMake').onclick = () => { Sfx.tap(); openMaker(() => title()); };
  $('#endShelf').onclick = () => { Voice.stop(); window.PP && PP.exit(); };
}

/* ---------- Title screen ---------- */
function title() {
  Voice.stop(); cur = null; hist = [];
  $('#maker').classList.add('hide'); $('#choices').classList.add('hide'); $('#panel').classList.add('hide');
  $('#scene').innerHTML = living({ gifts: 4, extra: put(500, 470, 1.05, owl(L(), { mood: 'happy', wave: true })) }); fit();
  const name = (window.PP && PP.reader && PP.reader()) || '';
  const t = $('#titleScr'); t.classList.remove('hide');
  const resume = S.page && PAGES[S.page] && S.page !== 'home' && S.page !== 'end';
  t.style.justifyContent = 'flex-start'; t.style.paddingTop = '4vh';
  t.innerHTML = `<p class="title-sub">${name ? 'Hi, ' + esc(name) + '! ' : ''}A choose-your-way Christmas story</p>
    <h2 class="title-word">Hedwig's<br>Christmas</h2>
    <div class="row" style="margin-top:auto;margin-bottom:2vh">
      <button class="big" id="startBtn">▶ ${resume ? 'Keep reading' : 'Read to me'}</button>
      ${resume ? '<button class="big white" id="restartBtn">↻ Start over</button>' : ''}
      <button class="big white" id="tMake">🎨 ${S.made ? 'Change' : 'Make'} Hedwig</button>
    </div>`;
  $('#startBtn').onclick = () => { ac(); Sfx.tap(); if (!S.made) openMaker(() => go('home', false)); else go(resume ? S.page : 'home', false); };
  if (resume) $('#restartBtn').onclick = () => { ac(); Sfx.tap(); go('home', false); };
  $('#tMake').onclick = () => { ac(); Sfx.tap(); openMaker(() => title()); };
}

/* ---------- Make Hedwig ---------- */
const TAB_ICONS = {
  feather: () => `<svg viewBox="-60 -60 120 120">${feather(FEATHERS[L().feather].body)}</svg>`,
  eye: () => `<svg viewBox="-60 -60 120 120"><circle r="44" fill="#fff" stroke="${INK}" stroke-width="5"/><circle r="26" fill="${EYES[L().eye].c}"/><circle r="13" fill="${INK}"/><circle cx="9" cy="-10" r="7" fill="#fff"/></svg>`,
  hat: () => `<svg viewBox="-80 -150 160 150">${hat(L().hat === 'none' ? 'santa' : L().hat)}</svg>`,
  scarf: () => `<svg viewBox="-90 -20 180 120">${scarf(L().scarf === 'none' ? 'red' : L().scarf)}</svg>`,
};
function optIcon(cat, k) {
  if (cat === 'feather') { const F = FEATHERS[k]; return `<svg viewBox="-100 -130 200 240">${owl({ feather: k, eye: 'yellow', hat: 'none', scarf: 'none' }, { noBob: true })}</svg>`; }
  if (cat === 'eye') return `<svg viewBox="-60 -60 120 120"><circle r="46" fill="#fff" stroke="${INK}" stroke-width="5"/><circle r="28" fill="${EYES[k].c}"/><circle r="14" fill="${INK}"/><circle cx="10" cy="-11" r="7" fill="#fff"/></svg>`;
  if (cat === 'hat') return k === 'none' ? `<svg viewBox="-60 -60 120 120"><circle r="40" fill="none" stroke="#c33" stroke-width="10"/><path d="M-28,28 L28,-28" stroke="#c33" stroke-width="10"/></svg>` : `<svg viewBox="-85 -150 170 160">${hat(k)}</svg>`;
  if (cat === 'scarf') return k === 'none' ? `<svg viewBox="-60 -60 120 120"><circle r="40" fill="none" stroke="#c33" stroke-width="10"/><path d="M-28,28 L28,-28" stroke="#c33" stroke-width="10"/></svg>` : `<svg viewBox="-90 -20 180 120">${scarf(k)}</svg>`;
}
let makerDone = null, makerCat = 'feather';
function openMaker(after) {
  Voice.stop(); makerDone = after; makerCat = 'feather';
  $('#titleScr').classList.add('hide'); $('#choices').classList.add('hide'); $('#panel').classList.add('hide');
  $('#scene').innerHTML = '';
  const m = $('#maker'); m.classList.remove('hide');
  renderMaker();
  Voice.play(MAKER.intro.concat([['n', MAKER.cats.feather.q]]));
  Object.values(MAKER.cats).forEach(c => Voice.warm([['n', c.q]].concat(Object.values(c.opts).map(o => ['n', o.n]))));
  Voice.warm(MAKER.done);
}
function renderMaker() {
  const m = $('#maker'), c = MAKER.cats[makerCat];
  m.innerHTML = `<div class="preview"><svg viewBox="-150 -160 300 300">${put(0, 0, 1.15, owl(L(), { mood: 'happy', wave: true }))}</svg></div>
    <div class="tools">
      <div class="tabs">${Object.keys(MAKER.cats).map(k => `<button class="tab${k === makerCat ? ' on' : ''}" data-k="${k}" title="${k}">${TAB_ICONS[k]()}</button>`).join('')}</div>
      <p class="mk-q">${esc(c.q)}</p>
      <div class="sw">${Object.keys(c.opts).map(k => `<button class="opt${L()[makerCat] === k ? ' on' : ''}" data-k="${k}" title="${esc(c.opts[k].n)}">${optIcon(makerCat, k)}</button>`).join('')}</div>
      <div class="row"><button class="big green" id="mkDone">✓ All done!</button></div>
    </div>`;
  m.querySelectorAll('.tab').forEach(b => b.onclick = () => { Sfx.tap(); makerCat = b.dataset.k; renderMaker(); Voice.play([['n', MAKER.cats[makerCat].q]]); });
  m.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    S.look[makerCat] = b.dataset.k; save(); Sfx.sparkle(); renderMaker();
    Voice.play([['n', c.opts[b.dataset.k].n]]);
  });
  $('#mkDone').onclick = () => {
    S.made = true; save(); Sfx.yay(); const after = makerDone;
    Voice.play(MAKER.done).then(() => { });
    setTimeout(() => after && after(), 1800);
  };
}

/* ---------- Buttons ---------- */
$('#nextBtn').onclick = () => { ac(); Sfx.tap(); const p = PAGES[cur]; if (p && p.next) go(p.next); else if (cur === 'santa') go('empty'); };
PAGES.santa.next = 'empty';
$('#backBtn').onclick = () => { if (!hist.length) return; Sfx.tap(); go(hist.pop(), false); };
$('#againBtn').onclick = () => { ac(); Sfx.tap(); if (cur) read(); };
$('#shelfBtn').onclick = () => { Voice.stop(); save(); window.PP && PP.exit(); };
$('#makeBtn').onclick = () => { ac(); Sfx.tap(); const back = cur; openMaker(() => back ? go(back, false) : title()); };
function setMute() { $('#muteBtn').textContent = S.mute ? '🔇' : '🔊'; }
$('#muteBtn').onclick = () => { S.mute = !S.mute; save(); setMute(); if (S.mute) Voice.stop(); };
setMute();
title();
</script>
</body>
