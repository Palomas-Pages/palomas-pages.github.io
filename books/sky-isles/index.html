<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paloma of the Sky Isles · Paloma's Pages</title>
<script src="../../pp-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lilita+One&family=Nunito:wght@400;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: twilight sky over the floating isles. Single theme by choice. */
  --night:#17143a;
  --dusk:#2a2563;
  --mist:#f3efff;
  --star:#ffd76a;
  --coral:#ff7d8c;
  --teal:#3ccbbd;
  --ink:#1d1a2b;
  --muted:#b7b0e0;
  --display:"Lilita One","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --letter:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --sfx:"Bangers","Impact",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#2f2a72 0%,var(--night) 60%) fixed;background-color:var(--night);color:var(--mist);font-family:var(--body);font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--star);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.5px;text-wrap:balance;margin:0}
.wrap{max-width:660px;margin:0 auto;padding:16px 16px 64px}
.shelfback{margin:2px 0 4px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(23,20,58,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .in{max-width:660px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.back{background:none;border:2px solid rgba(255,255,255,.25);color:var(--mist);border-radius:999px;padding:4px 14px;font-weight:700}
.shardcount{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:800;color:var(--star)}
.shardcount svg{width:22px;height:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:12px 20px;font-family:var(--display);font-size:20px;color:var(--ink);background:var(--star);box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.alt{background:var(--mist)}
.btn.teal{background:var(--teal)}
.row{display:flex;flex-wrap:wrap;gap:12px}

/* ---------- Library ---------- */
.libhead{text-align:center;padding:26px 0 8px}
.libhead h1{font-size:clamp(40px,10vw,64px);color:var(--star);text-shadow:0 4px 0 #8a5a12,0 8px 24px rgba(0,0,0,.4)}
.libhead p{margin:4px 0 0;color:var(--muted)}
.book{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:18px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;margin-top:18px}
@media (max-width:520px){.book{grid-template-columns:1fr}}
.cover{position:relative;aspect-ratio:3/4;border:4px solid var(--ink);border-radius:8px 14px 14px 8px;overflow:hidden;box-shadow:-6px 0 0 #0e0b2a inset,0 10px 30px rgba(0,0,0,.45);background:#24215c}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.cover .ct{position:absolute;left:0;right:0;top:6%;text-align:center;font-family:var(--display);color:#fff;text-shadow:0 3px 0 var(--ink);font-size:clamp(20px,6.5vw,28px);line-height:1}
.cover .ct small{display:block;font-size:.55em;color:var(--star);margin-top:4px}
.cover .cb{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-family:var(--display);color:var(--ink);font-size:14px}
.cover .cb span{background:var(--star);border:2px solid var(--ink);border-radius:999px;padding:2px 10px}
.bookinfo h2{font-size:28px;color:#fff}
.bookinfo .sub{color:var(--star);font-family:var(--display);font-size:18px}
.bookinfo p{margin:8px 0 14px;color:var(--muted)}
.meter{display:flex;gap:6px;margin:6px 0 14px}
.meter svg{width:28px;height:28px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;color:var(--mist);text-align:left;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--display);font-weight:400;font-size:19px;color:#fff}
.tile span{font-size:14px;color:var(--muted)}
.tile:hover{border-color:var(--star)}
.locked{opacity:.55}
.grownup{display:block;margin:26px auto 0;background:none;border:none;color:var(--muted);text-decoration:underline}

/* ---------- Creator ---------- */
.creator{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:18px;margin-top:12px}
@media (max-width:540px){.creator{grid-template-columns:1fr}}
.preview{background:linear-gradient(#7cc4f0,#e7f6ff);border:4px solid var(--ink);border-radius:18px;aspect-ratio:3/4;position:relative;overflow:hidden}
.preview svg{position:absolute;inset:0;width:100%;height:100%}
.opt h3{font-size:18px;color:#fff;margin:10px 0 6px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.25)}
.sw button[aria-pressed="true"]{border-color:var(--star);box-shadow:0 0 0 3px var(--star)}
.sw.txt button{width:auto;height:auto;border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.08);color:var(--mist);font-weight:700}

/* ---------- Map ---------- */
.mapwrap{position:relative;margin-top:8px}
.isles{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.isle{display:flex;align-items:center;gap:12px;width:min(100%,420px);background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:10px 14px;color:var(--mist);text-align:left}
.isle:nth-child(odd){align-self:flex-start}
.isle:nth-child(even){align-self:flex-end}
.isle .ico{width:62px;height:48px;flex:none}
.isle .num{font-family:var(--display);color:var(--star);font-size:14px}
.isle .ttl{font-family:var(--display);font-size:20px;color:#fff;line-height:1.1}
.isle .st{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.isle .st svg{width:26px;height:26px}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);display:block}
.dots i.on{background:var(--teal)}
.isle[disabled]{opacity:.42;cursor:not-allowed}
.isle:not([disabled]):hover{border-color:var(--star)}

/* ---------- Comic ---------- */
.chhead{text-align:center;margin:14px 0 18px}
.chhead .k{font-family:var(--display);color:var(--star);font-size:16px}
.chhead h2{font-size:clamp(30px,8vw,44px);color:#fff;text-shadow:0 3px 0 var(--ink)}
.strip{display:flex;flex-direction:column;gap:14px}
.panel{position:relative;margin:0;aspect-ratio:4/3;container-type:inline-size;border:3px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 0 0 3px #fff,0 10px 26px rgba(0,0,0,.35)}
.panel svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Lighting + gentle motion (Nov 2026). One light layer per panel so characters sit in the same air as the sky. */
.panel .lt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px rgba(20,10,40,.28)}
.lt-dawn{background:linear-gradient(160deg,rgba(255,190,150,.28),rgba(255,230,190,0) 55%);mix-blend-mode:soft-light}
.lt-sky,.lt-yard,.lt-spire,.lt-peak,.lt-wall{background:radial-gradient(110% 90% at 85% 0%,rgba(255,246,210,.32),rgba(255,246,210,0) 60%);mix-blend-mode:screen}
.lt-roomAM,.lt-class,.lt-hall{background:radial-gradient(80% 70% at 70% 15%,rgba(255,226,170,.28),rgba(90,50,30,.16) 90%)}
.lt-dusk{background:linear-gradient(180deg,rgba(70,50,140,.22),rgba(255,150,100,.18) 75%);mix-blend-mode:multiply}
.lt-storm,.lt-stormlite,.lt-fog{background:radial-gradient(90% 80% at 50% 0%,rgba(190,200,255,.12),rgba(20,25,60,.30) 85%);mix-blend-mode:multiply}
.lt-star{background:radial-gradient(70% 60% at 50% 60%,rgba(255,215,106,.18),rgba(255,215,106,0) 70%);mix-blend-mode:screen}
.panel .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:pbr 3.8s ease-in-out infinite}
@keyframes pbr{50%{transform:scaleY(1.014)}}
.panel .hover,.panel .float{animation:pfl 3.2s ease-in-out infinite}
@keyframes pfl{50%{transform:translateY(-4px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:pbl 5.2s infinite}
@keyframes pbl{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
.panel .drift{animation:pdr 22s ease-in-out infinite alternate}
@keyframes pdr{to{transform:translateX(16px)}}
.panel .tw{animation:ptw 3.4s ease-in-out infinite}
@keyframes ptw{50%{opacity:.15}}
.ln{stroke:#1d1a2b;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.bub{position:absolute;font-family:var(--letter);font-size:clamp(12px,4.4cqw,22px);line-height:1.12;padding:.4em .7em .45em;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:1.1em;z-index:2}
.bub::after{content:"";position:absolute;width:12px;height:12px;background:inherit;border:inherit;border-top:none;border-left:none;bottom:-8px;left:18%;transform:rotate(45deg)}
.bub.tb::after{left:calc(50% - 6px)}
.bub.tr::after{left:auto;right:18%}
.bub.tn::after{display:none}
.bub.shout{font-weight:700;border-width:3px;border-radius:.5em;font-size:clamp(13px,4.8cqw,24px)}
.bub.think{border-style:dashed;border-radius:2em}
.bub.think::after{border-radius:50%;border-style:dashed;border:2px dashed var(--ink);transform:none;bottom:-14px;width:10px;height:10px}
.bub.grum{background:#4b3d70;color:#fff;border-color:#20183a;border-radius:.7em}
.bub.glory{background:#fff3c2;color:#5c3a00;border-color:#d39b00}
.bub.star{background:#202a74;color:#fff;border-color:var(--star);box-shadow:0 0 14px rgba(255,215,106,.6)}
.bub .who{display:block;font-family:var(--display);font-size:.62em;letter-spacing:1px;opacity:.85;margin-bottom:1px}
.bub.cap{background:#ffe9a6;border-radius:4px;font-family:var(--body);font-size:clamp(11px,3.7cqw,19px);font-weight:700;line-height:1.25}
.bub.note{background:#fbf2dc;border-radius:6px;border-width:3px;font-size:clamp(12px,4.2cqw,21px);line-height:1.25}
.bub.note b{font-family:var(--display);font-weight:400;font-size:1.15em}
.bub.note i{color:#4b3d70}

/* ---------- Choice ---------- */
.choice{margin-top:22px;background:linear-gradient(#2c2770,#211c57);border:3px solid var(--star);border-radius:20px;padding:18px}
.choice h3{color:var(--star);font-size:22px}
.choice .q{font-size:19px;margin:6px 0 14px;color:#fff;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt-b{text-align:left;background:var(--mist);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px 16px;font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--ink);display:flex;gap:10px;align-items:center}
.opt-b:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.opt-b .tag{margin-left:auto;font-family:var(--display);font-weight:400;font-size:14px;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap}
.opt-b .tag.grum{background:#6b5a95;color:#fff}.opt-b .tag.glory{background:#ffcc3d}.opt-b .tag.star{background:var(--teal)}
.reveal{display:flex;align-items:center;gap:12px;margin:22px 0 14px;padding:14px;border-radius:16px;border:3px solid var(--ink)}
.reveal svg{width:64px;height:64px;flex:none}
.reveal h3{font-size:22px}
.reveal p{margin:2px 0 0;font-size:16px}
.reveal.grum{background:#4b3d70;color:#fff}
.reveal.glory{background:#fff3c2;color:#4a3000}
.reveal.star{background:#1e8f86;color:#fff}
.after{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.explore{font-size:15px;color:var(--muted)}

/* ---------- Move cards ---------- */
.move{position:relative;margin-top:18px;background:linear-gradient(160deg,#fff7d6,#ffe39a);color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:18px 18px 16px 92px;box-shadow:0 8px 0 #8a5a12}
.move .mi{position:absolute;left:14px;top:16px;width:64px;height:64px}
.move .k{font-family:var(--display);font-size:14px;color:#8a5a12}
.move h3{font-size:24px}
.move p{margin:6px 0 0;font-size:17px;max-width:60ch}
.move.lockd{background:rgba(255,255,255,.06);color:var(--muted);border-color:rgba(255,255,255,.2);box-shadow:none}
.move.lockd h3{color:var(--muted)}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.shardgot{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;color:var(--star);margin-top:16px}
.shardgot svg{width:44px;height:44px}

/* ---------- Journal & misc ---------- */
.card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:16px;margin-top:14px}
.card h3{color:#fff;font-size:22px}
.lan{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;margin-top:12px}
.lan svg{width:44px;height:56px}
label{font-weight:700;font-size:15px;color:var(--muted);display:block;margin-bottom:3px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:9px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff}
.entry{border-top:1px solid rgba(255,255,255,.12);padding-top:10px;margin-top:10px;font-size:16px}
.entry .d{font-family:var(--display);color:var(--star);font-size:15px}
.cert{margin-top:20px;text-align:center;background:linear-gradient(#fff9e6,#ffe7a8);color:var(--ink);border:5px double #8a5a12;border-radius:18px;padding:22px 16px}
.cert h2{font-size:clamp(28px,7vw,40px)}
.cert .big{font-family:var(--display);font-size:clamp(34px,9vw,52px);color:#4b3796}
.cert .meter{justify-content:center}
.prose p{max-width:62ch}
.prose li{margin:6px 0}
.small{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   Paloma's Pages — a choose-your-path graphic novel reader
   ========================================================= */
const INK = "#1d1a2b";
const SKIN = {s1:"#fbe0cc", s2:"#eebd98", s3:"#cf9469", s4:"#9c6643", s5:"#6a412a"};
const HAIR = {honey:"#a47b4b", blonde:"#d8b06a", brown:"#5b3822", black:"#231b18", auburn:"#9a4523"};
const EYES = {bluegray:"#6f8fb0", blue:"#3f7fd0", green:"#4f8f5a", brown:"#6b4426", hazel:"#8a7a3a"};
const ARMOR = {sky:["#4a93e0","#2b62a6"], violet:["#7a5ad1","#4d3796"], teal:["#25a69c","#167068"], crimson:["#d4455f","#922a40"], gold:["#e0a42c","#a3740f"]};
const STYLES = {long:"Long", ponytail:"Ponytail", braids:"Braids", short:"Short", puffs:"Space buns"};
const GAME_ID = "sky-isles"; // saved to the reader's account through the Paloma's Pages hub
const DEFAULT = {look:{skin:"s1", hair:"honey", eyes:"bluegray", style:"long", armor:"sky"}, shards:{}, paths:{}, read:{}, journal:[], made:false};
let S = load();
function load(){ try{ const v = window.PP && PP.load(GAME_ID); if(v && v.look) return Object.assign(structuredClone(DEFAULT), v); }catch(e){} return structuredClone(DEFAULT); }
function save(){ try{ if(window.PP) PP.save(GAME_ID, S); }catch(e){} }

/* ---------- small svg helpers ---------- */
function starPts(cx,cy,R,r){ let p=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1)); } return p.join(" "); }
function rng(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function cloud(x,y,s,fill,op=1){ return `<g class="drift" style="animation-delay:${-((x*7+y*3)%40)}s"><g transform="translate(${x},${y}) scale(${s})" fill="${fill}" opacity="${op}"><ellipse cx="0" cy="8" rx="44" ry="13"/><circle cx="-18" cy="0" r="15"/><circle cx="4" cy="-8" r="20"/><circle cx="24" cy="0" r="14"/></g></g>`; }
function island(x,y,s,top,rock,tree=true){ return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-42,0 Q-24,30 -6,62 Q4,40 14,46 Q24,22 42,0Z" fill="${rock}"/><ellipse cx="0" cy="0" rx="44" ry="9" fill="${top}"/>${tree?`<rect x="10" y="-22" width="4" height="20" fill="${rock}"/><circle cx="12" cy="-26" r="10" fill="${top}"/>`:""}</g>`; }
function skyGrad(u,stops){ return `<defs><linearGradient id="g${u}" x1="0" y1="0" x2="0" y2="1">${stops.map((c,i)=>`<stop offset="${i/(stops.length-1)}" stop-color="${c}"/>`).join("")}</linearGradient></defs><rect width="400" height="300" fill="url(#g${u})"/>`; }
function glider(x,y,s){ return `<g transform="translate(${x},${y}) scale(${s})" fill="#4b3d70" opacity=".55"><path d="M-20,0 L0,-4 L20,0 L0,3Z"/><circle cx="0" cy="5" r="2"/></g>`; }
function stars(seed,n,y2=300){ const r=rng(seed); let s=""; for(let i=0;i<n;i++){ s+=`<circle class="tw" style="animation-delay:${-(r()*4).toFixed(2)}s" cx="${(r()*400).toFixed(0)}" cy="${(r()*y2).toFixed(0)}" r="${(r()*1.6+.4).toFixed(1)}" fill="#fff" opacity="${(r()*.6+.3).toFixed(2)}"/>`; } return s; }

/* ---------- backgrounds (400 x 300) ---------- */
const BG = {
  dawn:(u)=> skyGrad(u,["#4f7fd0","#a99ad8","#ffc9a0","#ffe6c4"]) + `<circle cx="300" cy="230" r="48" fill="#fff3cf" opacity=".9"/>` + cloud(80,70,1,"#fff",.85)+cloud(320,110,.8,"#fff",.7) + island(90,210,1.1,"#8fd18a","#8b78a8")+island(260,170,.7,"#a3dc98","#9c88b8")+island(350,240,.9,"#8fd18a","#8b78a8",false)+island(30,140,.45,"#b3e3a6","#a896c4") + glider(180,60,1)+glider(220,90,.7)+glider(130,110,.6),
  sky:(u)=> skyGrad(u,["#4fa8ec","#9ad3f6","#e3f5ff"]) + cloud(70,60,1,"#fff",.9)+cloud(330,90,.9,"#fff",.85)+cloud(200,250,1.4,"#fff",.7) + island(60,200,.8,"#8fd18a","#8b78a8")+island(340,180,.6,"#8fd18a","#8b78a8"),
  yard:(u)=> skyGrad(u,["#6fbcf0","#bfe5fb","#eaf7ff"]) + cloud(70,50,.9,"#fff",.9)+cloud(300,40,.7,"#fff",.8) + island(330,130,.6,"#9fd99a","#9a88b8")+island(60,120,.45,"#9fd99a","#9a88b8",false) +
    `<rect x="16" y="70" width="6" height="150" fill="#6b4a33"/><path d="M22,74 L60,84 L22,96Z" fill="#7a5ad1" class="ln"/><rect x="378" y="70" width="6" height="150" fill="#6b4a33"/><path d="M378,74 L340,84 L378,96Z" fill="#ff7d8c" class="ln"/>` +

   {bg:"dusk", chars:[pal(200,300,.95,"smile","down",{imps:["small","small"],wings:true})], b:[b("grum",2,4,42,"So... are you getting rid of us?","bl"), b("glory",56,4,42,"Please don't! I'm SO decorative!","br")]}
   ],
   choice:{ q:"Grum and Glory are waiting. What should Paloma do with them?", opts:[
     {v:"star", label:"Give them both new jobs.", why:"Paloma didn't fight her voices. She gave them better jobs.", panels:[
       {bg:"dusk", chars:[pal(200,300,.95,"smile","down",{imps:["kind",null],wings:true})], b:[b("say",2,3,96,"Grum, you're my Scout now. Warn me about REAL dangers, quietly. Like ropes.","bc"), b("grum",2,30,36,"A Scout. I could be a Scout.","bl")]},
       {bg:"dusk", chars:[pal(200,300,.95,"happy","down",{imps:["kind","kind"],wings:true})], b:[b("say",2,3,96,"Glory, you're my Spark. Cheer when I try hard, not when I beat somebody.","bc"), b("glory",60,30,38,"A Spark! Ooh, even shinier.","br")]},
       {bg:"dusk", chars:[pal(200,196,.7,"happy","fly"), mo(310,150,.9,"happy")], b:[b("cap",3,84,94,"And Paloma flew home through the lanterns, steering by the Middle Star.")]}
     ]},
     {v:"grum", label:"Lock them away forever. Voices like that are dangerous.", why:"Pushing thoughts away makes them bounce back louder. Steering them works better.", panels:[
       {bg:"dusk", chars:[pal(200,300,.95,"angry","point",{wings:true})], sfx:[fx("POOF!",110,160,-8,40,"#fff"),fx("POOF!",300,140,8,40,"#fff")], b:[b("say",2,3,44,"Go away! FOREVER!","tr")]},
       {bg:"dusk", chars:[pal(200,300,.95,"surprised","down",{imps:["shout","shout"],impScale:1.3,wings:true})], b:[b("grum",2,3,46,"Voices don't vanish when you yell at them.","bl"), b("glory",52,3,46,"We just get LOUDER, darling!","br"), b("cap",2,86,96,"Pushing a thought away makes it bounce back. Steering it works better.")]}
     ]},
     {v:"glory", label:"Put Glory in charge. She makes me feel great.", why:"With Glory in charge, nobody else matters. But everybody helped today.", panels:[
       {bg:"gloryb", chars:[gl(120,200,2.6,"shout")], b:[b("glory",46,5,52,"Finally! Rule number one: you are better than EVERYONE!","bl")]},
       {bg:"dusk", chars:[ch("tavi",70,292,.72,"sad","down"), ch("brannoc",150,292,.74,"sad","down"), pal(300,292,.82,"think","think",{imps:[null,"smug"]})], b:[b("think",30,4,66,"Wait. Tavi, Brannoc, Kip and Juno all helped me today. Nobody is better than everyone.","br")]}
     ]}
   ]},
   move:{name:"Three Lanterns", text:"Each night, name three good things from your day and WHY they happened. Your brain gets better at spotting good stuff, the same way your arms get better at climbing."}
 }
];

/* ---------- icons ---------- */
const shardIco = (on)=>`<svg viewBox="-12 -12 24 24" aria-hidden="true"><polygon points="${starPts(0,0,11,4.8)}" fill="${on?"#ffd76a":"rgba(255,255,255,.12)"}" stroke="${on?"#8a5a12":"rgba(255,255,255,.35)"}" stroke-width="1.5"/></svg>`;
const voiceIco = (v)=> v==="grum" ? `<svg viewBox="-52 -40 104 80" aria-hidden="true">${grum("grump")}</svg>` : v==="glory" ? `<svg viewBox="-55 -40 110 80" aria-hidden="true">${glory("smug")}</svg>` : `<svg viewBox="-24 -24 48 48" aria-hidden="true"><circle r="22" fill="#fff3a0" opacity=".35"/><polygon points="${starPts(0,0,18,8)}" fill="#ffd76a" stroke="${INK}" stroke-width="2"/></svg>`;
const MOVE_ICO = [
  `<circle cx="28" cy="28" r="16" fill="#fff" stroke="${INK}" stroke-width="4"/><path d="M40,40 L56,56" stroke="${INK}" stroke-width="7" stroke-linecap="round"/><text x="28" y="33" text-anchor="middle" font-family="Bangers" font-size="13" fill="#d23a3a">ALWAYS</text>`,
  `<g transform="translate(14,28) scale(.32)">${cloud(0,0,1,"#5a5e80")}</g><g transform="translate(32,22) scale(.32)">${cloud(0,0,1,"#fff")}</g><g transform="translate(48,34) scale(.32)"><circle cx="18" cy="-14" r="16" fill="#ffd76a"/>${cloud(0,4,1,"#fff")}</g>`,
  `<path d="M10,52 Q20,30 32,40 Q44,30 54,52Z" fill="#3ccbbd" stroke="${INK}" stroke-width="3"/><circle cx="32" cy="20" r="10" fill="#ffcc3d" stroke="${INK}" stroke-width="3"/><path d="M22,40 L32,30 L42,40" stroke="${INK}" stroke-width="3" fill="none"/>`,
  `<path d="M8,60 L22,8 L44,8 L58,60Z" fill="#8f80a6" stroke="${INK}" stroke-width="3"/>${[[24,48],[36,36],[28,24],[38,14]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="5" ry="3" fill="#ffd76a" stroke="${INK}" stroke-width="1.5"/>`).join("")}`,
  `<circle cx="32" cy="32" r="24" fill="#fff" stroke="${INK}" stroke-width="3"/><polygon points="${starPts(32,32,13,5)}" fill="#ffd76a" stroke="${INK}" stroke-width="2"/><path d="M4,22 q10,-4 18,2 M42,44 q10,4 18,0" stroke="#3ccbbd" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  [[16,30],[32,18],[48,34]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="11" fill="#ffcf6e" opacity=".4"/><rect x="${x-7}" y="${y-9}" width="14" height="18" rx="6" fill="#ffb347" stroke="${INK}" stroke-width="2"/>`).join("")
];
function moveCard(i, locked=false, pop=false){
  const m = BOOK[i].move;
  if(locked) return `<div class="move lockd"><svg class="mi" viewBox="0 0 64 64" aria-hidden="true"><polygon points="${starPts(32,32,24,10)}" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.3)" stroke-width="2"/></svg><div class="k">WINDGUARD MOVE ${i}</div><h3>Locked</h3><p>Find the Middle Star in Chapter ${i} to learn this move.</p></div>`;
  return `<div class="move${pop?" pop":""}"><svg class="mi" viewBox="0 0 64 64" aria-hidden="true">${MOVE_ICO[i-1]}</svg><div class="k">WINDGUARD MOVE ${i} OF 6</div><h3>${m.name}</h3><p>${m.text}</p></div>`;
}

/* ---------- views ---------- */
const app = document.getElementById("app");
const nShards = ()=> Object.keys(S.shards).length;
function topbar(backLabel, backFn){
  return `<div class="topbar"><div class="in"><button class="back" id="backBtn">&larr; ${backLabel}</button><div class="shardcount" title="Star Shards">${shardIco(true)} ${nShards()} / 6</div></div></div>`;
}
function bindBack(fn){ const el = document.getElementById("backBtn"); if(el) el.onclick = fn; }
function go(fn){ fn(); window.scrollTo({top:0}); }

function coverSVG(){
  UID++;
  return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="cv${UID}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211d5c"/><stop offset=".6" stop-color="#6b4aa8"/><stop offset="1" stop-color="#ffae6e"/></linearGradient></defs><rect width="300" height="400" fill="url(#cv${UID})"/>${stars(5,40,220).replace(/cx="(\d+)"/g,(m,a)=>`cx="${Math.round(a*.75)}"`)}${island(60,350,1,"#3a2f5e","#2a2148",false)}${island(250,330,.8,"#3a2f5e","#2a2148",false)}<circle cx="150" cy="240" r="90" fill="#ffd76a" opacity=".12"/>${drawChar(pal(150,330,.95,"happy","fly",{imps:["grump","smug"]}))}</svg>`;
}
function viewHome(){
  const done = nShards();
  app.innerHTML = `<div class="wrap">
    <div class="shelfback"><button class="back" id="shelfBtn">&larr; Bookshelf</button></div>
    <header class="libhead"><h1>Paloma of the Sky Isles</h1><p>Stories where you choose the way.</p></header>
    <article class="book">
      <button class="cover" id="openBook" aria-label="Open Book One: Crosswinds" style="padding:0">${coverSVG()}<div class="ct">PALOMA<small>of the Sky Isles</small></div><div class="cb"><span>BOOK ONE</span></div></button>
      <div class="bookinfo">
        <div class="sub">Book One</div>
        <h2>Crosswinds</h2>
        <p>Paloma has one day to earn her glider wings. A grumpy little Grum on one shoulder says she can't. A glittery Glory on the other says she's better than everyone. You choose which wind she follows.</p>
        <div class="meter" aria-label="${done} of 6 Star Shards">${[1,2,3,4,5,6].map(i=>shardIco(S.shards[i])).join("")}</div>
        <div class="row"><button class="btn" id="readBtn">${done? (done===6?"Read again":"Keep reading") : "Start reading"}</button></div>
      </div>
    </article>
    <div class="tiles">
      <button class="tile" id="lookBtn"><b>Make Paloma look like you</b><span>Hair, eyes, armor</span></button>
      <button class="tile" id="movesBtn"><b>Windguard Moves</b><span>${done} of 6 learned</span></button>
      <button class="tile" id="journalBtn"><b>My Lanterns</b><span>Three good things tonight</span></button>
      <div class="tile locked"><b>Book Two: The Fog Lands</b><span>Coming soon</span></div>
    </div>
    <button class="grownup" id="gBtn">For grown-ups: the ideas behind this story</button>
  </div>`;
  const open = ()=> go(S.made ? viewMap : ()=>viewCreator(true));
  document.getElementById("openBook").onclick = open;
  document.getElementById("readBtn").onclick = open;
  document.getElementById("lookBtn").onclick = ()=>go(()=>viewCreator(false));
  document.getElementById("movesBtn").onclick = ()=>go(viewMoves);
  document.getElementById("journalBtn").onclick = ()=>go(viewJournal);
  document.getElementById("gBtn").onclick = ()=>go(viewGrown);
  document.getElementById("shelfBtn").onclick = ()=>{ save(); window.PP && PP.exit(); };
}

function viewCreator(first){
  const opts = [
    ["Skin", "skin", Object.entries(SKIN)],
    ["Hair color", "hair", Object.entries(HAIR)],
    ["Hair style", "style", Object.entries(STYLES), true],
    ["Eyes", "eyes", Object.entries(EYES)],
    ["Armor", "armor", Object.entries(ARMOR).map(([k,v])=>[k,v[0]])]
  ];
  const render = ()=>{
    app.innerHTML = topbar("Library") + `<div class="wrap">
      <h2 style="font-size:30px;margin-top:14px">${first?"First, let's meet Paloma":"Paloma's look"}</h2>
      <p class="small" style="margin:4px 0 0">Pick what looks most like you. You can change it any time.</p>
      <div class="creator">
        <div class="preview"><svg viewBox="0 0 240 320" aria-label="Paloma preview">${island(120,300,2.4,"#8fd18a","#8b78a8",false)}${drawChar(pal(120,292,1.25,"happy","cheer",{wings:false}))}</svg></div>
        <div>${opts.map(([lab,key,list,txt])=>`<div class="opt"><h3 id="h-${key}">${lab}</h3><div class="sw${txt?" txt":""}" role="group" aria-labelledby="h-${key}">${list.map(([k,v])=> txt ? `<button id="o-${key}-${k}" data-k="${key}" data-v="${k}" aria-pressed="${S.look[key]===k}">${v}</button>` : `<button id="o-${key}-${k}" data-k="${key}" data-v="${k}" aria-pressed="${S.look[key]===k}" aria-label="${lab} ${k}" style="background:${v}"></button>`).join("")}</div></div>`).join("")}
          <div class="row" style="margin-top:18px"><button class="btn" id="doneBtn">${first?"That's me! Start the story":"Save"}</button></div>
        </div>
      </div></div>`;
    bindBack(()=>go(viewHome));
    app.querySelectorAll(".sw button").forEach(el=> el.onclick = ()=>{ S.look[el.dataset.k] = el.dataset.v; save(); render(); document.getElementById(el.id)?.focus(); });
    document.getElementById("doneBtn").onclick = ()=>{ S.made = true; save(); go(first ? ()=>viewChapter(0) : viewHome); };
  };
  render();
}

const unlocked = (i)=> i<=1 || !!S.shards[i-1];
function viewMap(){
  app.innerHTML = topbar("Library") + `<div class="wrap">
    <div class="chhead"><div class="k">BOOK ONE</div><h2>Crosswinds</h2><p class="small">Find the Middle Star on each isle to earn a Star Shard. Dots show which winds you've explored.</p></div>
    <div class="isles">${BOOK.map((c,i)=>{
      const seen = S.paths[i] || [];
      return `<button class="isle" data-i="${i}" ${unlocked(i)?"":"disabled"} aria-label="${i?`Chapter ${i}`:"Prologue"}: ${c.title}${unlocked(i)?"":" (locked)"}">
        <svg class="ico" viewBox="-50 -20 100 80" aria-hidden="true">${island(0,10,1,i===0?"#8fd18a":S.shards[i]?"#ffd76a":"#8fd18a","#8b78a8")}</svg>
        <div><div class="num">${i?`CHAPTER ${i}`:"PROLOGUE"}</div><div class="ttl">${c.title}</div></div>
        ${i?`<div class="st">${shardIco(S.shards[i])}<div class="dots">${["grum","glory","star"].map(v=>`<i class="${seen.includes(v)?"on":""}"></i>`).join("")}</div></div>`:""}
      </button>`;}).join("")}</div></div>`;
  bindBack(()=>go(viewHome));
  app.querySelectorAll(".isle").forEach(el=> el.onclick = ()=>go(()=>viewChapter(+el.dataset.i)));
}

function viewChapter(i){
  const c = BOOK[i];
  let html = topbar("Map") + `<div class="wrap"><div class="chhead"><div class="k">${i?`CHAPTER ${i}`:"PROLOGUE"}</div><h2>${c.title}</h2></div><div class="strip">${c.panels.map(panel).join("")}</div>`;
  if(c.choice){
    html += `<section class="choice" aria-live="polite"><h3>Which wind?</h3><p class="q">${c.choice.q}</p><div class="opts">${c.choice.opts.map(o=>{ const seen=(S.paths[i]||[]).includes(o.v); return `<button class="opt-b" data-v="${o.v}">${o.label}${seen?`<span class="tag ${o.v}">${o.v==="star"?"Middle Star":o.v==="grum"?"Grum":"Glory"}</span>`:""}</button>`; }).join("")}</div></section><div id="outcome"></div>`;
  } else {
    html += `<div class="after" style="justify-content:center;margin-top:24px"><button class="btn" id="nextBtn">Fly to Chapter 1</button></div>`;
  }
  app.innerHTML = html + `</div>`;
  bindBack(()=>go(viewMap));
  if(!c.choice){ S.read[0] = true; save(); document.getElementById("nextBtn").onclick = ()=>go(()=>viewChapter(1)); return; }
  app.querySelectorAll(".opt-b").forEach(el=> el.onclick = ()=> choose(i, el.dataset.v));
}

function choose(i, v){
  const c = BOOK[i], o = c.choice.opts.find(x=>x.v===v);
  const seen = S.paths[i] = S.paths[i] || [];
  if(!seen.includes(v)) seen.push(v);
  const firstShard = v==="star" && !S.shards[i];
  if(v==="star") S.shards[i] = true;
  save();
  const names = {grum:"That was Grum's wind.", glory:"That was Glory's wind.", star:"You found the Middle Star!"};
  let h = `<div class="reveal ${v}">${voiceIco(v)}<div><h3>${names[v]}</h3><p>${o.why}</p></div></div><div class="strip">${o.panels.map(panel).join("")}</div>`;
  const left = 3 - seen.length;
  const explore = left ? `<span class="explore">Wind Explorer: ${seen.length} of 3 paths found.</span>` : `<span class="explore">Wind Explorer: you found all 3 paths on this isle!</span>`;
  if(v==="star"){
    h += `<div class="shardgot ${firstShard?"pop":""}">${shardIco(true)} ${firstShard?"Star Shard earned!":"Star Shard already earned."} ${nShards()} of 6</div>` + moveCard(i,false,firstShard);
    if(i < BOOK.length-1) h += `<div class="after"><button class="btn" id="nextBtn">Next: Chapter ${i+1}</button><button class="btn alt" id="againBtn">Try another wind</button>${explore}</div>`;
    else h += finale() + `<div class="after"><button class="btn alt" id="againBtn">Try another wind</button>${explore}</div>`;
  } else {
    h += `<div class="after"><button class="btn teal" id="againBtn">Try a different wind</button>${explore}</div>`;
  }
  const out = document.getElementById("outcome");
  out.innerHTML = h;
  // refresh tags + counter
  document.querySelector(".shardcount").innerHTML = `${shardIco(true)} ${nShards()} / 6`;
  app.querySelectorAll(".opt-b").forEach(el=>{ const vv = el.dataset.v; if(seen.includes(vv) && !el.querySelector(".tag")) el.insertAdjacentHTML("beforeend", `<span class="tag ${vv}">${vv==="star"?"Middle Star":vv==="grum"?"Grum":"Glory"}</span>`); });
  out.querySelector(".reveal").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  const nx = document.getElementById("nextBtn"); if(nx) nx.onclick = ()=>go(()=>viewChapter(i+1));
  document.getElementById("againBtn").onclick = ()=>{ out.innerHTML = ""; document.querySelector(".choice").scrollIntoView({behavior:"smooth", block:"start"}); };
  const jb = document.getElementById("finJournal"); if(jb) jb.onclick = ()=>go(viewJournal);
}

function finale(){
  const all = nShards()===6;
  return `<div class="cert"><div class="k" style="font-family:var(--display);color:#8a5a12">THE END OF BOOK ONE</div>
    <h2>${all?"Windguard of the Middle Star":"Almost a Windguard!"}</h2>
    <div class="big">Paloma</div>
    <div class="meter">${[1,2,3,4,5,6].map(n=>shardIco(S.shards[n])).join("")}</div>
    <p>${all?"Six Star Shards. Six Windguard Moves. One cadet who can steer through any wind.":"Go back to the map to find the Star Shards you're missing."}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="finJournal">Light your own lanterns</button></div>
    <p class="small" style="color:#6b4500">Coming soon: Book Two, The Fog Lands.</p></div>`;
}

function viewMoves(){
  app.innerHTML = topbar("Library") + `<div class="wrap"><div class="chhead"><div class="k">YOUR COLLECTION</div><h2>Windguard Moves</h2><p class="small">Real tricks for steering between Grum and Glory. Try one tomorrow!</p></div>${[1,2,3,4,5,6].map(i=>moveCard(i, !S.shards[i])).join("")}</div>`;
  bindBack(()=>go(viewHome));
}

function viewJournal(){
  const today = new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});
  const lanSvg = `<svg viewBox="0 0 44 56" aria-hidden="true"><circle cx="22" cy="28" r="20" fill="#ffcf6e" opacity=".3"/><rect x="10" y="12" width="24" height="32" rx="10" fill="#ffb347" stroke="${INK}" stroke-width="2"/><path d="M22,4 V12" stroke="#fff" stroke-width="2"/></svg>`;
  app.innerHTML = topbar("Library") + `<div class="wrap"><div class="chhead"><div class="k">MOVE 6: THREE LANTERNS</div><h2>My Lanterns</h2><p class="small">Just like Paloma: three good things from today, and why each one happened.</p></div>
    <form class="card" id="jf"><h3>${today}</h3>
      ${[1,2,3].map(n=>`<div class="lan">${lanSvg}<div><label for="g${n}">Good thing ${n}</label><input type="text" id="g${n}" maxlength="140" autocomplete="off"><label for="w${n}" style="margin-top:6px">Why did it happen?</label><input type="text" id="w${n}" maxlength="140" autocomplete="off"></div></div>`).join("")}
      <div class="row" style="margin-top:16px"><button class="btn" type="submit">Let my lanterns fly</button></div>
      <p class="small" id="jmsg" role="status"></p>
    </form>
    <div class="card"><h3>Past lanterns</h3>${S.journal.length ? S.journal.slice().reverse().map(e=>`<div class="entry"><div class="d">${e.d}</div>${e.items.map(it=>`<div>&#9733; ${esc(it.g)}${it.w?` <span class="small">because ${esc(it.w)}</span>`:""}</div>`).join("")}</div>`).join("") : `<p class="small">Your lanterns will float here. They're saved on this device only.</p>`}</div></div>`;
  bindBack(()=>go(viewHome));
  document.getElementById("jf").onsubmit = (e)=>{
    e.preventDefault();
    const items = [1,2,3].map(n=>({g:document.getElementById("g"+n).value.trim(), w:document.getElementById("w"+n).value.trim()})).filter(x=>x.g);
    if(!items.length){ document.getElementById("jmsg").textContent = "Write at least one good thing first."; return; }
    S.journal.push({d:today, items}); save(); viewJournal();
    document.getElementById("jmsg").textContent = `${items.length} lantern${items.length>1?"s":""} flying! Nice steering.`;
  };
}
function esc(s){ return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function viewGrown(){
  app.innerHTML = topbar("Library") + `<div class="wrap prose"><div class="chhead"><div class="k">FOR GROWN-UPS</div><h2>The ideas behind Crosswinds</h2></div>
  <p>The story turns ideas from psychologist Martin Seligman, the founder of positive psychology, into a game. They come from his books on learned optimism and agency and his conversation on Modern Wisdom (episode #1167).</p>
  <ul>
    <li><b>Grum is pessimistic explaining.</b> Seligman describes pessimists explaining a setback as permanent (“always”), pervasive (“everything”) and personal (“I'm bad”). Move 1 teaches flipping that to temporary, specific and fixable.</li>
    <li><b>Disputing.</b> Paloma argues back with evidence, like a detective. Chapter 2 uses his worst case / best case / most likely exercise for catastrophic thoughts.</li>
    <li><b>Glory is confidence without wisdom.</b> Seligman warns that efficacy and optimism need judgment and a moral sense, or they turn into recklessness and looking down on others. Glory's “you're better than everyone” and “skip the rope” are that shadow side.</li>
    <li><b>Mastery in small steps.</b> Chapter 4's “one handhold” mirrors his advice to break big tasks into graded, winnable steps.</li>
    <li><b>Kindness and gratitude.</b> Chapter 3 and the Lantern journal use his kindness and “three good things” exercises, where you write what went well and why.</li>
  </ul>
  <p><b>Try this at home:</b> when she's frustrated, ask “Is that Grum or Glory talking?” and “What would the Middle Star say?” Naming the voice makes it easier to argue with.</p>
  <p class="small">Progress and journal entries are saved to her Paloma's Pages reader account, so they follow her when she signs in on another device.</p></div>`;
  bindBack(()=>go(viewHome));
}

viewHome();
</script>
