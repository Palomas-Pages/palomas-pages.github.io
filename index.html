<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paloma's Pages</title>
<meta name="theme-color" content="#1b1f4b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>:root{
  --ink:#2b1d3d; --plum:#3b2a5a; --plum2:#5b3f8a; --gold:#ffd166; --gold2:#f4a261; --coral:#e76f51; --mint:#7ee0a1; --sky:#bfe3ff;
  --paper:#fff8ec; --paper2:#f6ead4; --night:#0f1433;
  --ui:'Fredoka', 'Trebuchet MS', system-ui, sans-serif; --comic:'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive; --boom:'Bangers', 'Impact', sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0b0e26}html,body{margin:0;min-height:100%;}
body{font-family:var(--ui);color:var(--ink);background:radial-gradient(ellipse at 50% -10%,#3a3f8f 0%,#1b1f4b 45%,#0b0e26 100%) fixed;overflow-x:hidden;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:none}
.sky-stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky-stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
#app{position:relative;z-index:1;min-height:100vh}
.screen{display:none;min-height:100vh;padding:18px 14px 30px;animation:fadeIn .45s ease}
.screen.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hidden{display:none!important}

/* ---------- Title / login ---------- */
.title-wrap{max-width:900px;margin:0 auto;text-align:center;color:#fff;padding-top:3vh}
.logo{font-family:var(--ui);font-weight:700;font-size:clamp(40px,8vw,84px);line-height:1;margin:6px 0 4px;letter-spacing:1px;
  background:linear-gradient(180deg,#fff6d6 0%,#ffd166 55%,#f4a261 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5b3f8a) drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.tagline{font-size:clamp(16px,2.4vw,22px);opacity:.9;margin:0 0 16px}
.hero{position:relative;width:min(520px,90vw);aspect-ratio:16/9;margin:0 auto 18px;border-radius:22px;overflow:hidden;border:5px solid #fff3d1;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.hero .scene{position:absolute;inset:0;width:100%;height:100%}
.hero .actor{position:absolute}
.card{background:var(--paper);border-radius:22px;padding:20px;box-shadow:0 10px 0 #d9c6a3,0 18px 40px rgba(0,0,0,.35);color:var(--ink)}
.login-card{max-width:560px;margin:0 auto;text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px 0}
.tile{background:#fff;border-radius:18px;padding:10px 14px 12px;width:150px;box-shadow:0 6px 0 #e5d5b5;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)}
.tile .av{width:96px;height:96px;margin:0 auto}
.tile b{display:block;font-size:20px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--plum2);color:#fff;font-weight:700;font-size:19px;padding:12px 22px;border-radius:16px;box-shadow:0 5px 0 #2e1f4d;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2e1f4d}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #c9971f}
.btn.mint{background:#3cb371;box-shadow:0 5px 0 #23784a}
.btn.ghost{background:transparent;color:inherit;box-shadow:none;text-decoration:underline;font-weight:600;font-size:16px}
.btn.small{font-size:15px;padding:8px 14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{font-family:var(--ui);font-size:22px;padding:10px 14px;border-radius:14px;border:3px solid #d9c6a3;width:100%;max-width:320px;text-align:center;color:var(--ink);background:#fff}
.field:focus{outline:none;border-color:var(--plum2)}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:12px auto}
.pic{font-size:40px;background:#fff;border-radius:16px;aspect-ratio:1;box-shadow:0 5px 0 #e5d5b5;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.pic:active{transform:scale(.92)}
.pic.sel{background:#ffe7a3;box-shadow:0 5px 0 #d4a72c}
.dots{display:flex;gap:12px;justify-content:center;margin:8px 0}
.dots span{width:46px;height:46px;border-radius:14px;border:3px dashed #c9b48a;display:flex;align-items:center;justify-content:center;font-size:28px;background:#fffdf7}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.msg{min-height:26px;font-weight:600;color:var(--coral)}
.note{font-size:14px;opacity:.75}
.linkrow{margin-top:14px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto 14px;color:#fff}
.topbar .me{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:40px;padding:4px 16px 4px 4px}
.topbar .me .av{width:46px;height:46px;background:#fff8ec;border-radius:50%;overflow:hidden}
.topbar .me b{font-size:18px}
.topbar .grow{flex:1}
.pill{background:rgba(255,255,255,.14);color:#fff;border-radius:30px;padding:8px 14px;font-weight:700;font-size:17px;display:inline-flex;gap:6px;align-items:center}
.iconbtn{background:rgba(255,255,255,.14);color:#fff;border-radius:50%;width:46px;height:46px;font-size:22px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn.off{opacity:.45}

/* ---------- Shelf ---------- */
.shelf{max-width:1100px;margin:0 auto}
.shelf h2{color:#fff;font-size:26px;margin:18px 4px 10px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.book-card{background:var(--paper);border-radius:20px;overflow:hidden;box-shadow:0 10px 0 #d9c6a3,0 16px 30px rgba(0,0,0,.35);display:flex;flex-direction:column;transition:transform .2s}
.book-card:hover{transform:translateY(-4px) rotate(-.5deg)}
.book-card .cover{position:relative;aspect-ratio:16/10;overflow:hidden}
.book-card .cover .scene{position:absolute;inset:0;width:100%;height:100%}
.book-card .cover h3{position:absolute;left:0;right:0;bottom:0;margin:0;padding:30px 14px 10px;font-family:var(--ui);font-size:26px;color:#fff;text-shadow:0 3px 0 #2e1f4d,0 0 12px rgba(0,0,0,.6);background:linear-gradient(transparent,rgba(20,10,40,.75))}
.book-card .cover .actor{position:absolute}
.book-card .body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.bar{height:14px;border-radius:10px;background:#eadbbd;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7ee0a1,#3cb371);border-radius:10px;transition:width .6s}
.book-card.locked{filter:grayscale(.6) brightness(.85);pointer-events:none}
.lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;background:rgba(10,10,30,.35)}
.chapters{display:grid;gap:12px;max-width:700px;margin:0 auto}
.chap{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:16px;padding:12px 16px;box-shadow:0 6px 0 #d9c6a3;text-align:left;font-size:18px;color:var(--ink)}
.chap .num{width:48px;height:48px;border-radius:14px;background:var(--plum2);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.chap.done .num{background:#3cb371}
.chap.locked{opacity:.5;pointer-events:none}
.chap .st{margin-left:auto;font-size:18px;white-space:nowrap}

/* ---------- Graphic novel stage ---------- */
#reader{padding-top:10px}
.bookwrap{width:min(96vw,calc((100vh - 150px) * 16 / 9),1240px);margin:0 auto}
.chapter-head{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:8px}
.chapter-head h2{font-size:clamp(16px,2.3vw,22px);margin:0;font-weight:600;opacity:.95}
.chapter-head .grow{flex:1}
.page{position:relative;aspect-ratio:16/9;background:#141414;border-radius:14px;padding:8px;display:grid;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.55);border:4px solid #fff3d1}
.page.l2{grid-template-columns:1fr 1fr}
.page.l3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.page.l3 .panel:first-child{grid-column:1/3}
.panel{position:relative;overflow:hidden;border-radius:6px;border:3px solid #111;background:#222;opacity:0;transform:scale(.97);transition:opacity .5s,transform .5s;cursor:pointer}
.panel.shown{opacity:1;transform:none}
.panel .bg{position:absolute;inset:-3%;will-change:transform;animation:kenburns 26s ease-in-out infinite alternate}
.panel.zoom .bg{animation:kenburns2 14s ease-in-out infinite alternate}
.panel .scene{width:100%;height:100%;display:block}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.06) translate(-1.2%,-.6%)}}
@keyframes kenburns2{from{transform:scale(1.04)}to{transform:scale(1.14) translate(0,2%)}}
.panel.quake{animation:quake .5s 2}
@keyframes quake{25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,-2px)}}
.halftone{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1.4px);background-size:6px 6px}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px rgba(0,0,0,.45)}
.actors{position:absolute;inset:0;pointer-events:none}
.actor{position:absolute;will-change:transform;transform:translateX(-50%);transition:left 1.2s ease,opacity .6s}
.actor .catsvg{height:100%;width:auto;display:block;overflow:visible}
.actor.flip .catsvg{transform:scaleX(-1)}
.actor.hide{opacity:0}
.actor.enter-left{animation:enterL .9s cubic-bezier(.2,.8,.3,1.1) both}
.actor.enter-right{animation:enterR .9s cubic-bezier(.2,.8,.3,1.1) both}
.actor.enter-fade{animation:enterF 1.6s ease both}
.actor.exit-right{animation:exitR .9s ease-in both}
.actor.exit-left{animation:exitL .9s ease-in both}
.actor.pounce{animation:pounce 1s cubic-bezier(.3,.7,.4,1) both}
.actor.hop{animation:hop .6s ease}
@keyframes enterL{from{transform:translateX(-260%)}to{transform:translateX(-50%)}}
@keyframes enterR{from{transform:translateX(260%)}to{transform:translateX(-50%)}}
@keyframes enterF{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:none}}
@keyframes exitR{to{transform:translateX(320%);opacity:0}}
@keyframes exitL{to{transform:translateX(-320%);opacity:0}}
@keyframes pounce{0%{transform:translate(-160%,0)}45%{transform:translate(-80%,-55%) rotate(-12deg)}100%{transform:translate(-50%,0) rotate(0)}}
@keyframes hop{50%{transform:translate(-50%,-18%)}}
/* cat life */
.catsvg .tail{transform-origin:66px 234px;animation:tail 3.2s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.catsvg .head{transform-origin:98px 118px;animation:headb 5s ease-in-out infinite}
@keyframes headb{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}}
.catsvg .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.catsvg .earL{transform-origin:72px 62px;animation:twitch 7s infinite}
@keyframes twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}96%{transform:rotate(4deg)}}
.catsvg .mouthO{opacity:0}
.actor.talking .catsvg .mouthO{animation:talk .28s infinite alternate}
.actor.talking .catsvg .mouthC{opacity:0}
@keyframes talk{from{opacity:1;transform:scaleY(.3)}to{opacity:1;transform:scaleY(1)}}
.actor.talking .catsvg .mouthO{transform-box:fill-box;transform-origin:center top}
.actor.talking{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateX(-50%) translateY(-2%)}}
.actor.breathe .catsvg{animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.02)}}
.catsvg.walk .lgF1,.catsvg.walk .lgB2{animation:legA .7s ease-in-out infinite alternate}
.catsvg.walk .lgF2,.catsvg.walk .lgB1{animation:legA .7s ease-in-out infinite alternate-reverse}
@keyframes legA{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
.catsvg.walk .tail{animation:wtail 2s ease-in-out infinite;transform-origin:58px 90px}
@keyframes wtail{50%{transform:rotate(-10deg)}}
.glow .catsvg{filter:drop-shadow(0 0 14px #9fd0ff) drop-shadow(0 0 30px #6aa8ff);opacity:.9}
.glow{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateX(-50%) translateY(-4%)}}
.foxeyes{animation:foxblink 3s infinite}
@keyframes foxblink{0%,88%,100%{opacity:1}92%{opacity:0}}
/* scene life */
.scene .far{animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(-14px)}}
.scene .sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
@keyframes sway{50%{transform:rotate(4deg)}}
.scene .twinkle{animation:tw 3s infinite ease-in-out}
.scene .cloud{animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
.scene .ripple{animation:rip 3.5s ease-in-out infinite}
@keyframes rip{50%{transform:translateX(18px);opacity:.4}}
.scene .streak{animation:streak .9s linear infinite}
@keyframes streak{from{transform:translateY(-40px);opacity:.1}50%{opacity:.7}to{transform:translateY(40px);opacity:.1}}
.scene .mist{animation:mist 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes mist{50%{transform:scale(1.08);opacity:.75}}
.scene .poolglow{animation:pglow 4s ease-in-out infinite}
@keyframes pglow{50%{opacity:.6}}
.scene .rays{animation:rays 7s ease-in-out infinite}
@keyframes rays{50%{opacity:.12}}
.scene .mote{animation:mote 8s linear infinite}
@keyframes mote{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-60px);opacity:0}}
.scene .sunpulse{animation:sun 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sun{50%{transform:scale(1.06)}}
/* fx */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx .leaf{position:absolute;top:-8%;width:16px;height:10px;border-radius:0 80% 0 80%;animation:leaf linear infinite}
@keyframes leaf{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-80px,120vh) rotate(720deg)}}
.fx .fly{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6a8;box-shadow:0 0 10px 4px rgba(255,240,140,.7);animation:fly ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0);opacity:.2}50%{opacity:1}100%{transform:translate(40px,-30px);opacity:.3}}
.fx .spark{position:absolute;color:#fff7c2;font-size:18px;animation:spark 2.2s ease-in-out infinite;text-shadow:0 0 8px #ffe680}
@keyframes spark{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.fx .bfly{position:absolute;font-size:20px;animation:bfly 9s ease-in-out infinite}
@keyframes bfly{0%{transform:translate(0,0)}25%{transform:translate(60px,-30px)}50%{transform:translate(120px,10px)}75%{transform:translate(60px,30px)}100%{transform:translate(0,0)}}
.fx .drop{position:absolute;top:-10%;width:4px;height:14px;border-radius:4px;background:rgba(200,235,255,.9);animation:drop .9s linear infinite}
@keyframes drop{to{transform:translateY(130vh)}}
/* text */
.textlayer{position:absolute;left:0;right:0;top:0;padding:2.2% 2.4%;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
.cap{background:#fff3b8;border:3px solid #1d1d1d;border-radius:4px;padding:6px 12px;font-family:var(--comic);font-size:clamp(15px,1.9vw,24px);line-height:1.25;max-width:78%;box-shadow:4px 4px 0 rgba(0,0,0,.6);animation:pop .35s ease}
.bub{position:relative;background:#fff;border:3px solid #1d1d1d;border-radius:22px;padding:8px 14px 9px;font-family:var(--comic);font-size:clamp(15px,2vw,25px);line-height:1.22;max-width:62%;box-shadow:3px 4px 0 rgba(0,0,0,.45);animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.page.l2 .bub,.page.l2 .cap{max-width:92%;font-size:clamp(14px,1.7vw,21px)}
.bub .who{display:block;font-family:var(--ui);font-weight:700;font-size:.62em;letter-spacing:.5px;color:var(--plum2);text-transform:uppercase;margin-bottom:1px}
.bub::after{content:"";position:absolute;bottom:-17px;left:var(--tail,30px);border:9px solid transparent;border-top:12px solid #1d1d1d}
.bub::before{content:"";position:absolute;bottom:-11px;left:calc(var(--tail,30px) + 2px);border:7px solid transparent;border-top:10px solid #fff;z-index:1}
.bub.notail::after,.bub.notail::before{display:none}
.bub.glowb{background:#eaf3ff;border-color:#5876c9;box-shadow:0 0 18px #9fc4ff}
.bub.old,.cap.old{opacity:.0;transform:scale(.9);transition:all .4s;position:absolute;pointer-events:none}
.sfx{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg);font-family:var(--boom);font-size:clamp(34px,7vw,96px);color:#ffd23f;-webkit-text-stroke:3px #1d1d1d;text-shadow:5px 5px 0 #e63946;letter-spacing:2px;white-space:nowrap;animation:boom .6s cubic-bezier(.3,1.8,.5,1) both;pointer-events:none;z-index:5}
.sfx::before{content:"";position:absolute;inset:-30% -12%;z-index:-1;background:radial-gradient(circle,#fff 0 30%,transparent 31%);opacity:.0}
@keyframes boom{from{transform:translate(-50%,-50%) scale(.2) rotate(-25deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(-6deg);opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.controls{display:flex;align-items:center;gap:10px;margin-top:12px}
.controls .grow{flex:1;text-align:center;color:#fff;opacity:.8;font-size:15px}
.next{font-size:22px;padding:12px 26px}
.next.ready{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #c9971f,0 0 0 0 rgba(255,209,102,.7)}50%{box-shadow:0 5px 0 #c9971f,0 0 0 12px rgba(255,209,102,0)}}
.tap-hint{position:absolute;right:12px;bottom:10px;color:#fff;background:rgba(0,0,0,.45);border-radius:20px;padding:4px 10px;font-size:13px;pointer-events:none;animation:fadeIn 1s}

/* ---------- Title card between chapters ---------- */
.titlecard{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#3d2f73,#120c2b);color:#fff;border-radius:10px;animation:fadeIn .6s;cursor:pointer}
.titlecard small{font-size:clamp(16px,2.4vw,24px);letter-spacing:6px;text-transform:uppercase;color:var(--gold)}
.titlecard h1{font-family:var(--ui);font-size:clamp(34px,6vw,72px);margin:6px 0;text-shadow:0 4px 0 #000}
.titlecard .stars{font-size:24px;letter-spacing:8px;opacity:.8;animation:tw 2s infinite}

/* ---------- Challenge ---------- */
.chal{position:relative;border-radius:14px;overflow:hidden;border:4px solid #fff3d1;box-shadow:0 20px 50px rgba(0,0,0,.55);min-height:calc(min(96vw,1240px) * 9 / 16)}
.chal>.bg{position:absolute;inset:0;filter:blur(3px) brightness(.55)}
.chal>.bg .scene{width:100%;height:100%}
.chal-inner{position:relative;display:grid;grid-template-columns:minmax(150px,30%) 1fr;gap:12px;padding:14px;align-items:start}
.mentor{position:sticky;top:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mentor .bub{max-width:100%;font-size:clamp(15px,1.7vw,20px)}
.mentor .bub::after{left:50%}.mentor .bub::before{left:calc(50% + 2px)}
.mentor .actor{position:relative;transform:none;height:clamp(140px,26vw,300px);left:auto}
.mentor .actor.talking{animation:none}
.qcard{background:var(--paper);border-radius:20px;padding:16px 18px 18px;box-shadow:0 8px 0 #d9c6a3;position:relative}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ribbon{background:var(--plum2);color:#fff;font-weight:700;padding:6px 14px;border-radius:10px;font-size:18px}
.gems{display:flex;gap:6px;margin-left:auto}
.gems i{width:22px;height:22px;border-radius:50%;background:#e3d6bc;display:block;border:2px solid #c9b48a;font-style:normal;font-size:14px;line-height:18px;text-align:center}
.gems i.ok{background:var(--gold);border-color:#c9971f}
.gems i.miss{background:#ffc9bd;border-color:var(--coral)}
.gems i.cur{outline:3px solid var(--plum2);outline-offset:2px}
.qtext{font-size:clamp(19px,2.2vw,26px);line-height:1.35;margin:12px 0 8px;font-weight:500}
.qtext .say{margin-left:6px;vertical-align:middle;width:36px;height:36px;font-size:18px;background:#efe4ff;color:var(--plum2)}
.model-wrap{display:flex;justify-content:center;margin:6px 0 10px}
.model{max-width:100%;max-height:280px;width:auto;height:auto;background:#fff;border-radius:14px;padding:6px}
pre.cols{font-family:'Courier New',monospace;font-size:clamp(22px,3vw,32px);font-weight:700;background:#fff;border-radius:14px;padding:10px 22px;margin:0;line-height:1.25;color:var(--ink)}
.answer-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.ansbox{min-width:170px;height:62px;border-radius:14px;background:#fff;border:4px solid var(--plum2);font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 14px;letter-spacing:1px}
.ansbox.empty{color:#bbb}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-width:520px;margin:12px auto 0}
.pad button{background:#fff;font-size:26px;font-weight:700;color:var(--ink);height:58px;border-radius:14px;box-shadow:0 4px 0 #d9c6a3}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9c6a3}
.pad .chk{grid-column:span 2;background:#3cb371;color:#fff;box-shadow:0 4px 0 #23784a;font-size:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.opt{background:#fff;border-radius:16px;padding:14px 12px;font-size:clamp(17px,2vw,22px);font-weight:600;color:var(--ink);box-shadow:0 5px 0 #d9c6a3;min-height:64px}
.opt.stone{background:radial-gradient(ellipse at 40% 30%,#c9ccd2,#8b8f96);color:#1d1d1d;border-radius:46% 54% 50% 50%/55% 50% 50% 45%;box-shadow:0 7px 0 #5b5f66;font-size:24px;font-weight:800}
.opt.right{background:#c9f5d6!important;box-shadow:0 5px 0 #3cb371!important}
.opt.wrong{background:#ffd5cc!important;box-shadow:0 5px 0 var(--coral)!important;animation:shake .45s}
.feedback{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:clamp(16px,1.8vw,20px);line-height:1.35;display:none}
.feedback.on{display:block;animation:pop .3s}
.feedback.hint{background:#fff4d6;border:3px dashed #e9b949}
.feedback.good{background:#dcf8e6;border:3px solid #3cb371}
.feedback.show{background:#efe6ff;border:3px solid var(--plum2)}
.feedback ol{margin:6px 0 0 4px;padding-left:20px}
.feedback li{margin:3px 0}
.feedback .eq{font-weight:700}
.nextq{margin-top:12px;text-align:center}
.burst{position:fixed;pointer-events:none;z-index:99;font-size:26px;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.4);opacity:0}}
.plus{position:absolute;right:20px;top:-10px;font-weight:800;font-size:28px;color:#c9971f;animation:plus 1.2s ease-out forwards}
@keyframes plus{from{transform:translateY(20px);opacity:0}30%{opacity:1}to{transform:translateY(-30px);opacity:0}}
.results{text-align:center;padding:20px}
.results .big{font-size:56px;letter-spacing:6px}
.results h2{font-size:32px;margin:4px 0}

/* ---------- Maker ---------- */
.maker{display:grid;grid-template-columns:minmax(220px,38%) 1fr;gap:18px;background:var(--paper);border-radius:20px;padding:18px;box-shadow:0 10px 0 #d9c6a3}
.maker .preview{background:radial-gradient(circle at 50% 70%,#fff3cf,#f3dfb6);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;min-height:300px}
.maker .preview .actor{position:relative;transform:none;left:auto;height:260px}
.maker .preview h2{margin:6px 0 0;font-size:32px}
.maker h3{margin:10px 0 6px;font-size:18px;color:var(--plum2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border-radius:30px;padding:8px 14px;font-size:17px;font-weight:600;color:var(--ink);box-shadow:0 3px 0 #e1d0ad}
.chip.on{background:var(--plum2);color:#fff;box-shadow:0 3px 0 #2e1f4d}
.sw{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 #e1d0ad}
.sw.on{outline:4px solid var(--plum2)}

/* ---------- Training + grown-up ---------- */
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.skill{background:var(--paper);border-radius:18px;padding:14px;text-align:left;box-shadow:0 6px 0 #d9c6a3;color:var(--ink);display:flex;gap:12px;align-items:center}
.skill .ic{font-size:34px}
.skill b{display:block;font-size:17px}
.skill small{opacity:.7}
.ring{margin-left:auto;flex:none}
.report table{width:100%;border-collapse:collapse;font-size:16px}
.report td,.report th{padding:8px 6px;border-bottom:2px solid #efe2c8;text-align:left;vertical-align:middle}
.report .meter{height:12px;width:120px;background:#eadbbd;border-radius:8px;overflow:hidden;display:inline-block;vertical-align:middle}
.report .meter i{display:block;height:100%}
.toggle{width:52px;height:30px;border-radius:30px;background:#ccc;position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.toggle.on{background:#3cb371}.toggle.on::after{left:25px}
.gu{max-width:900px;margin:0 auto}
.gu .card{margin-bottom:18px}
.gu h2{margin-top:0}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal .card{max-width:440px;width:100%;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b1d3d;color:#fff;padding:10px 18px;border-radius:30px;z-index:200;font-weight:600;animation:fadeIn .3s}

@media (max-width:760px){
  .page{aspect-ratio:auto;grid-template-columns:1fr!important;grid-template-rows:none!important}
  .page .panel{aspect-ratio:4/3.4}
  .page.l2 .panel,.page.l3 .panel{aspect-ratio:16/11}
  .page.l3 .panel:first-child{grid-column:auto}
  .bookwrap{width:96vw}
  .bub,.cap{max-width:92%}
  .chal-inner{grid-template-columns:1fr}
  .mentor{position:relative;flex-direction:row;align-items:flex-end}
  .mentor .actor{height:120px;flex:none}
  .mentor .bub::after,.mentor .bub::before{display:none}
  .maker{grid-template-columns:1fr}
  .maker .preview .actor{height:200px}
  .pad button{height:52px;font-size:22px}
  .opts{grid-template-columns:1fr}
  .topbar .me b{display:none}
}

/* Play screen: other books & games run full-screen inside the signed-in hub */
#play{padding:0;position:fixed;inset:0;z-index:50;min-height:0;background:#17143a}
#playframe{display:block;width:100%;height:100%;border:0;background:#17143a}
body.playing{overflow:hidden}

/* ---- Lighting pass (Nov 2026): one light over scene + cats so everyone sits in the same air ---- */
.panel .light{position:absolute;inset:0;pointer-events:none}
.panel.t-day .light{background:radial-gradient(120% 90% at 85% 0%,rgba(255,244,205,.30),rgba(255,244,205,0) 60%);mix-blend-mode:screen}
.panel.t-dawn .light{background:linear-gradient(160deg,rgba(255,170,140,.30),rgba(255,214,170,.10) 45%,rgba(120,90,160,.14));mix-blend-mode:soft-light}
.panel.t-dusk .light{background:linear-gradient(180deg,rgba(80,50,140,.30),rgba(255,140,90,.22) 70%,rgba(60,30,80,.30));mix-blend-mode:multiply}
.panel.t-night .light{background:radial-gradient(90% 70% at 80% 10%,rgba(190,200,255,.9),rgba(70,80,160,.75) 75%);mix-blend-mode:multiply;opacity:.55}
.panel.indoor .light{background:radial-gradient(70% 60% at 50% 20%,rgba(255,210,140,.22),rgba(30,15,5,.35) 85%);mix-blend-mode:normal}
.panel .light{z-index:1}.panel .fx{z-index:2}.panel .actor.glow{z-index:2}.panel .halftone,.panel .vignette{z-index:3}.panel .textlayer{z-index:4}.panel .sfx{z-index:5}
</style>
</head>
<body>
<div class="sky-stars"></div>
<div id="app">

  <!-- LOGIN -->
  <section class="screen" id="login">
    <div class="title-wrap">
      <div class="logo">Paloma's Pages</div>
      <p class="tagline">Stories where your math has magic ✨</p>
      <div class="hero" id="hero"></div>
      <div class="card login-card">
        <div id="login-pick">
          <h2 style="margin:0 0 4px">Who's reading?</h2>
          <div class="tiles" id="tiles"></div>
          <div class="linkrow"><button class="btn ghost" id="btn-other">I'm someone else</button><button class="btn ghost btn-grown">Grown-ups</button></div>
        </div>
        <div id="login-name" class="hidden">
          <h2 style="margin:0 0 10px">What's your reader name?</h2>
          <input class="field" id="namefield" maxlength="20" autocomplete="off" placeholder="Your name">
          <div style="margin-top:14px"><button class="btn" id="btn-name-go">Next ▶</button></div>
          <div class="linkrow"><button class="btn ghost btn-back-login">◀ Back</button></div>
        </div>
        <div id="login-pics" class="hidden">
          <h2 style="margin:0" id="pics-title"></h2>
          <div class="note" id="pics-sub"></div>
          <div class="dots" id="pdots"></div>
          <div class="pics" id="pics"></div>
          <div class="msg" id="pics-msg"></div>
          <div class="linkrow"><button class="btn ghost btn-back-login">◀ Back</button><button class="btn ghost btn-grown">Forgot? Ask a grown-up</button></div>
        </div>
      </div>
    </div>
  </section>

  <!-- SHELF -->
  <section class="screen" id="shelf">
    <div class="topbar"></div>
    <div class="shelf">
      <h2>📚 Your Bookshelf</h2>
      <div class="books" id="books"></div>
      <div style="text-align:center;margin-top:26px"><button class="btn ghost btn-grown" style="color:#fff">Grown-up Corner</button></div>
    </div>
  </section>

  <!-- CHAPTERS -->
  <section class="screen" id="chapters">
    <div class="topbar"></div>
    <div class="shelf"><h2>The Glimmerfall · Chapters</h2><div class="chapters" id="chaplist"></div></div>
  </section>

  <!-- READER -->
  <section class="screen" id="reader">
    <div class="topbar"></div>
    <div class="bookwrap">
      <div class="chapter-head"><h2 id="chap-title"></h2></div>
      <div id="stage"></div>
      <div class="controls" id="reader-controls"></div>
    </div>
  </section>

  <!-- TRAINING -->
  <section class="screen" id="train">
    <div class="topbar"></div>
    <div class="shelf">
      <h2>🎯 Training Den</h2>
      <div class="skillgrid" id="skillgrid"></div>
      <div class="bookwrap" style="width:min(96vw,1100px)"><div id="trainstage"></div></div>
    </div>
  </section>

  <!-- PLAY (other books & games run here, inside the same sign-in) -->
  <section class="screen" id="play">
    <iframe id="playframe" title="Book" src="about:blank" allow="autoplay; fullscreen"></iframe>
  </section>

  <!-- GROWN-UPS -->
  <section class="screen" id="grown">
    <div class="gu">
      <div class="topbar"><button class="btn small" id="grown-back">◀ Back</button></div>
      <div id="growninner"></div>
    </div>
  </section>
</div>
<script>/* ============ ART: cats, scenes, effects (all hand-built SVG) ============ */
const Art = (() => {
  let uidN = 0;
  const uid = () => 'u' + (++uidN);

  function shade(hex, amt) { // amt -1..1
    let c = hex.replace('#', '');
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    let r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }
  function rng(seed) { // mulberry32
    let a = 0; for (const ch of String(seed)) a = (a * 31 + ch.charCodeAt(0)) | 0;
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  /* ---------- Sitting cat (naturalistic, 3/4 front, tail wrapped) ---------- */
  function cat(o = {}) {
    const id = uid();
    const fur = o.fur || '#b07a45';
    const dark = o.dark || shade(fur, -0.42);
    const deep = shade(fur, -0.62);
    const hi = shade(fur, 0.22);
    const pat = o.pattern || 'tabby';
    const light = o.light === undefined ? (pat === 'solid' ? null : '#f6efe4') : o.light;
    const soft = light || shade(fur, 0.32);
    const eye = o.eye || '#8fd14f';
    const patch = o.patch || '#2b2422';
    const ink = o.ink || shade(fur, -0.75);
    const expr = o.expr || 'normal';
    const lw = 1.7;
    const stripes = pat === 'tabby' || pat === 'tabbywhite';
    const whiteBits = (pat === 'tabbywhite' || pat === 'tuxedo' || pat === 'patches') && light;
    const bodyD = 'M72,118 C54,136 44,176 48,210 C50,228 66,236 98,236 C130,236 156,232 160,212 C164,182 152,148 132,124 C118,110 86,108 72,118 Z';
    const headD = 'M62,80 C60,60 72,46 98,44 C124,46 136,60 134,80 C134,92 128,104 118,110 C110,116 104,118 98,118 C92,118 86,116 78,110 C68,104 62,92 62,80 Z';
    const ruffD = 'M80,112 C72,126 70,146 76,160 L82,155 L84,166 L90,158 L94,171 L99,160 L104,170 L108,157 L114,163 L116,150 C124,138 124,124 116,112 Z';
    const ears = o.earsBack || expr === 'fierce' ? 'rotate(-14 72 60)' : expr === 'worried' ? 'rotate(-8 72 60)' : '';
    const earsR = o.earsBack || expr === 'fierce' ? 'rotate(14 124 60)' : expr === 'worried' ? 'rotate(8 124 60)' : '';
    let s = `<svg class="catsvg" viewBox="0 0 200 244" xmlns="http://www.w3.org/2000/svg"><defs>
<clipPath id="b${id}"><path d="${bodyD}"/></clipPath><clipPath id="h${id}"><path d="${headD}"/></clipPath>
<linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${shade(fur, -0.18)}"/><stop offset=".45" stop-color="${hi}"/><stop offset="1" stop-color="${shade(fur, -0.28)}"/></linearGradient>
<linearGradient id="v${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hi}"/><stop offset="1" stop-color="${shade(fur, -0.12)}"/></linearGradient>
<radialGradient id="e${id}" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="${shade(eye, 0.45)}"/><stop offset=".7" stop-color="${eye}"/><stop offset="1" stop-color="${shade(eye, -0.4)}"/></radialGradient>
<linearGradient id="w${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${soft}"/><stop offset="1" stop-color="${shade(soft, -0.1)}"/></linearGradient>
<radialGradient id="sh${id}"><stop offset="0" stop-color="#000" stop-opacity=".42"/><stop offset=".6" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="ao${id}" cx="50%" cy="30%"><stop offset="0" stop-color="${deep}" stop-opacity=".5"/><stop offset="1" stop-color="${deep}" stop-opacity="0"/></radialGradient>
</defs><ellipse cx="104" cy="237" rx="84" ry="10" fill="url(#sh${id})"/>`;
    const rimC = o.rim || '#fff6dc';
    // body
    s += `<path d="${bodyD}" fill="url(#g${id})" stroke="${ink}" stroke-width="${lw}"/>`;
    s += `<g clip-path="url(#b${id})">`;
    // haunch
    s += `<path d="M118,176 C132,160 162,170 164,202 C166,226 148,238 124,238 C114,220 110,196 118,176Z" fill="${shade(fur, -0.06)}"/><path d="M122,178 C138,170 156,182 158,200" stroke="${hi}" stroke-width="3" fill="none" opacity=".5"/>`;
    s += `<path d="M118,176 C132,160 162,170 164,202" stroke="${ink}" stroke-width="1.3" fill="none" opacity=".55"/>`;
    if (stripes) s += `<g stroke="${dark}" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".85"><path d="M52,150 C60,152 66,158 68,168"/><path d="M48,176 C58,177 64,184 66,193"/><path d="M50,202 C58,202 63,208 64,216"/><path d="M128,186 C138,183 148,190 152,202"/><path d="M126,204 C136,202 146,210 148,222"/><path d="M140,140 C134,146 132,154 132,160"/><path d="M90,124 C94,128 102,128 106,124"/></g>`;
    if (pat === 'patches') s += `<path d="M44,140 C60,128 76,150 70,176 C64,196 46,190 40,176Z" fill="${patch}"/><path d="M120,170 C140,158 170,180 160,214 C150,236 120,230 118,206Z" fill="${patch}"/>`;
    if (pat === 'speckled') { const r = rng(fur + eye); for (let i = 0; i < 34; i++) s += `<ellipse cx="${48 + r() * 112}" cy="${118 + r() * 115}" rx="${1.2 + r() * 2}" ry="${.8 + r() * 1.2}" fill="${dark}" opacity=".65"/>`; }
    // fur texture strokes
    s += `<g stroke="${deep}" stroke-width="1.1" fill="none" opacity=".35" stroke-linecap="round"><path d="M56,160 q3,6 1,12"/><path d="M52,186 q3,6 1,12"/><path d="M58,212 q3,5 1,10"/><path d="M146,150 q-3,6 -1,12"/><path d="M152,176 q-3,6 -1,12"/><path d="M138,212 q4,5 2,10"/></g>`;
    s += `<path d="${bodyD}" fill="none" stroke="${rimC}" stroke-width="7" opacity=".38" transform="translate(-3.5,3)"/>`; // rim light
    s += `<path d="M48,170 C50,215 70,236 100,236 C80,226 62,206 58,170Z" fill="${deep}" opacity=".18"/>`; // form shadow
    s += `</g>`;
    // chest ruff
    s += `<path d="${ruffD}" fill="${light ? `url(#w${id})` : soft}" stroke="${ink}" stroke-width="1" stroke-opacity=".35"/>`;
    s += `<g stroke="${shade(soft, -0.25)}" stroke-width="1" opacity=".6" fill="none"><path d="M86,128 l3,8"/><path d="M98,126 l0,9"/><path d="M110,128 l-3,8"/><path d="M90,142 l2,7"/><path d="M106,142 l-2,7"/></g>`;
    s += `<ellipse cx="98" cy="122" rx="30" ry="13" fill="url(#ao${id})"/>`; // shadow under the chin
    // front legs
    const legF = whiteBits ? `url(#w${id})` : `url(#v${id})`;
    s += `<path d="M80,154 C78,186 78,212 80,230 L95,230 C96,210 97,184 97,158 Z" fill="${legF}" stroke="${ink}" stroke-width="${lw}"/>`;
    s += `<path d="M101,158 C101,186 102,212 103,230 L118,230 C118,210 117,186 116,156 Z" fill="${legF}" stroke="${ink}" stroke-width="${lw}"/>`;
    if (stripes && !whiteBits) s += `<g stroke="${dark}" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M81,190 l14,0"/><path d="M81,204 l14,-1"/><path d="M103,192 l13,0"/><path d="M103,206 l14,-1"/></g>`;
    const pawF = light ? soft : hi;
    s += `<path d="M77,230 C77,224 98,224 98,230 C98,236 77,236 77,230Z" fill="${pawF}" stroke="${ink}" stroke-width="${lw}"/><path d="M100,230 C100,224 121,224 121,230 C121,236 100,236 100,230Z" fill="${pawF}" stroke="${ink}" stroke-width="${lw}"/>`;
    s += `<path d="M84,229 v4 M90,229 v4 M107,229 v4 M113,229 v4" stroke="${ink}" stroke-width=".9" opacity=".45"/>`;
    // tail wrapped around the front, tip curls up
    s += `<path d="M156,222 C170,228 168,240 144,240 C118,241 86,241 66,238 C58,237 56,232 62,230 C88,233 124,233 156,222Z" fill="url(#v${id})" stroke="${ink}" stroke-width="${lw}"/>`;
    if (stripes) s += `<g stroke="${dark}" stroke-width="3.5" opacity=".85"><path d="M140,233 l-2,7"/><path d="M118,234 l-1,7"/><path d="M96,234 l-1,7"/></g>`;
    s += `<g class="tail"><path d="M64,238 C50,236 42,224 48,214 C52,208 58,212 56,218 C54,226 60,231 68,231Z" fill="${o.tailTip || (stripes ? dark : `url(#v${id})`)}" stroke="${ink}" stroke-width="${lw}"/></g>`;
    // head
    s += `<g class="head">`;
    const ear = (side) => {
      const L = side === 'L';
      const m = x => L ? x : 196 - x;
      return `<g transform="${L ? ears : earsR}"><g class="ear${side}"><path d="M${m(64)},68 C${m(58)},50 ${m(57)},32 ${m(62)},16 C${m(72)},24 ${m(84)},36 ${m(92)},48 Z" fill="url(#v${id})" stroke="${ink}" stroke-width="${lw}" stroke-linejoin="round"/>
<path d="M${m(68)},60 C${m(65)},48 ${m(65)},36 ${m(67)},26 C${m(74)},33 ${m(81)},41 ${m(86)},49 Z" fill="${shade('#e8a5a8', -0.15)}" opacity=".85"/>
<g stroke="${soft}" stroke-width="1.2" stroke-linecap="round" opacity=".9"><path d="M${m(70)},56 l${L ? 5 : -5},-9"/><path d="M${m(73)},58 l${L ? 6 : -6},-7"/><path d="M${m(69)},52 l${L ? 3 : -3},-10"/></g>
${o.tufts ? `<path d="M${m(62)},16 l${L ? -2 : 2},-10" stroke="${ink}" stroke-width="2" stroke-linecap="round"/>` : ''}</g></g>`;
    };
    s += ear('L') + ear('R');
    // cheek fluff
    s += `<path d="M66,92 L52,98 L63,101 L54,109 L67,106 L62,115 L76,109 Z" fill="${shade(fur, -0.04)}" stroke="${ink}" stroke-width="1" stroke-opacity=".6"/>`;
    s += `<path d="M130,92 L144,98 L133,101 L142,109 L129,106 L134,115 L120,109 Z" fill="${shade(fur, -0.04)}" stroke="${ink}" stroke-width="1" stroke-opacity=".6"/>`;

  /* ---------- Scenes ---------- */

  function trees(r, y, n, c1, c2, minH, maxH, cls = '') {

  }
  function ferns(r, y0, n, col) {
    let s = '';

      const x = r() * 800, sc = 0.6 + r() * 0.8, rot = -20 + r() * 40;
      s += `<g transform="translate(${x},${y0 + r() * 20}) rotate(${rot}) scale(${sc})" class="sway" style="animation-delay:${-r() * 4}s">

  function scene(name, time = 'day', variant = '') {

<linearGradient id="gnd${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="${time === 'night' ? .35 : .22}"/></linearGradient>
<radialGradient id="sunglow${id}"><stop offset="0" stop-color="${sun}" stop-opacity=".75"/><stop offset=".35" stop-color="${sun}" stop-opacity=".25"/><stop offset="1" stop-color="${sun}" stop-opacity="0"/></radialGradient>

    const indoor = name === 'den' || name === 'elders';

        for (let i = 0; i < 9; i++) { const x = 60 + i * 85, l = 50 + r() * 50; s += `<path d="M${x},40 L${x},${40 + l}" stroke="#4a3322" stroke-width="2"/><g class="sway" style="animation-delay:${-r() * 3}s;transform-origin:${x}px 40px"><ellipse cx="${x}" cy="${46 + l}" rx="12" ry="22" fill="${['#6aa84f', '#93c47d', '#b6d7a8', '#c27ba0'][i % 4]}" opacity=".9"/></g>`; }

  /* ---------- 4.4B: products with 10 and 100 ---------- */
  function x10(theme) {
    const mode = pick(['times10', 'times100', 'times100', 'missing', 'tens', 'stones']);
    const cols4 = ['ten thousands', 'thousands', 'hundreds', 'tens', 'ones'];
    const digitsOf = (n) => { const s = String(n), d = {}; for (let i = 0; i < s.length; i++) d[cols4[cols4.length - s.length + i]] = s[i]; return d; };
    const chartFor = (a, mult, reveal = true) => {
      const p = a * mult, z = mult === 10 ? ['ones'] : ['tens', 'ones'];
      const dg = digitsOf(p); if (!reveal) for (const k in dg) dg[k] = '?';
      return Art.placeChart([{ label: F(a), digits: digitsOf(a) }, { label: `× ${mult}`, digits: dg, zero: z }], cols4, { arrow: `⬅ each digit moves ${mult === 10 ? '1 place' : '2 places'} left` });
    };
    if (mode === 'times10' || mode === 'times100') {
      const mult = mode === 'times10' ? 10 : 100;
      const a = mult === 10 ? pick([R(12, 99), R(101, 999), R(30, 90)]) : pick([R(6, 99), R(12, 75), R(101, 450)]);
      const ans = a * mult;
      const t = pick([
        `One patrol walks ${F(a)} pawsteps. ${mult === 10 ? 'Ten' : 'One hundred'} patrols each walk the same path. How many pawsteps is that in all?`,
        `${F(a)} × ${mult} = ?`,
        `Each of ${mult} fern patches has ${F(a)} seeds. How many seeds in all the patches?`,
        `The Owl Tree is ${F(a)} pawsteps from camp. The Great Sycamore is ${mult} times farther. How many pawsteps away is the Great Sycamore?`,
      ]);
      return {
        text: t, eq: `${F(a)} × ${mult}`, answer: ans, type: 'number',
        hint: `When you multiply by ${mult}, every digit slides ${mult === 10 ? 'ONE place' : 'TWO places'} to the left, and ${mult === 10 ? 'a zero fills' : 'zeros fill'} the empty spot${mult === 10 ? '' : 's'}.`,
        hintModel: chartFor(a, mult, false), stepsModel: chartFor(a, mult),
        steps: [`${F(a)} × ${mult}`, `Slide the digits ${mult === 10 ? '1 place' : '2 places'} left`, `Fill with ${mult === 10 ? 'one zero' : 'two zeros'}: ${F(ans)}`],
      };
    }

      return {
        text: pick([`Quailstar says: “I walked ${F(p)} pawsteps. That's ${mult} times as far as the stream.” How many pawsteps is it to the stream?`, `? × ${mult} = ${F(p)}. What number is missing?`]),
        eq: `? × ${mult} = ${F(p)}`, answer: a, type: 'number',
        hint: `Think backwards: which number slides ${mult === 10 ? '1 place' : '2 places'} left to become ${F(p)}? Take ${mult === 10 ? 'one zero' : 'two zeros'} off the end.`,
        stepsModel: chartFor(a, mult), steps: [`? × ${mult} = ${F(p)}`, `Undo × ${mult}: take ${mult === 10 ? '1 zero' : '2 zeros'} away`, `? = ${F(a)}`],
      };

      return {
        text: pick([`${a} hunting patrols each bring back ${b * m} seeds for the nursery. How many seeds is that?`, `${a} × ${F(b * m)} = ?`]),
        eq: `${a} × ${F(b * m)}`, answer: ans, type: 'number',
        hint: `Break ${F(b * m)} into ${b} × ${m}. First do ${a} × ${b} = ${a * b}. Then multiply by ${m}.`,
        hintModel: chartFor(a * b, m, false), stepsModel: chartFor(a * b, m), steps: [`${a} × ${F(b * m)} = ${a} × ${b} × ${m}`, `${a} × ${b} = ${a * b}`, `${a * b} × ${m} = ${F(ans)}`],
      };
    }

    return {
      text: `Only the safe stepping stone shows the right answer to ${F(a)} × ${mult}. Which stone is safe?`,
      eq: `${F(a)} × ${mult}`, answer: F(ans), type: 'choice',
      options: choices(F(ans), [F(a * (mult === 10 ? 100 : 10)), F(a * mult * 10), String(a) + '0' + (mult === 100 ? '' : '0') === F(ans) ? F(a + mult) : F(a + mult), F(a * mult / 10 + a)]),
      hint: `Count the zeros in ${mult}: there ${mult === 10 ? 'is 1' : 'are 2'}. The answer is ${F(a)} with ${mult === 10 ? '1 zero' : '2 zeros'} on the end.`,
      hintModel: chartFor(a, mult, false), stepsModel: chartFor(a, mult), steps: [`${mult} has ${mult === 10 ? 'one zero' : 'two zeros'}`, `${F(a)} → ${F(ans)}`],

  /* ---------- 4.2A: ten times / one-tenth ---------- */
  function place() {
    const mode = pick(['twin', 'twin', 'decimal', 'which']);
    const names = ['thousands', 'hundreds', 'tens', 'ones'];
    if (mode === 'twin') {
      const d = R(1, 9), i = R(0, 2), j = i + (i === 2 ? 1 : pick([1, 1, 2]));
      const digits = names.map(() => { let x; do x = R(1, 9); while (x === d); return x; });
      digits[i] = d; digits[j] = d;
      const num = +digits.join('');
      const leftFirst = Math.random() < 0.5;
      const [p1, p2] = leftFirst ? [i, j] : [j, i];
      const gap = Math.abs(i - j), times = gap === 1 ? '10 times' : '100 times', tenth = gap === 1 ? 'one-tenth of' : 'one-hundredth of';
      const ans = leftFirst ? times : tenth;
      const opts = gap === 1 ? ['10 times', 'one-tenth of', '100 times', 'the same as'] : ['100 times', 'one-hundredth of', '10 times', 'one-tenth of'];
      const v1 = d * 10 ** (3 - p1), v2 = d * 10 ** (3 - p2);
      const dg = {}; names.forEach((n, k) => dg[n] = digits[k]);
      return {
        text: `Mossbeard sets out the counting stones: ${F(num)}. The ${d} in the ${names[p1]} place is ____ the value of the ${d} in the ${names[p2]} place.`,
        answer: ans, type: 'choice', options: shuffle(opts),
        hint: `Find the value of each ${d}. The ${d} in the ${names[p1]} place is worth ${F(v1)}. The ${d} in the ${names[p2]} place is worth ${F(v2)}. Is ${F(v1)} bigger or smaller?`,
        model: Art.placeChart([{ label: F(num), digits: dg, hl: [names[p1], names[p2]] }], names),
        steps: [`${names[p1]}: ${d} is worth ${F(v1)}`, `${names[p2]}: ${d} is worth ${F(v2)}`, `${F(v1)} is ${ans} ${F(v2)}`],
      };
    }
    if (mode === 'decimal') {
      const d = R(1, 9);
      const pairs = [[`${d}`, `0.${d}`], [`0.${d}`, `0.0${d}`], [`${d}0`, `${d}`]];
      const [big, small] = pick(pairs);
      const askBig = Math.random() < 0.5;
      return {
        text: askBig ? `Sagefur measures herbs. ${big} is ____ ${small}.` : `Sagefur measures herbs. ${small} is ____ ${big}.`,
        answer: askBig ? '10 times' : 'one-tenth of', type: 'choice', options: shuffle(['10 times', 'one-tenth of', '100 times', 'one-hundredth of']),
        hint: `Each place is 10 times the place to its right. Moving ONE place left = 10 times bigger. Moving ONE place right = one-tenth.`,
        model: Art.placeChart([{ label: big, digits: big.includes('.') ? { ones: big.split('.')[0], point: '', tenths: (big.split('.')[1] || '')[0], hundredths: (big.split('.')[1] || '')[1] } : (big.length === 2 ? { tens: big[0], ones: big[1] } : { ones: big }) }, { label: small, digits: small.includes('.') ? { ones: small.split('.')[0], point: '', tenths: (small.split('.')[1] || '')[0], hundredths: (small.split('.')[1] || '')[1] } : { ones: small } }], ['tens', 'ones', 'point', 'tenths', 'hundredths']),
        steps: [`${big} has the ${d} one place to the LEFT of ${small}`, `So ${big} = 10 × ${small}`],
      };
    }
    // which number has digit worth 10x
    const d = R(2, 9);
    let base; do base = R(1000, 9999); while (!String(base).slice(1, 3).includes(String(d)) || String(base)[3] === String(d));
    const s = String(base), pos = s.indexOf(String(d), 1); // place in base
    const target = pos - 1; // one place to the left
    const make = (p) => { let t; do { const arr = [R(1, 9), R(0, 9), R(0, 9), R(0, 9)]; for (let k = 0; k < 4; k++) if (arr[k] === d) arr[k] = (d % 9) + 1; arr[p] = d; t = arr.join(''); } while (t[0] === '0'); return F(+t); };
    const ans = make(target);
    return {
      text: `Which number has a ${d} that is worth 10 times the ${d} in ${F(base)}?`,
      answer: ans, type: 'choice', options: choices(ans, [0, 1, 2, 3].filter(p => p !== target).map(make)),
      hint: `In ${F(base)}, the ${d} is in the ${names[pos]} place (worth ${F(d * 10 ** (3 - pos))}). Ten times that is ${F(d * 10 ** (4 - pos))}, so look for a ${d} in the ${names[target]} place.`,
      model: Art.placeChart([{ label: F(base), digits: Object.fromEntries(names.map((n, k) => [n, s[k]])), hl: [names[pos]] }], names),
      steps: [`${d} in ${names[pos]} = ${F(d * 10 ** (3 - pos))}`, `10 × ${F(d * 10 ** (3 - pos))} = ${F(d * 10 ** (4 - pos))}`, `That's a ${d} in the ${names[target]} place: ${ans}`],
    };
  }

  /* ---------- 4.4C: area models ---------- */
  function area(theme) {
    const mode = pick(['total', 'total', 'cell', 'equation', 'square']);
    let a = R(12, 38), b = R(11, 19);
    if (a % 10 === 0) a++; if (b % 10 === 0) b++;
    if (mode === 'square') { a = b = R(11, 15); }
    const at = a - a % 10, ao = a % 10, bt = b - b % 10, bo = b % 10;
    const parts = { tt: at * bt, to: at * bo, ot: ao * bt, oo: ao * bo };
    const ctx = theme === 'rocks'
      ? `The fallen rocks are stacked in a block ${a} rows tall and ${b} stones wide.`
      : `The seed meadow has ${a} rows with ${b} seed-heads in each row.`;
    const unit = theme === 'rocks' ? 'stones' : 'seed-heads';
    const allShown = { tt: true, to: true, ot: true, oo: true };
    const steps = [`(${at} + ${ao}) × (${bt} + ${bo})`, `${at}×${bt}=${F(parts.tt)}, ${at}×${bo}=${F(parts.to)}, ${ao}×${bt}=${F(parts.ot)}, ${ao}×${bo}=${F(parts.oo)}`, `${F(parts.tt)} + ${F(parts.to)} + ${F(parts.ot)} + ${F(parts.oo)} = ${F(a * b)}`];
    if (mode === 'total' || mode === 'square') {
      return {
        text: mode === 'square' ? `A perfect square! ${theme === 'rocks' ? 'The rock pile' : 'This meadow patch'} is ${a} by ${a}. How many ${unit} in all? (${a} × ${a})` : `${ctx} How many ${unit} in all? (${a} × ${b})`,
        eq: `${a} × ${b}`, answer: a * b, type: 'number',
        model: Art.areaModel(a, b, {}),
        hint: `Split ${a} into ${at} + ${ao} and ${b} into ${bt} + ${bo}. Find the 4 small rectangles, then ADD all four.`,
        hintModel: Art.areaModel(a, b, { tt: true, to: true, ot: '?', oo: '?' }),
        stepsModel: Art.areaModel(a, b, allShown), steps,
      };
    }
    if (mode === 'cell') {
      const key = pick(['to', 'ot', 'oo', 'tt']);
      const show = { ...allShown, [key]: '?' };
      const lab = { tt: [at, bt], to: [at, bo], ot: [ao, bt], oo: [ao, bo] }[key];
      return {
        text: `${ctx} Cloverwhisk drew an area model to count them. What number belongs in the box with the “?”`,
        answer: parts[key], type: 'number', model: Art.areaModel(a, b, show),
        hint: `Look at the number above the “?” box and the number beside it. Multiply them: ${lab[0]} × ${lab[1]}.`,
        steps: [`The ? box is ${lab[0]} rows × ${lab[1]} columns`, `${lab[0]} × ${lab[1]} = ${F(parts[key])}`],
      };
    }
    const right = `(${at} + ${ao}) × (${bt} + ${bo})`;
    return {
      text: `${ctx} Which equation matches this area model?`,
      answer: right, type: 'choice', model: Art.areaModel(a, b, {}),
      options: choices(right, [`(${at} × ${bt}) + (${ao} × ${bo})`, `(${at} + ${ao}) + (${bt} + ${bo})`, `${a} × ${bt} + ${bo}`]),
      hint: `The whole rectangle is ${a} by ${b}. The sides are split into ${at} + ${ao} and ${bt} + ${bo}. Watch out: (${at}×${bt}) + (${ao}×${bo}) forgets two of the four boxes!`,
      stepsModel: Art.areaModel(a, b, allShown), steps: [`Sides: ${at} + ${ao} and ${bt} + ${bo}`, `Equation: ${right}`],
    };
  }

  /* ---------- 4.4F: division algorithm ---------- */
  function divide(theme) {
    const d = R(2, 9);
    const q = pick([R(104, 399), R(112, 999), R(21, 99) * 10 + R(1, 9)]);
    const D = d * q;
    if (D > 9999) return divide(theme);
    const t = pick([
      `Sagefur has ${F(D)} poppy seeds. She splits them equally into ${d} bundles. How many seeds go in each bundle?`,
      `${F(D)} ÷ ${d} = ?`,
      `${d} cats share the work of moving ${F(D)} pebbles equally. How many pebbles does each cat move?`,
      `The elders counted ${F(D)} stars over ${d} nights, the same number each night. How many stars each night?`,
    ]);
    // partial quotients
    let left = D; const rows = [];
    for (const place of [1000, 100, 10, 1]) {
      const k = Math.floor(left / (d * place));
      if (k > 0) { rows.push([k * place, d * k * place]); left -= d * k * place; }
    }
    return {
      text: t, eq: `${F(D)} ÷ ${d}`, answer: q, type: 'number',
      hint: `Use friendly chunks! How many groups of ${d} fit into ${F(D)}? Try ${d} × 100 = ${F(d * 100)} first and take it away. Keep going with tens, then ones.`,
      steps: [`${F(D)} ÷ ${d}`, ...rows.map(([qq, sub]) => `take away ${d} × ${F(qq)} = ${F(sub)}`), `add the chunks: ${rows.map(r => F(r[0])).join(' + ')} = ${F(q)}`],
      hintModel: partialQuotientSVG(D, d, rows.slice(0, 1), true), stepsModel: partialQuotientSVG(D, d, rows),
    };
  }
  function partialQuotientSVG(D, d, rows, more) {
    const h = 44 + (rows.length + (more ? 1 : 0)) * 56;
    let s = `<svg class="model" viewBox="0 0 360 ${h}" xmlns="http://www.w3.org/2000/svg"><text x="20" y="30" font-size="22" font-weight="800" fill="#3b2a5a">${d} ) ${F(D)}</text><line x1="40" y1="8" x2="40" y2="${h - 6}" stroke="#3b2a5a" stroke-width="2"/>`;
    let left = D, y = 60;
    rows.forEach(([qq, sub], i) => {
      left -= sub;
      s += `<text x="150" y="${y}" font-size="18" text-anchor="end" fill="#e76f51" font-weight="700">− ${F(sub)}</text><line x1="70" y1="${y + 8}" x2="160" y2="${y + 8}" stroke="#3b2a5a" stroke-width="2"/><text x="150" y="${y + 30}" font-size="18" text-anchor="end" fill="#2b1d3d" font-weight="700">${F(left)}</text>`;
      s += `<rect x="200" y="${y - 20}" width="130" height="28" rx="8" fill="#e8f6e8"/><text x="265" y="${y}" text-anchor="middle" font-size="16" fill="#2a7a3a" font-weight="700">${d} × ${F(qq)}</text>`;
      y += 56;
    });
    if (more) s += `<text x="265" y="${y - 20}" text-anchor="middle" font-size="16" fill="#5b3f8a" font-weight="700">keep going…</text>`;
    return s + '</svg>';
  }

  /* ---------- 4.4H: interpreting remainders ---------- */
  function remainder(theme) {
    let g = R(3, 8), q = R(4, 9), r = R(1, g - 1); const t = g * q + r;
    const kind = pick(['trips', 'left', 'full', 'trips']);
    const tmpl = {
      trips: [
        `There are ${t} soaked moss balls. Each cat can carry ${g} at a time. How many trips are needed to carry ALL the moss?`,
        `${t} cats need to cross the log bridge. Only ${g} cats fit on it at once. How many crossings will it take to get everyone across?`,
        `${t} apprentices are climbing to safety. Each branch can hold ${g} cats. How many branches are needed so EVERY cat has a spot?`],
      left: [
        `Sagefur shares ${t} herbs equally into bundles of ${g}. How many herbs are LEFT OVER?`,
        `${t} feathers are sorted into nests of ${g}. How many feathers are left over after the nests are full?`],
      full: [
        `The elders want piles of exactly ${g} feathers for bedding. With ${t} feathers, how many FULL piles can be made?`,
        `Pebblepaw splits ${t} acorns into groups of ${g} to throw at the fox. How many FULL groups can he make?`],
    }[kind];
    const ans = kind === 'trips' ? q + 1 : kind === 'left' ? r : q;
    const why = kind === 'trips' ? `The leftover ${r} still need a trip, so add 1 more: ${q} + 1 = ${q + 1}.` : kind === 'left' ? `The remainder is what's left over: ${r}.` : `Only full groups count, so ignore the remainder: ${q}.`;
    return {
      text: pick(tmpl), eq: `${t} ÷ ${g}`, answer: ans, type: 'number',
      hint: `First divide: ${t} ÷ ${g} = ? with a remainder. Then ask yourself: does the question want the groups, the leftovers, or does EVERY one need a spot?`,
      hintModel: Art.groups(t, g), steps: [`${t} ÷ ${g} = ${q} R${r}`, why],
    };
  }

  /* ---------- 4.4H: two-step ---------- */
  function multistep(theme) {
    const mode = pick(['share', 'left', 'three']);
    if (mode === 'share') {
      const k = R(2, 6), m = R(3, 9); let p; do p = R(3, 9); while ((p * m) % k);
      const tot = p * m, ans = tot / k;
      return { text: `${p} hunting patrols each caught ${m} mice. They shared ALL the mice equally among ${k} dens. How many mice does each den get?`, answer: ans, type: 'number',
        hint: `Step 1: How many mice in all? (${p} × ${m}). Step 2: Share them into ${k} equal dens.`, steps: [`Step 1: ${p} × ${m} = ${tot}`, `Step 2: ${tot} ÷ ${k} = ${ans}`],
        model: Art.strip(Array.from({ length: k }, (_, i) => ({ v: i === 0 ? '?' : '', w: 1, c: '#d7f5cf' })), `${p} × ${m} = ?`) };
    }
    if (mode === 'left') {
      const p = R(3, 8), m = R(4, 12), e = R(5, p * m - 5), ans = p * m - e;
      return { text: `${p} patrols brought back ${m} pieces of fresh-kill each. The Clan ate ${e} pieces. How many are left on the pile?`, answer: ans, type: 'number',
        hint: `Step 1: Multiply to find how many were brought back. Step 2: Subtract the ${e} that were eaten.`, steps: [`Step 1: ${p} × ${m} = ${p * m}`, `Step 2: ${p * m} − ${e} = ${ans}`],
        model: Art.strip([{ v: String(e), w: e, c: '#ffd0dc' }, { v: 'p', w: Math.max(ans, e * 0.4), c: '#d7f5cf' }], `${p} × ${m} = ${p * m}`) };
    }
    const a = R(3, 8), d = R(2, 6), n = R(2, 5), ans = a * d * n;
    return { text: `Each apprentice gathers ${a} moss balls a day. ${n} apprentices gather moss for ${d} days. How many moss balls in all?`, answer: ans, type: 'number',
      hint: `Step 1: How many does ONE apprentice gather in ${d} days? Step 2: Multiply by ${n} apprentices.`, steps: [`Step 1: ${a} × ${d} = ${a * d}`, `Step 2: ${a * d} × ${n} = ${ans}`] };
  }

  /* ---------- 4.5A: strip diagrams ---------- */
  function strip(theme) {
    const mode = pick(['parts', 'equal', 'eqchoice', 'eqchoice']);
    const L = pick(['m', 'n', 'p', 's']);
    if (mode === 'parts') {
      const a = R(120, 380), b = R(90, 300), m = R(60, 280), T = a + b + m;
      return { text: `The whole border is ${F(T)} pawsteps long. In the morning the patrol marked ${a}. After sunhigh they marked ${b}. The rest is ${L}. How many pawsteps are left to mark?`,
        answer: m, type: 'number', model: Art.strip([{ v: String(a), w: a, c: '#cfe8ff' }, { v: String(b), w: b, c: '#ffe1a8' }, { v: L, w: m, c: '#d7f5cf' }], F(T)),
        hint: `The whole strip is ${F(T)}. Take away the parts you know: ${F(T)} − ${a} − ${b} = ${L}.`, steps: [`${F(T)} − ${a} = ${F(T - a)}`, `${F(T - a)} − ${b} = ${m}`, `${L} = ${m}`] };
    }
    if (mode === 'equal') {
      const k = R(3, 6), n = R(14, 65), T = k * n;
      return { text: `${k} apprentices each mark the same length of border. Together they mark ${F(T)} pawsteps. How long is each part, ${L}?`,
        answer: n, type: 'number', model: Art.strip(Array.from({ length: k }, () => ({ v: L, w: 1, c: '#d7f5cf' })), F(T)),
        hint: `There are ${k} equal parts that make ${F(T)}. So ${k} × ${L} = ${F(T)}. Divide to find ${L}.`, steps: [`${k} × ${L} = ${F(T)}`, `${L} = ${F(T)} ÷ ${k} = ${n}`] };
    }
    const sub = Math.random() < 0.5;
    if (sub) {
      const a = R(120, 400), m = R(80, 300), T = a + m;
      const right = `${F(T)} − ${a} = ${L}`;
      return { text: `Which equation matches the strip diagram?`, answer: right, type: 'choice',
        model: Art.strip([{ v: String(a), w: a, c: '#cfe8ff' }, { v: L, w: m, c: '#d7f5cf' }], F(T)),
        options: choices(right, [`${F(T)} + ${a} = ${L}`, `${a} − ${L} = ${F(T)}`, `${L} + ${F(T)} = ${a}`]),
        hint: `The top number (${F(T)}) is the WHOLE. ${a} is one part, ${L} is the other part. Whole minus a part = the other part.`, steps: [`Whole = ${F(T)}, part = ${a}`, right] };
    }
    const k = R(3, 6), n = R(12, 40), T = k * n, right = `${k} × ${L} = ${F(T)}`;
    return { text: `Which equation matches the strip diagram?`, answer: right, type: 'choice',
      model: Art.strip(Array.from({ length: k }, () => ({ v: L, w: 1, c: '#d7f5cf' })), F(T)),
      options: choices(right, [`${F(T)} × ${k} = ${L}`, `${k} + ${L} = ${F(T)}`, `${L} − ${k} = ${F(T)}`]),
      hint: `There are ${k} equal boxes, each worth ${L}, and together they make ${F(T)}.`, steps: [`${k} equal parts of ${L}`, right] };
  }

  /* ---------- 4.4A: add/subtract decimals & whole numbers ---------- */
  function decimals(theme) {
    const mode = pick(['subUneven', 'subUneven', 'add', 'whole']);
    const cents = v => Math.round(v * 100);
    const toS = c => (c / 100).toFixed(2).replace(/\.?0+$/, m => m.startsWith('.') ? '' : m);
    const colTable = (top, bot, op, res) => {
      const pad = s => { let [w, f = ''] = String(s).split('.'); return { w, f: (f + '00').slice(0, 2) }; };
      const A = pad(top), B = pad(bot), C = res === undefined ? null : pad(res);
      const width = Math.max(A.w.length, B.w.length, C ? C.w.length : 0);
      const line = (x, o) => (o + ' ').padStart(2) + x.w.padStart(width) + '.' + x.f;
      return `<pre class="cols">${line(A, ' ')}\n${line(B, op)}\n${'─'.repeat(width + 5)}\n${C ? line(C, ' ') : ''}</pre>`;
    };
    if (mode === 'subUneven') {
      const a = R(31, 89) / 10, b = R(105, Math.floor(a * 100) - 20) / 100;
      const ans = (cents(a) - cents(b)) / 100;
      return { text: pick([`Last moon the stream was ${a} tail-lengths deep. Now it is only ${toS(cents(b))} tail-lengths deep. How much did it drop?`, `${a} − ${toS(cents(b))} = ?`]),
        answer: ans, type: 'decimal', model: colTable(a, toS(cents(b)), '−'),
        hint: `Line up the DECIMAL POINTS! ${a} has only one digit after the point, so write it as ${a.toFixed(2)} (add a zero). Then subtract, regrouping if you need to.`,
        steps: [`${a} = ${a.toFixed(2)}`, `${a.toFixed(2)} − ${toS(cents(b))}`, `= ${toS(cents(ans))}`], stepsModel: colTable(a.toFixed(2), toS(cents(b)), '−', toS(cents(ans))) };
    }
    if (mode === 'add') {
      const a = R(105, 690) / 100, b = pick([R(12, 89) / 10, R(105, 690) / 100]);
      const ans = (cents(a) + cents(b)) / 100;
      return { text: `Minnowpaw's measuring stick shows ${toS(cents(a))} tail-lengths. Then the water rises ${toS(cents(b))} more. How deep is it now?`,
        answer: ans, type: 'decimal', model: colTable(toS(cents(a)), toS(cents(b)), '+'),
        hint: `Line up the decimal points, fill empty spots with zeros, then add from the right. Don't forget to carry!`,
        steps: [`${toS(cents(a))} + ${toS(cents(b))}`, `= ${toS(cents(ans))}`], stepsModel: colTable(toS(cents(a)), toS(cents(b)), '+', toS(cents(ans))) };
    }
    const a = pick([R(2, 9) * 1000 + R(0, 9), R(3, 9) * 1000 + R(10, 99), R(2, 8) * 1000 + R(100, 300)]), b = R(1100, a - 200);
    return { text: pick([`GlenClan counted ${F(a)} fish in the stream last moon. This moon there are ${F(b)}. How many fewer fish are there now?`, `${F(a)} − ${F(b)} = ?`]),
      answer: a - b, type: 'number', model: colTable(a, b, '−'),
      hint: `Line up the places. When the top digit is smaller, regroup (borrow) from the next place. Zeros may need to borrow across!`,
      steps: [`${F(a)} − ${F(b)}`, `= ${F(a - b)}`] };
  }

  const GEN = { x10, place, area, divide, remainder, multistep, strip, decimals };

  function make(skill, theme) {
    const p = GEN[skill](theme);
    p.skill = skill;
    if (p.type === 'decimal') p.type = 'number';
    if (p.type === 'choice' && p.options) p.options = p.options.map(String);
    return p;
  }
  function check(p, input) {
    if (p.type === 'choice') return String(input) === String(p.answer);
    const v = parseFloat(String(input).replace(/,/g, ''));
    return isFinite(v) && Math.abs(v - Number(p.answer)) < 0.001;
  }
  /* Adaptive pick: weight by importance and recent misses */
  function pickSkill(stats, enabled) {
    const keys = Object.keys(SKILLS).filter(k => !enabled || enabled.includes(k));
    const w = keys.map(k => {
      const st = stats[k] || { recent: [] }; const rec = (st.recent || []).slice(-6);
      const acc = rec.length ? rec.filter(Boolean).length / rec.length : 0.5;
      return SKILLS[k].weight * (0.5 + 2 * (1 - acc));
    });
    let t = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < keys.length; i++) { t -= w[i]; if (t <= 0) return keys[i]; }
    return keys[0];
  }
  function weakest(stats, n, enabled) {
    const keys = Object.keys(SKILLS).filter(k => !enabled || enabled.includes(k));
    return keys.map(k => { const rec = ((stats[k] || {}).recent || []).slice(-6); const acc = rec.length ? rec.filter(Boolean).length / rec.length : 0.4; return [k, acc - SKILLS[k].weight * 0.04 + Math.random() * 0.05]; })
      .sort((a, b) => a[1] - b[1]).slice(0, n).map(x => x[0]);
  }
  return { SKILLS, make, check, pickSkill, weakest, R, pick, shuffle };
})();

let playing = null;
function openGame(gm) {
  save(true); Voice.stop(); playing = gm;
  const f = $('#playframe'); f.title = gm.title; f.src = gm.url;
  show('play'); document.body.classList.add('playing');
}
function closeGame() {
  if (!playing) return; playing = null;
  document.body.classList.remove('playing'); $('#playframe').src = 'about:blank';
  save(true); goShelf();
}
// The bridge the book pages talk to (same site, so they can reach it directly).
window.PPHub = {
  reader: () => S.name,
  load: id => { const d = S.p && (S.p.games || {})[id]; return d ? JSON.parse(JSON.stringify(d)) : null; },
  save: (id, data) => { if (!S.p) return; S.p.games = S.p.games || {}; S.p.games[id] = Object.assign(JSON.parse(JSON.stringify(data)), { _t: Date.now() }); save(); },
  exit: () => closeGame(),
};
// When cloud and this-device copies differ, keep the newer save for each book.
function mergeGames(a, b) {
  const out = Object.assign({}, (a && a.games) || {});
  Object.entries((b && b.games) || {}).forEach(([k, v]) => { if (!out[k] || (v && (v._t || 0) > (out[k]._t || 0))) out[k] = v; });
  return out;
}

function boot() {
  addStarsBg(); renderLogin(); show('login');
  $('#btn-other').onclick = () => { $('#login-pick').classList.add('hidden'); $('#login-name').classList.remove('hidden'); $('#namefield').focus(); };
  $('#btn-name-go').onclick = () => { const n = $('#namefield').value.trim(); if (n) startPics(n[0].toUpperCase() + n.slice(1)); };
  $('#namefield').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btn-name-go').click(); });
  $$('.btn-back-login').forEach(b => b.onclick = () => renderLogin());
  $$('.btn-grown').forEach(b => b.onclick = () => grownups());
  $('#grown-back').onclick = () => { parentPin = null; S.p ? goShelf() : (renderLogin(), show('login')); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.p) save(true); });
}
window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
